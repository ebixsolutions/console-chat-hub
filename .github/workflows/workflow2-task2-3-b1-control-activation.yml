name: Workflow2 Task2.3 B1 Control Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow2-task2-3-b1-control-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONTROL_PRIMARY: ${{ secrets.SINGAPORE_SERVICE_ROLE_SECRET }}
      CONTROL_SECONDARY: ${{ secrets.KB_SINGAPORE_SERVICE_ROLE_SECRET }}
      CONTROL_LEGACY_SERVICE: ${{ secrets.SERVICE_ROLE_SECRET }}
      CONTROL_BEARER: ${{ secrets.SINGAPORE_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve existing control credential without disclosure
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          python - <<'PY'
          import os
          choices=[
            ('SINGAPORE_SERVICE_ROLE_SECRET', os.environ.get('CONTROL_PRIMARY','')),
            ('KB_SINGAPORE_SERVICE_ROLE_SECRET', os.environ.get('CONTROL_SECONDARY','')),
            ('SERVICE_ROLE_SECRET', os.environ.get('CONTROL_LEGACY_SERVICE','')),
            ('SINGAPORE_BACKEND_TOKEN', os.environ.get('CONTROL_BEARER','')),
          ]
          selected=None
          for name,value in choices:
              value=value.strip()
              if value:
                  if len(value)<16 or len(value)>4096 or any(c in value for c in '\r\n\0'):
                      raise SystemExit('FAIL_INVALID_CONTROL_SECRET_FORMAT:'+name)
                  selected=(name,value)
                  break
          print('B1_GITHUB_CONTROL_SOURCE=' + (selected[0] if selected else 'MISSING'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('present=' + ('1' if selected else '0') + '\n')
              f.write('name=' + (selected[0] if selected else '') + '\n')
          if selected:
              with open(os.environ['GITHUB_ENV'],'a') as f:
                  f.write('SELECTED_CONTROL_NAME=' + selected[0] + '\n')
                  # GitHub masks secret-derived values; do not print this variable.
                  f.write('SELECTED_CONTROL_VALUE=' + selected[1] + '\n')
          PY

      - name: Stop when no external credential exists
        if: steps.credential.outputs.present != '1'
        shell: bash
        run: |
          echo 'STOP_B1_EXTERNAL_CONTROL_CREDENTIAL_ABSENT'
          exit 3

      - name: Install control credential into production Edge runtime
        if: steps.credential.outputs.present == '1'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" \
            "$SELECTED_CONTROL_NAME=$SELECTED_CONTROL_VALUE"
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" --output json > /tmp/secrets.json
          SELECTED_CONTROL_NAME="$SELECTED_CONTROL_NAME" python - <<'PY'
          import json,os
          rows=json.load(open('/tmp/secrets.json'))
          names={str(x.get('name') or '') for x in rows}
          name=os.environ['SELECTED_CONTROL_NAME']
          assert name in names, name
          print('B1_EDGE_RUNTIME_SECRET_NAME=PASS')
          print('B1_EDGE_RUNTIME_SOURCE=' + name)
          PY

      - name: Activation result
        if: steps.credential.outputs.present == '1'
        run: echo 'B1_CONTROL_ACTIVATION=PASS'
