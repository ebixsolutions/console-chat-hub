name: Task 4.1 Bundle Generate Reply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task4-1-bundle-generate-reply.yml'
      - 'supabase/functions/generate-reply/index.ts'
      - 'supabase/functions/_shared/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bundle local Edge dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/generated
          npx esbuild supabase/functions/generate-reply/index.ts \
            --bundle \
            --platform=neutral \
            --format=esm \
            --target=es2022 \
            '--external:https://*' \
            '--external:http://*' \
            '--external:npm:*' \
            '--external:jsr:*' \
            --outfile=supabase/functions/generated/task4-1-generate-reply.bundle.ts
          npx esbuild supabase/functions/generate-reply/index.ts \
            --bundle \
            --minify \
            --platform=neutral \
            --format=esm \
            --target=es2022 \
            '--external:https://*' \
            '--external:http://*' \
            '--external:npm:*' \
            '--external:jsr:*' \
            --outfile=supabase/functions/generated/task4-1-generate-reply.deploy.ts
          for f in supabase/functions/generated/task4-1-generate-reply.bundle.ts supabase/functions/generated/task4-1-generate-reply.deploy.ts; do
            test -s "$f"
            if grep -q 'hvmtoqiwdqvgnjepxwrc' "$f"; then
              echo "FAIL: legacy Supabase ref found in $f" >&2
              exit 1
            fi
          done
          grep -q 'ENABLE_KB_ADAPTER.*false' supabase/functions/generated/task4-1-generate-reply.bundle.ts
          grep -q 'GENERATION_MAX_TOKENS_DEFAULT = 2048' supabase/functions/generated/task4-1-generate-reply.bundle.ts
          wc -c supabase/functions/generated/task4-1-generate-reply.deploy.ts
      - name: Commit immutable deploy bundles
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- supabase/functions/generated/task4-1-generate-reply.bundle.ts supabase/functions/generated/task4-1-generate-reply.deploy.ts)" ]]; then
            echo 'Bundles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/generated/task4-1-generate-reply.bundle.ts supabase/functions/generated/task4-1-generate-reply.deploy.ts
          git commit -m 'Task 4.1: refresh generate-reply deploy bundles'
          git push origin HEAD:main
