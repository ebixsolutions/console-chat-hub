name: Director Warm Handoff Final Remaining Gates v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/director-warm-handoff-final-remaining-gates-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_ORIGIN: https://console-chat-hub.lovable.app
      CHANNEL_ID: b0000000-0000-0000-0000-000000000001
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run final remaining production gates
        shell: bash
        run: bash scripts/director-warm-handoff-final-remaining.sh
