name: Workflow7 Source Export
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow7-source-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply and validate Workflow7 repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum supabase/functions/_shared/conversation-runtime-state.ts | awk '{print $1}')" = "d0e51bb04f2112b9ebea332ec33c8879e58dbd48acd4d4fdeb5d51d849f1aff8"
          test "$(sha256sum supabase/functions/_shared/canonical-grounding.ts | awk '{print $1}')" = "8679ef5417e44a6894545e58a1b8c11a964585adefac4fa3d1bb903f79d49577"
          test "$(sha256sum supabase/functions/generate-reply/index.ts | awk '{print $1}')" = "f4ebcc1b7fcc923bb806091a788e70e87ceb4c02ecf0f4cdad6677053d1c3d93"
          patch --dry-run -p1 < .github/patches/workflow7-published-kb-context.patch
          patch -p1 < .github/patches/workflow7-published-kb-context.patch
          git diff --check
          deno test --allow-read tests/edge/workflow7-published-kb-context-integrity.test.ts
          deno test --allow-read tests/edge/workflow5-multilingual-privacy.test.ts
          deno test --allow-read tests/edge/task4-1-current-context-memory.test.ts
          deno test --allow-read tests/edge/task4-1-context-requirements-followup.test.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          test "$(sha256sum supabase/functions/_shared/conversation-runtime-state.ts | awk '{print $1}')" = "cac6fc03400df1009e34d19aa0d3bc018c6b03428d6a83e4e5b8858b371615f0"
          test "$(sha256sum supabase/functions/_shared/canonical-grounding.ts | awk '{print $1}')" = "2f901244f9c5f5f93ec5cdc2aa4f0f793662a5bdfd08541dcba3635e8503e88d"
          test "$(sha256sum supabase/functions/generate-reply/index.ts | awk '{print $1}')" = "8032c2ddcd6f5dd33f3a60e270a0d5092bac68b462b96ff12968a187c9f263a5"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' supabase/functions/_shared/canonical-grounding.ts supabase/functions/_shared/conversation-runtime-state.ts supabase/functions/generate-reply/index.ts | sort)"
          test "$changed" = "$expected"
      - name: Commit validated Workflow7 functional source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ebixsolutions-workflow7"
          git config user.email "64578119+ebixsolutions@users.noreply.github.com"
          git add supabase/functions/_shared/conversation-runtime-state.ts supabase/functions/_shared/canonical-grounding.ts supabase/functions/generate-reply/index.ts
          git commit -m "fix: stabilize published KB retrieval and context integrity [skip ci]"
          git push origin HEAD:main

# consolidated-patch-v1
