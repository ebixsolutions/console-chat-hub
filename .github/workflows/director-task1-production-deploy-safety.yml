name: Director Task 1 Production Deploy Safety

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        type: choice
        options:
          - task1
          - c3
        default: task1
      authorized_head:
        description: Exact authorized commit SHA (required for c3)
        required: false
        type: string
      authorized_tree:
        description: Exact authorized tree SHA (required for c3)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/director-task1-production-deploy-safety.yml'

permissions:
  contents: read

env:
  PROJECT_REF: nrfxhqabwblzxoushgnm
  PROD_ORIGIN: https://console-chat-hub.lovable.app
  CHANNEL_ID: b0000000-0000-0000-0000-000000000001
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  task1-final-gate:
    if: github.event_name == 'push' || inputs.mode == 'task1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Deployment preconditions only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -s supabase/functions/generate-reply/index.ts
          test -s supabase/functions/_shared/prior-grounded-transform.ts
          test -s supabase/functions/_shared/conversation-semantic-contract.ts
          test -s supabase/functions/_shared/citation-lineage.ts
          grep -q 'resolvePriorGroundedTransform' supabase/functions/generate-reply/index.ts
          grep -q 'prior_grounded_transform' supabase/functions/_shared/prior-grounded-transform.ts
          grep -q 'verify_jwt = true' <(awk '/\[functions.generate-reply\]/{f=1;next} /^\[/{f=0} f' supabase/config.toml)
          git rev-parse HEAD | tee /tmp/task1-main-commit.txt
          sha256sum \
            supabase/functions/generate-reply/index.ts \
            supabase/functions/_shared/prior-grounded-transform.ts \
            supabase/functions/_shared/conversation-semantic-contract.ts \
            supabase/functions/_shared/citation-lineage.ts \
            | tee /tmp/task1-source-hashes.txt
          echo DIRECTOR_TASK1_PRECONDITIONS=PASS

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Capture exact production rollback bundle
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAP=/tmp/task1-rollback
          rm -rf "$SNAP"
          mkdir -p "$SNAP/supabase"
          cp supabase/config.toml "$SNAP/supabase/config.toml"

          supabase functions list --project-ref "$PROJECT_REF" | tee "$SNAP/PREDEPLOY_FUNCTION_LIST.txt"
          grep -q 'generate-reply' "$SNAP/PREDEPLOY_FUNCTION_LIST.txt"

          cd "$SNAP"
          supabase functions download generate-reply --project-ref "$PROJECT_REF" --use-api

          ENTRY="$(find "$SNAP" -type f -path '*/generate-reply/index.ts' -print -quit)"
          test -n "$ENTRY"
          test -s "$ENTRY"
          FUNCTION_DIR="$(dirname "$ENTRY")"
          FUNCTIONS_ROOT="$(dirname "$FUNCTION_DIR")"
          test -d "$FUNCTIONS_ROOT/_shared"

          cd "$SNAP"
          find . -type f -not -name 'ROLLBACK_SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > ROLLBACK_SHA256SUMS.txt
          test -s ROLLBACK_SHA256SUMS.txt
          sha256sum -c ROLLBACK_SHA256SUMS.txt

          deno check --node-modules-dir=auto "$ENTRY"

          FILE_COUNT="$(find "$FUNCTIONS_ROOT" -type f | wc -l | tr -d ' ')"
          EMPTY_COUNT="$(find "$FUNCTIONS_ROOT" -type f -empty | wc -l | tr -d ' ')"
          test "$FILE_COUNT" -gt 1
          test "$EMPTY_COUNT" -eq 0
          printf 'SNAPSHOT_ENTRY=%s\nSNAPSHOT_FILES=%s\nSNAPSHOT_EMPTY=%s\n' "$ENTRY" "$FILE_COUNT" "$EMPTY_COUNT" \
            | tee "$SNAP/ROLLBACK_MANIFEST.txt"
          echo "snapshot_dir=$SNAP" >> "$GITHUB_OUTPUT"
          echo DIRECTOR_TASK1_ROLLBACK_SNAPSHOT=PASS

      - name: Archive rollback bundle
        uses: actions/upload-artifact@v4
        with:
          name: task1-generate-reply-predeploy-rollback
          path: /tmp/task1-rollback
          if-no-files-found: error
          retention-days: 30

      - name: Deploy restored generate-reply
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/task1-postdeploy-functions.txt
          grep -q 'generate-reply' /tmp/task1-postdeploy-functions.txt
          echo DIRECTOR_TASK1_DEPLOY=PASS

      - name: Immediate production T01 grounded smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/director_task1_postdeploy_t01_smoke.py
          echo DIRECTOR_TASK1_POSTDEPLOY_SMOKE=PASS

      - name: Roll back on deploy or smoke failure
        if: ${{ failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          SNAP=/tmp/task1-rollback
          test -d "$SNAP/supabase/functions/generate-reply"
          cd "$SNAP"
          sha256sum -c ROLLBACK_SHA256SUMS.txt
          supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/task1-rollback-functions.txt
          grep -q 'generate-reply' /tmp/task1-rollback-functions.txt
          echo DIRECTOR_TASK1_ROLLBACK=PASS

      - name: Final Task 1 gate
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/task1-main-commit.txt
          test -s /tmp/task1-source-hashes.txt
          test -s /tmp/task1-rollback/ROLLBACK_SHA256SUMS.txt
          test -s /tmp/task1-postdeploy-functions.txt
          echo DIRECTOR_TASK1_FINAL_GATE=PASS

  c3-production-edge-transport:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'c3'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      AUTHORIZED_HEAD: ${{ inputs.authorized_head }}
      AUTHORIZED_TREE: ${{ inputs.authorized_tree }}
    steps:
      - name: Require exact C3 authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHORIZED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUTHORIZED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$PROJECT_REF" = "nrfxhqabwblzxoushgnm"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo C3_AUTHORIZATION_INPUTS=PASS

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorized_head }}
          fetch-depth: 0

      - name: Exact checkout / tree / project / function allowlist guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$AUTHORIZED_TREE"
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
          test "$(awk -F'"' '/^project_id = /{print $2}' supabase/config.toml)" = "$PROJECT_REF"
          for fn in generate-reply agent-assist; do
            test -s "supabase/functions/$fn/index.ts"
            section="$(awk -v f="$fn" '$0=="[functions." f "]"{on=1;next} /^\[/{on=0} on{print}' supabase/config.toml)"
            grep -q '^verify_jwt = true$' <<<"$section"
          done
          echo 'generate-reply' > /tmp/c3-allowed-functions.txt
          echo 'agent-assist' >> /tmp/c3-allowed-functions.txt
          test "$(wc -l < /tmp/c3-allowed-functions.txt | tr -d ' ')" = "2"
          echo C3_EXACT_CHECKOUT_GUARD=PASS

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build exact local source-closure manifests (read-only)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c3_closure_manifest.py <<'PY'
          import hashlib, pathlib, re, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          entry = (root / sys.argv[2]).resolve()
          out = pathlib.Path(sys.argv[3])
          import_re = re.compile(r'(?:from\s*|import\s*\()\s*["\x27]([^"\x27]+)["\x27]|^\s*import\s*["\x27]([^"\x27]+)["\x27]', re.M)
          seen=set(); stack=[entry]
          while stack:
              p=stack.pop().resolve()
              if p in seen: continue
              if not p.is_file(): raise SystemExit(f'missing local module: {p}')
              seen.add(p)
              text=p.read_text('utf-8')
              for m in import_re.finditer(text):
                  spec=m.group(1) or m.group(2)
                  if not spec or not spec.startswith('.'): continue
                  q=(p.parent/spec).resolve()
                  candidates=[q]
                  if not q.suffix: candidates += [q.with_suffix('.ts'), q/'index.ts']
                  target=next((c for c in candidates if c.is_file()), None)
                  if target is None: raise SystemExit(f'unresolved local import {spec} from {p}')
                  if root not in target.parents and target != root: raise SystemExit(f'local import escapes repo: {target}')
                  stack.append(target)
          rows=[]
          for p in sorted(seen, key=lambda x: x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              data=p.read_bytes()
              if not data: raise SystemExit(f'empty closure file: {rel}')
              rows.append((rel, hashlib.sha256(data).hexdigest()))
          out.write_text(''.join(f'{h}  {r}\n' for r,h in rows), 'utf-8')
          print(f'CLOSURE_FILES={len(rows)}')
          PY
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/generate-reply/index.ts /tmp/c3-generate-source.sha256
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/agent-assist/index.ts /tmp/c3-assist-source.sha256
          test -s /tmp/c3-generate-source.sha256
          test -s /tmp/c3-assist-source.sha256
          sha256sum /tmp/c3-generate-source.sha256 /tmp/c3-assist-source.sha256 | tee /tmp/c3-source-manifest-hashes.txt
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          deno check --node-modules-dir=auto supabase/functions/agent-assist/index.ts
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
          echo C3_SOURCE_CLOSURES=PASS

      - name: Capture predeploy production baseline and exact rollback closures
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/c3-edge-rollback
          rm -rf "$R"
          mkdir -p "$R/generate/supabase" "$R/assist/supabase"
          cp supabase/config.toml "$R/generate/supabase/config.toml"
          cp supabase/config.toml "$R/assist/supabase/config.toml"
          supabase functions list --project-ref "$PROJECT_REF" | tee "$R/predeploy-functions.txt"
          grep -q 'generate-reply' "$R/predeploy-functions.txt"
          grep -q 'agent-assist' "$R/predeploy-functions.txt"
          grep -q 'receive-widget-message' "$R/predeploy-functions.txt"
          grep -q 'ce-evaluation-worker' "$R/predeploy-functions.txt"
          grep -q 'conversation-evaluate' "$R/predeploy-functions.txt"
          (cd "$R/generate" && supabase functions download generate-reply --project-ref "$PROJECT_REF" --use-api)
          (cd "$R/assist" && supabase functions download agent-assist --project-ref "$PROJECT_REF" --use-api)
          test -s "$R/generate/supabase/functions/generate-reply/index.ts"
          test -s "$R/assist/supabase/functions/agent-assist/index.ts"
          find "$R/generate/supabase/functions" -type f -print0 | sort -z | xargs -0 sha256sum > "$R/generate.rollback.sha256"
          find "$R/assist/supabase/functions" -type f -print0 | sort -z | xargs -0 sha256sum > "$R/assist.rollback.sha256"
          test -s "$R/generate.rollback.sha256"
          test -s "$R/assist.rollback.sha256"
          echo C3_EDGE_ROLLBACK_SNAPSHOT=PASS

      - name: Deploy exact authorized generate-reply checkout closure
        id: deploy_generate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$AUTHORIZED_TREE"
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
          supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api
          echo C3_GENERATE_DEPLOY_COMMAND=PASS

      - name: Verify generate-reply authoritative source closure
        id: verify_generate
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/c3-readback-generate
          rm -rf "$D" && mkdir -p "$D/supabase"
          cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download generate-reply --project-ref "$PROJECT_REF" --use-api)
          python /tmp/c3_closure_manifest.py "$D" supabase/functions/generate-reply/index.ts /tmp/c3-generate-readback.sha256
          sed "s#  supabase/#  $D/supabase/#" /tmp/c3-generate-readback.sha256 | sha256sum -c - >/dev/null
          sed "s#  supabase/#  $PWD/supabase/#" /tmp/c3-generate-source.sha256 | sha256sum -c - >/dev/null
          cut -d' ' -f1 /tmp/c3-generate-source.sha256 > /tmp/c3-generate-source.hashes
          cut -d' ' -f1 /tmp/c3-generate-readback.sha256 > /tmp/c3-generate-readback.hashes
          diff -u /tmp/c3-generate-source.hashes /tmp/c3-generate-readback.hashes
          test "$(wc -l < /tmp/c3-generate-source.sha256)" = "$(wc -l < /tmp/c3-generate-readback.sha256)"
          echo C3_GENERATE_SOURCE_READBACK=PASS

      - name: Deploy exact authorized agent-assist checkout closure
        id: deploy_assist
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$AUTHORIZED_TREE"
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
          supabase functions deploy agent-assist --project-ref "$PROJECT_REF" --use-api
          echo C3_ASSIST_DEPLOY_COMMAND=PASS

      - name: Verify agent-assist authoritative source closure and frozen functions
        id: verify_assist
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/c3-readback-assist
          rm -rf "$D" && mkdir -p "$D/supabase"
          cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download agent-assist --project-ref "$PROJECT_REF" --use-api)
          python /tmp/c3_closure_manifest.py "$D" supabase/functions/agent-assist/index.ts /tmp/c3-assist-readback.sha256
          sed "s#  supabase/#  $D/supabase/#" /tmp/c3-assist-readback.sha256 | sha256sum -c - >/dev/null
          sed "s#  supabase/#  $PWD/supabase/#" /tmp/c3-assist-source.sha256 | sha256sum -c - >/dev/null
          cut -d' ' -f1 /tmp/c3-assist-source.sha256 > /tmp/c3-assist-source.hashes
          cut -d' ' -f1 /tmp/c3-assist-readback.sha256 > /tmp/c3-assist-readback.hashes
          diff -u /tmp/c3-assist-source.hashes /tmp/c3-assist-readback.hashes
          test "$(wc -l < /tmp/c3-assist-source.sha256)" = "$(wc -l < /tmp/c3-assist-readback.sha256)"
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/c3-postdeploy-functions.txt
          for fn in generate-reply agent-assist; do grep -q "$fn" /tmp/c3-postdeploy-functions.txt; done
          for fn in receive-widget-message ce-evaluation-worker conversation-evaluate; do
            pre="$(grep "$fn" /tmp/c3-edge-rollback/predeploy-functions.txt | head -1)"
            post="$(grep "$fn" /tmp/c3-postdeploy-functions.txt | head -1)"
            test -n "$pre" && test "$pre" = "$post"
          done
          echo C3_ASSIST_SOURCE_READBACK=PASS
          echo C3_FROZEN_EDGE_UNCHANGED=PASS

      - name: Roll back both Edge functions on deployment/readback failure
        if: ${{ failure() && (steps.deploy_generate.outcome == 'failure' || steps.verify_generate.outcome == 'failure' || steps.deploy_assist.outcome == 'failure' || steps.verify_assist.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/c3-edge-rollback
          test -s "$R/generate/supabase/functions/generate-reply/index.ts"
          test -s "$R/assist/supabase/functions/agent-assist/index.ts"
          (cd "$R/generate" && supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api)
          (cd "$R/assist" && supabase functions deploy agent-assist --project-ref "$PROJECT_REF" --use-api)
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/c3-rollback-post-functions.txt
          grep -q 'generate-reply' /tmp/c3-rollback-post-functions.txt
          grep -q 'agent-assist' /tmp/c3-rollback-post-functions.txt
          echo C3_EDGE_ROLLBACK=PASS

      - name: C3 Edge transport final gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$AUTHORIZED_TREE"
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
          test -s /tmp/c3-generate-source.sha256
          test -s /tmp/c3-assist-source.sha256
          test -s /tmp/c3-generate-readback.sha256
          test -s /tmp/c3-assist-readback.sha256
          test -s /tmp/c3-postdeploy-functions.txt
          echo C3_MIGRATION_STEP_EXECUTED=NO
          echo C3_EDGE_TRANSPORT_FINAL_GATE=PASS
