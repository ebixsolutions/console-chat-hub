name: task3-3-director-repair-validation

on:
  push:
    branches:
      - director/task3-3-debug-takeover

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/task3-3-debug-takeover
          fetch-depth: 0

      - name: Source integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Comprehensive current-scope source contract
        run: python3 tests/edge/w3-task3-3-source-contract.py .

      - name: Consolidated closure contract
        run: python3 tests/edge/w3-task3-3-consolidated-closure-contract.py .

      - name: Product-ready A-F contract
        run: python3 tests/edge/task3-3-consolidated-product-ready-contract.py .

      - name: Lockfile baseline marker
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.devDependencies['@lovable.dev/vite-tanstack-config']!=='2.13.1') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.packages[''].devDependencies['@lovable.dev/vite-tanstack-config']!=='2.13.1') process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Converge deterministic generated route tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No tracked build-generated changes"
            exit 0
          fi
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "src/routeTree.gen.ts" ]; then
            printf 'Unexpected tracked build changes:\n' >&2
            printf ' - %s\n' "${changed[@]}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'Task 3.3: refresh generated route tree'
          git push origin HEAD:director/task3-3-debug-takeover

      - name: Final tracked-tree assertion
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          echo "PASS Task 3.3 Director source/build validation"
