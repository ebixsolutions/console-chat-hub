name: AI ABC B3 Director Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai-abc-b3-director-production-smoke.yml"

permissions:
  contents: read

jobs:
  b3-production-final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      EXPECTED_HEAD: e6821d1ad3ede41a10b6c8e4904934e4da460e5d
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FINAL_SMOKE_AGENT_EMAIL: ${{ secrets.FINAL_SMOKE_AGENT_EMAIL }}
      FINAL_SMOKE_AGENT_PASSWORD: ${{ secrets.FINAL_SMOKE_AGENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticated B3 provider, stale-race, idempotency and automatic smoke
        shell: bash
        run: |
          set -euo pipefail
          set -a; source .env; set +a
          test "$PROJECT_REF" = "nrfxhqabwblzxoushgnm"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$FINAL_SMOKE_AGENT_EMAIL"
          test -n "$FINAL_SMOKE_AGENT_PASSWORD"
          export SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          export FUNCTIONS_URL="$VITE_SUPABASE_FUNCTIONS_URL"
          umask 077
          curl -fsS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
            -o /tmp/b3-keys.json
          python - <<'PY'
          import atexit, concurrent.futures, json, os, sys, time, urllib.error, urllib.parse, urllib.request, uuid

          SUPA=os.environ['SUPABASE_URL'].rstrip('/')
          BASE=SUPA+'/functions/v1'
          ORIGIN='https://console-chat-hub.lovable.app'
          COMPANY='3d6e17b5-ec79-4f75-aa7f-eaa824ff8493'
          POS='b3000000-0000-4000-8000-000000000101'
          NEG='b3000000-0000-4000-8000-000000000102'
          STALE='b3000000-0000-4000-8000-000000000103'
          AUTO='b3000000-0000-4000-8000-000000000704'
          CUST_POS='b3000000-0000-4000-8000-000000000201'
          ASST_POS='b3000000-0000-4000-8000-000000000202'
          CUST_NEG='b3000000-0000-4000-8000-000000000211'
          ASST_NEG='b3000000-0000-4000-8000-000000000212'
          CUST_STALE='b3000000-0000-4000-8000-000000000221'
          ASST_STALE='b3000000-0000-4000-8000-000000000222'
          CUST_AUTO='b3000000-0000-4000-8000-000000000831'
          ASST_AUTO='b3000000-0000-4000-8000-000000000832'
          CONTROLLED=[POS,NEG,STALE,AUTO]
          rows=json.load(open('/tmp/b3-keys.json'))
          def value(r): return r.get('api_key') or r.get('key') or r.get('value')
          pubs=[value(r) for r in rows if str(r.get('type') or '').lower()=='publishable' and value(r)]
          secs=[value(r) for r in rows if str(r.get('type') or '').lower()=='secret' and value(r)]
          service_roles=[value(r) for r in rows if str(r.get('name') or '').lower()=='service_role' and value(r)]
          assert pubs and secs and service_roles, 'PROJECT_API_KEYS_UNAVAILABLE'
          PUBLIC,SERVER=pubs[0],secs[0]
          AUTH_ADMIN=service_roles[0]

          def call(url, method='GET', headers=None, body=None, timeout=180):
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={'User-Agent':'ai-abc-b3-director/1.0',**(headers or {})})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as res:
                      raw=res.read().decode(); return res.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: payload=json.loads(raw)
                  except Exception: payload={'raw':raw[:500]}
                  return e.code,payload

          H={'apikey':SERVER,'Authorization':'Bearer '+SERVER,'Content-Type':'application/json'}
          AUTH_H={'apikey':SERVER,'Authorization':'Bearer '+AUTH_ADMIN,'Content-Type':'application/json'}
          def rest(table, query='', method='GET', body=None, prefer=None):
              h=dict(H)
              if prefer: h['Prefer']=prefer
              return call(f'{SUPA}/rest/v1/{table}{("?"+query) if query else ""}',method,h,body)
          def rows_for(table, query):
              st,data=rest(table,query); assert st==200,(table,st,data); return data
          def management_sql(query):
              url=f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query"
              headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN'],'Content-Type':'application/json'}
              st,data=call(url,'POST',headers,{'query':query},60)
              assert st in {200,201},('MANAGEMENT_SQL',st,data)
              return data

          temp_uid=None
          def cleanup_temp_identity():
              global temp_uid
              if not temp_uid: return
              rest('company_membership','user_id=eq.'+temp_uid,'DELETE')
              call(SUPA+'/auth/v1/admin/users/'+temp_uid,'DELETE',AUTH_H,timeout=60)
              temp_uid=None
          atexit.register(cleanup_temp_identity)

          st,session=call(SUPA+'/auth/v1/token?grant_type=password','POST',{'apikey':PUBLIC,'Content-Type':'application/json'},
                          {'email':os.environ['FINAL_SMOKE_AGENT_EMAIL'],'password':os.environ['FINAL_SMOKE_AGENT_PASSWORD']},60)
          if not (st==200 and session.get('access_token')):
              temp_email=f'b3-smoke-{int(time.time())}-{uuid.uuid4().hex[:8]}@test.invalid'
              temp_password=uuid.uuid4().hex+uuid.uuid4().hex
              st,created=call(SUPA+'/auth/v1/admin/users','POST',AUTH_H,{'email':temp_email,'password':temp_password,'email_confirm':True,'user_metadata':{'workstream':'AI-ABC-B3','controlled_test':True,'exclude_training':True}},60)
              assert st==200 and created.get('id'),('TEMP_AUTH_CREATE',st)
              temp_uid=created['id']
              st,binding=rest('company_membership','', 'POST',{'company_id':COMPANY,'user_id':temp_uid,'role':'supervisor','is_active':True},'return=representation')
              assert st==201 and binding,('TEMP_AUTH_BINDING',st,binding)
              st,session=call(SUPA+'/auth/v1/token?grant_type=password','POST',{'apikey':PUBLIC,'Content-Type':'application/json'},
                              {'email':temp_email,'password':temp_password},60)
          assert st==200 and session.get('access_token'),('AUTH_PASSWORD_GRANT',st)
          JWT=session['access_token']
          st,user=call(SUPA+'/auth/v1/user','GET',{'apikey':PUBLIC,'Authorization':'Bearer '+JWT},timeout=60)
          assert st==200 and user.get('id'),('AUTH_USER',st)
          uid=user['id']
          membership=rows_for('company_membership',urllib.parse.urlencode({'user_id':'eq.'+uid,'company_id':'eq.'+COMPANY,'is_active':'eq.true','select':'company_id,role,is_active'}))
          assert membership and str(membership[0]['role']) in {'admin','supervisor'},('AUTH_SCOPE',membership)
          FH={'apikey':PUBLIC,'Authorization':'Bearer '+JWT,'Origin':ORIGIN,'Content-Type':'application/json'}
          def evaluate(cid): return call(BASE+'/conversation-evaluate','POST',FH,{'conversation_id':cid},180)

          started=time.time()
          results={}
          for label,cid in [('positive',POS),('negative',NEG)]:
              st,data=evaluate(cid); assert st==200 and data.get('status')=='completed',(label,st,data)
              results[label]=data
              print(json.dumps({'gate':'manual_'+label,'status':'PASS','http':st,'evaluation_id':data['evaluation']['id']}))

          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as ex:
              future=ex.submit(evaluate,STALE)
              attempt=None
              for _ in range(240):
                  attempts=rows_for('conversation_evaluation_attempt',urllib.parse.urlencode({'conversation_id':'eq.'+STALE,'status':'eq.running','select':'id,status,created_at','order':'created_at.desc','limit':'1'}))
                  if attempts:
                      attempt=attempts[0]; break
                  time.sleep(.25)
              assert attempt, 'STALE_ATTEMPT_DID_NOT_REACH_RUNNING'
              new_hash='9f'+('0'*62)
              management_sql("update conversation_commerce_state set revision=2,state_hash='"+new_hash+"',updated_at=now() where conversation_id='"+STALE+"' and company_id='"+COMPANY+"';")
              changed=rows_for('conversation_commerce_state',urllib.parse.urlencode({'conversation_id':'eq.'+STALE,'company_id':'eq.'+COMPANY,'select':'revision,state_hash'}))
              assert changed and changed[0]['revision']==2 and changed[0]['state_hash']==new_hash,('STALE_MUTATION',changed)
              stale_status,stale_body=future.result(timeout=180)
          assert stale_status==409,(stale_status,stale_body)
          assert stale_body.get('detail')=='ce_b3_commerce_reality_stale',stale_body
          stale_attempts=rows_for('conversation_evaluation_attempt',urllib.parse.urlencode({'conversation_id':'eq.'+STALE,'select':'id,status,error_message,created_at','order':'created_at.desc'}))
          assert stale_attempts[0]['status']=='failed' and stale_attempts[0]['error_message']=='CE_B3_COMMERCE_REALITY_STALE',stale_attempts
          assert not rows_for('conversation_evaluation',urllib.parse.urlencode({'attempt_id':'eq.'+attempt['id'],'select':'id'})), 'STALE_RESULT_PERSISTED'
          usage=rows_for('upstream_call_log',urllib.parse.urlencode({'conversation_id':'eq.'+STALE,'created_at':'gte.'+time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(started)),'select':'request_payload,response_status,response_latency_ms,error_message','order':'created_at.asc'}))
          evaluator=[r for r in usage if (r.get('request_payload') or {}).get('purpose')=='evaluation']
          assert len([r for r in evaluator if (r.get('request_payload') or {}).get('outcome')=='success'])>=6,evaluator
          assert not [r for r in evaluator if (r.get('request_payload') or {}).get('outcome')!='success'],evaluator
          max_out=max(int((r.get('request_payload') or {}).get('output_tokens') or 0) for r in evaluator)
          assert max_out<4096,('OUTPUT_CEILING',max_out)
          print(json.dumps({'gate':'stale_precommit','status':'PASS','provider_successes':len(evaluator),'max_output_tokens':max_out,'rejection':stale_body['detail']}))

          st,fresh=evaluate(STALE); assert st==200 and fresh.get('status')=='completed',(st,fresh)
          fresh_id=fresh['evaluation']['id']
          st,replay=evaluate(STALE); assert st==200 and replay.get('status')=='already_evaluated',(st,replay)
          assert replay.get('evaluation',{}).get('id')==fresh_id,(fresh,replay)
          fresh_rows=rows_for('conversation_evaluation',urllib.parse.urlencode({'conversation_id':'eq.'+STALE,'select':'id,attempt_id,company_id,sales_score,context_score,freshness,input_snapshot_hash,grounding_manifest','order':'created_at.desc'}))
          assert len(fresh_rows)==1 and fresh_rows[0]['id']==fresh_id and fresh_rows[0]['freshness']=='current',fresh_rows
          snap=rows_for('ce_bundle_snapshot',urllib.parse.urlencode({'attempt_id':'eq.'+fresh_rows[0]['attempt_id'],'select':'conversation_id,company_id,evaluated_ai_reply,grounding_evidence,transcript_hash','limit':'1'}))
          reality=snap[0]['grounding_evidence']['b3_conversion_reality']
          assert snap[0]['company_id']==COMPANY and snap[0]['conversation_id']==STALE,snap
          assert reality['revision']==2 and reality['source_message_id']==CUST_STALE and reality['state_hash']=='9f'+('0'*62),reality
          print(json.dumps({'gate':'fresh_retry_idempotency','status':'PASS','evaluation_id':fresh_id,'revision':2}))

          evals={}
          for label,cid in [('positive',POS),('negative',NEG)]:
              r=rows_for('conversation_evaluation',urllib.parse.urlencode({'conversation_id':'eq.'+cid,'select':'id,company_id,sales_score,context_score,freshness,attempt_id','order':'created_at.desc'}))
              assert len(r)==1 and r[0]['company_id']==COMPANY and r[0]['freshness']=='current',(label,r)
              evals[label]=r[0]
          assert float(evals['negative']['sales_score'])<=40 and float(evals['negative']['context_score'])<=30,evals
          assert float(evals['positive']['sales_score'])>=float(evals['negative']['sales_score']),evals
          assert float(evals['positive']['context_score'])>=float(evals['negative']['context_score']),evals
          print(json.dumps({'gate':'conversion_reality_alignment','status':'PASS','positive':{'sales':evals['positive']['sales_score'],'context':evals['positive']['context_score']},'negative':{'sales':evals['negative']['sales_score'],'context':evals['negative']['context_score']}}))

          # Automatic final path: state exists before assistant insert; the existing trigger dispatches the worker.
          assistant={'id':ASST_AUTO,'conversation_id':AUTO,'role':'assistant','content':'你的 Product A 是 2 部；Product B 會保留。現行報價是 HKD 8,000，訂單及安裝均已完成。請再提供送貨地址。你想找甚麼產品？','metadata':{'b2_outcome':'allow','response_route':'commerce_state_answer','controlled_test':True,'exclude_training':True,'source_message_id':CUST_AUTO},'is_recalled':False}
          st,data=rest('messages','', 'POST',assistant,'return=representation'); assert st==201,(st,data)
          job=None
          for _ in range(360):
              jobs=rows_for('ce_evaluation_job',urllib.parse.urlencode({'conversation_id':'eq.'+AUTO,'select':'id,status,error_code,attempts,expected_revision,snapshot_hash,evaluation_fingerprint','order':'created_at.desc','limit':'1'}))
              if jobs and jobs[0]['status'] in {'succeeded','failed','dead'}:
                  job=jobs[0]; break
              time.sleep(.5)
          assert job and job['status']=='succeeded',job
          auto_eval=rows_for('conversation_evaluation',urllib.parse.urlencode({'conversation_id':'eq.'+AUTO,'select':'id,company_id,sales_score,context_score,freshness,attempt_id','order':'created_at.desc'}))
          assert len(auto_eval)==1 and auto_eval[0]['company_id']==COMPANY and auto_eval[0]['freshness']=='current',auto_eval
          assert float(auto_eval[0]['sales_score'])<=40 and float(auto_eval[0]['context_score'])<=30,auto_eval
          assert not rows_for('handoff_event',urllib.parse.urlencode({'conversation_id':'in.('+','.join(CONTROLLED)+')','select':'id'})), 'UNINTENDED_HANDOFF'
          print(json.dumps({'gate':'automatic_worker','status':'PASS','job_id':job['id'],'evaluation_id':auto_eval[0]['id'],'sales':auto_eval[0]['sales_score'],'context':auto_eval[0]['context_score']}))

          # Preserve append-only audit integrity while closing all controlled fixtures.
          for cid,path in [(POS,'manual-positive'),(NEG,'manual-negative'),(STALE,'manual-stale'),(AUTO,'automatic-final')]:
              mark={'status':'resolved','resolved_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'metadata_source':{'workstream':'AI-ABC-B3','pr':9,'head':os.environ['EXPECTED_HEAD'],'path':path,'controlled_test':True,'exclude_training':True,'cleanup_disposition':'retained_for_append_only_audit_integrity','safe_deletion_blocked':True}}
              st,data=rest('conversations','id=eq.'+cid,'PATCH',mark,'return=representation'); assert st==200 and data,(cid,st,data)
          open_rows=rows_for('conversations','id=in.('+','.join(CONTROLLED)+')&status=neq.resolved&select=id')
          all_rows=rows_for('conversations','id=in.('+','.join(CONTROLLED)+')&select=id,metadata_source,status')
          assert not open_rows and len(all_rows)==4,all_rows
          assert all((r.get('metadata_source') or {}).get('cleanup_disposition')=='retained_for_append_only_audit_integrity' for r in all_rows),all_rows
          sessions=rows_for('visitor_session','visitor_metadata->>workstream=eq.AI-ABC-B3&select=id')
          assert not sessions,sessions
          cleanup_temp_identity()
          print(json.dumps({'gate':'cleanup','status':'PASS','open':0,'unmarked':0,'safely_deletable':0,'visitor_sessions':0,'temporary_auth_identities':0}))
          print(json.dumps({'final_gate':'AI-ABC-B3','status':'PASS','head':os.environ['EXPECTED_HEAD'],'provider_max_output_tokens':max_out,'controlled_conversations':CONTROLLED}))
          PY
          rm -f /tmp/b3-keys.json
