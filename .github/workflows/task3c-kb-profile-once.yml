name: Task3C bounded profile mirror correction
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/task3c-kb-profile-once.yml]
permissions:
  contents: write
concurrency:
  group: task3c-original-kb-profile-mirror
  cancel-in-progress: false
jobs:
  correct-original-profile:
    if: github.repository == 'ebixsolutions/console-chat-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Original locked dependencies
        run: npm ci
      - name: Reconcile only previously approved KB and development file scopes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a5e56a1d3faa5ff1e1570181584ee6ba180e8265'
          test "$(git hash-object src/lib/api/kbBinding.service.ts)" = '78260522558841c64ecdd929cb6c0d30b269dbe7'
          test "$(git hash-object .env.development)" = '5b8356b6c2c0b3be80bed3915ee911027b14e02d'
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {pathToFileURL} from 'node:url';
          const gatePath='.github/scripts/c3_unified_production_source_gate.mjs';
          const profilePath='.github/scripts/c3_unified_production_profile.json';
          const gateBefore=fs.readFileSync(gatePath,'utf8');
          const original=fs.readFileSync(profilePath,'utf8');
          const profile=JSON.parse(original);
          const match=gateBefore.match(/const TASK3C_KB_BINDING_SOURCE=Object\.freeze\((\{[^\n]*\})\);/);
          assert(match);
          const pins=JSON.parse(match[1]);
          assert.deepEqual(pins,profile.authorized_task3c_kb_binding_sha256);
          const dev=fs.readFileSync('.env.development','utf8');
          assert.match(dev,/^C3_KB_BINDING_DEV_ENABLED=true$/m);
          assert.match(dev,/^VITE_C3_KB_BINDING_DEV_ENABLED=true$/m);
          assert.doesNotMatch(dev,/^C3_KB_BINDING_INVITES_ENABLED=true$/m);
          assert(!Object.hasOwn(pins,'.env.development'),'Expected missing approved file pin');
          pins['.env.development']=createHash('sha256').update(dev).digest('hex');
          const gate=gateBefore.replace(match[0],'const TASK3C_KB_BINDING_SOURCE=Object.freeze('+JSON.stringify(pins)+');');
          profile.authorized_task3c_kb_binding_sha256=pins;
          const marker='must(JSON.stringify(profile.authorized_changes)===JSON.stringify(';
          const start=gate.indexOf(marker)+marker.length;
          const end=gate.indexOf("),'authorization_scope_drift');",start);
          assert(start>=marker.length&&end>start);
          const expression=gate.slice(start,end);
          const tmp='.github/scripts/task3c-bound-allowlist-probe.mjs';
          assert(!fs.existsSync(tmp));
          let expected;
          try {
            fs.writeFileSync(tmp,gate+'\nexport const task3cExpectedAllowedPaths = '+expression+';\n');
            expected=(await import(pathToFileURL(path.resolve(tmp)).href)).task3cExpectedAllowedPaths;
          } finally {if(fs.existsSync(tmp))fs.unlinkSync(tmp);}
          assert(Array.isArray(expected)&&expected.every(x=>typeof x==='string'));
          const added=expected.filter(x=>!profile.authorized_changes.includes(x));
          const removed=profile.authorized_changes.filter(x=>!expected.includes(x));
          const affected=new Set(Object.keys(pins));
          assert(added.every(x=>affected.has(x)),'No unrelated authorization addition');
          assert.equal(removed.length,0);
          profile.authorized_changes=expected;
          for(const flag of ['task3c_kb_binding_production_authorized','task3c_kb_binding_publish_authorized','task3c_kb_binding_schema_authorized','task3c_kb_binding_paid_traffic_authorized'])assert.equal(profile[flag],false);
          fs.writeFileSync(gatePath,gate);
          fs.writeFileSync(profilePath,JSON.stringify(profile,null,2)+(original.endsWith('\n')?'\n':''));
          console.log(JSON.stringify({added_exact_approved_paths:added,removed,development_flag_hash:pins['.env.development'],no_gate_assertions_removed:true,production_permissions_changed:false},null,2));
          JS
          git rm .github/workflows/task3c-kb-profile-once.yml
          git add .github/scripts/c3_unified_production_profile.json .github/scripts/c3_unified_production_source_gate.mjs
          git diff --cached --check
          git config user.name 'Task3C Director Source Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(task3c): reconcile approved KB and private-development file scopes without relaxing Gate checks'
      - name: Original C3 source control regression
        run: node .github/scripts/c3_unified_production_source_gate.test.mjs
      - name: Original C3 source control assertions
        run: node .github/scripts/c3_unified_production_source_gate.mjs
      - name: Original KB binding tests
        run: node --test tests/console-navigation/kb-binding-dev.test.mjs
      - name: Complete original repository build
        run: npm run build
      - name: Same-branch fast-forward exact tested commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=director/ai-abc-c3-long-memory-final-cutover
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git diff --name-only)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "TESTED_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "TESTED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
