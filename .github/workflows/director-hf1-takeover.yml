name: Director HF-1 Takeover
on:
  push:
    paths:
      - '.github/workflows/director-hf1-takeover.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply Director HF-1 takeover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          decision = r'''export type HandoffMode = "immediate" | "optional_clarification_then_handoff" | "normal_ai_continue";
          export type HandoffPriority = "emergency" | "required" | "recommended" | "advisory";
          export type MissingInfoPolicy = "do_not_ask" | "ask_once_optional" | "ask_if_customer_willing";
          export type HandoffDecisionInput = {
            explicit_human_request: boolean;
            human_request_count: number;
            request_strength: "standard" | "strong";
            anger_level: "high" | "medium" | "low" | null;
            sentiment_trend: number[] | null;
            frustration_due_to_repetition: boolean;
            unresolved_turns: number;
            same_intent_repeat: boolean;
            prior_clarification_count: number;
            customer_refused_more_questions: boolean;
            vip_tier: string | null;
            high_value_customer: boolean | null;
            predicted_csat: number | null;
            churn_risk: number | null;
            policy_risk: "high" | "standard" | null;
            threat_flag: boolean;
            rag_state: string | null;
            handoff_history: number;
            current_intent: string | null;
            current_topic: string | null;
            required_info_missing: string[];
            missing_info_actionability: "high" | "low" | "none";
          };
          export type HandoffDecision = {
            handoff_mode: HandoffMode;
            handoff_priority: HandoffPriority;
            missing_info_policy: MissingInfoPolicy;
            reason_codes: string[];
          };
          type Row = { role?: string; content?: string | null; metadata?: unknown };
          const HUMAN_REQUEST = /(真人客服|人工客服|真人|人工|human agent|live agent|real person|speak to (?:a )?human|talk to (?:a )?human)/i;
          const STRONG_REQUEST = /(立即|即刻|而家|現在|现在).{0,10}(?:真人|人工)|(?:不要|唔要|不想要|別再|别再).{0,10}(?:AI|機器人|机器人)|(?:只要|一定要|必須|必须).{0,10}(?:真人|人工)|(?:connect|transfer).{0,8}(?:now|immediately)|no more ai|don't want ai|do not want ai/i;
          const ANGER = /(嬲|生氣|生气|憤怒|愤怒|火大|離譜|离谱|垃圾|廢話|废话|煩|烦|投訴|投诉|angry|furious|ridiculous|useless|frustrat|annoyed)/i;
          const REPETITION_FRUSTRATION = /(又問|再問|問過|问过|講過|说过|重複|重复|already told|asked already|again\?|stop asking|same question)/i;
          const REFUSED = /(不想再提供|唔想再答|不要再問|不要再问|不會再提供|不会再提供|不提供|拒絕提供|拒绝提供|won't provide|will not provide|don't ask|do not ask|not giving)/i;
          const CLARIFICATION_ROUTES = new Set(["warm_handoff_data_collection", "kb_no_match_clarification"]);
          function clean(v: unknown): string { return typeof v === "string" ? v.normalize("NFKC").trim() : ""; }
          function obj(v: unknown): Record<string, unknown> | null { return v && typeof v === "object" && !Array.isArray(v) ? v as Record<string, unknown> : null; }
          export function deriveHandoffDecisionInput(
            rows: Row[], latestMessage: string, requiredMissing: string[], opts: Partial<HandoffDecisionInput> = {},
          ): HandoffDecisionInput {
            const visitors = rows.filter((r) => ["visitor","customer","user"].includes(String(r.role ?? "").toLowerCase()));
            const humanCount = visitors.filter((r) => HUMAN_REQUEST.test(clean(r.content))).length;
            const transcript = visitors.map((r) => clean(r.content)).join(" ");
            const priorClarifications = rows.filter((r) => {
              const m = obj(r.metadata); return !!m && (CLARIFICATION_ROUTES.has(String(m.response_route ?? "")) || m.escalation_action === "clarification");
            }).length;
            const explicit = opts.explicit_human_request ?? HUMAN_REQUEST.test(latestMessage);
            const strength = opts.request_strength ?? ((STRONG_REQUEST.test(latestMessage) || humanCount >= 2) ? "strong" : "standard");
            const anger = opts.anger_level ?? (ANGER.test(latestMessage) ? "high" : null);
            const refusal = opts.customer_refused_more_questions ?? REFUSED.test(latestMessage);
            const repetition = opts.frustration_due_to_repetition ?? REPETITION_FRUSTRATION.test(transcript.slice(-1200));
            const actionability = opts.missing_info_actionability ?? (requiredMissing.length === 0 ? "none" : requiredMissing.length === 1 && ["model","order_reference"].includes(requiredMissing[0]!) ? "high" : "low");
            return {
              explicit_human_request: explicit,
              human_request_count: opts.human_request_count ?? humanCount,
              request_strength: strength,
              anger_level: anger,
              sentiment_trend: opts.sentiment_trend ?? null,
              frustration_due_to_repetition: repetition,
              unresolved_turns: opts.unresolved_turns ?? 0,
              same_intent_repeat: opts.same_intent_repeat ?? false,
              prior_clarification_count: opts.prior_clarification_count ?? priorClarifications,
              customer_refused_more_questions: refusal,
              vip_tier: opts.vip_tier ?? null,
              high_value_customer: opts.high_value_customer ?? null,
              predicted_csat: opts.predicted_csat ?? null,
              churn_risk: opts.churn_risk ?? null,
              policy_risk: opts.policy_risk ?? null,
              threat_flag: opts.threat_flag ?? false,
              rag_state: opts.rag_state ?? null,
              handoff_history: opts.handoff_history ?? humanCount,
              current_intent: opts.current_intent ?? null,
              current_topic: opts.current_topic ?? null,
              required_info_missing: [...requiredMissing],
              missing_info_actionability: actionability,
            };
          }
          export function evaluateHandoffDecision(input: HandoffDecisionInput): HandoffDecision {
            const reasons: string[] = [];
            if (input.threat_flag || input.policy_risk === "high") {
              reasons.push(input.threat_flag ? "threat_or_safety_risk" : "high_policy_risk");
              return { handoff_mode:"immediate", handoff_priority:"emergency", missing_info_policy:"do_not_ask", reason_codes:reasons };
            }
            if (input.explicit_human_request) {
              const immediate = input.request_strength === "strong" || input.human_request_count >= 2 || input.anger_level === "high" || input.frustration_due_to_repetition || input.unresolved_turns >= 2 || input.prior_clarification_count > 0 || input.customer_refused_more_questions;
              if (immediate) {
                if (input.request_strength === "strong") reasons.push("strong_explicit_human_request");
                if (input.human_request_count >= 2) reasons.push("repeated_human_request");
                if (input.anger_level === "high") reasons.push("high_anger");
                if (input.frustration_due_to_repetition) reasons.push("repetition_frustration");
                if (input.unresolved_turns >= 2) reasons.push("multiple_unresolved_turns");
                if (input.prior_clarification_count > 0) reasons.push("already_clarified");
                if (input.customer_refused_more_questions) reasons.push("customer_refused_more_questions");
                return { handoff_mode:"immediate", handoff_priority:"required", missing_info_policy:"do_not_ask", reason_codes:reasons };
              }
              if (input.required_info_missing.length === 1 && input.missing_info_actionability === "high") {
                return { handoff_mode:"optional_clarification_then_handoff", handoff_priority:"required", missing_info_policy:"ask_once_optional", reason_codes:["first_calm_human_request","one_high_value_missing_fact"] };
              }
              return { handoff_mode:"immediate", handoff_priority:"required", missing_info_policy:"ask_if_customer_willing", reason_codes:["explicit_human_request_override"] };
            }
            if (input.vip_tier || input.high_value_customer === true || (input.predicted_csat !== null && input.predicted_csat < 3) || (input.churn_risk !== null && input.churn_risk >= 0.7)) {
              return { handoff_mode:"normal_ai_continue", handoff_priority:"advisory", missing_info_policy:"ask_if_customer_willing", reason_codes:["advisory_signal_only"] };
            }
            return { handoff_mode:"normal_ai_continue", handoff_priority:"advisory", missing_info_policy:"ask_if_customer_willing", reason_codes:["no_handoff_trigger"] };
          }
          '''.replace('\n          ','\n').lstrip()

          closure = r'''export type ConversationClosureKind = "none" | "closure_candidate" | "no_more_help" | "positive_no_more_help";
          export type ConversationClosureClassification = { kind: ConversationClosureKind; language: "zh-TW" | "zh-CN" | "en"; reason: string };
          const MISSING_FACT_GUARD = /(沒有|没有|冇|未有|不知道|唔知|no|don['’]?t have|do not have).{0,16}(型號|型号|model|訂單|订单|order|收到|收貨|收货|貨|货|地址|電話|电话|email|電郵|邮箱|付款|payment)/i;
          const NO_MORE = /(?:沒有了|没有了|冇喇|冇啦|沒有其他(?:問題)?|没有其他(?:问题)?|暫時沒有|暂时没有|不用了|唔使喇|唔使啦|就這樣|就这样|沒事了|没事了|沒有問題了|没有问题了|no more|nothing else|that['’]?s all|no thanks|all good|i['’]?m good)/i;
          const POSITIVE = /(滿意|满意|很好|幫到我|帮到我|解決了|解决了|多謝|謝謝|谢谢|great|good service|helpful|satisfied|resolved)/i;
          const ACK_ONLY = /^(?:謝謝|谢谢|多謝|唔該|明白|明白了|知道了|收到|好的|好|ok|okay|got it|understood|thanks|thank you)[。.!！?？\s]*$/i;
          function lang(t:string): "zh-TW"|"zh-CN"|"en" { if (!/[\u4e00-\u9fff]/.test(t)) return "en"; return /[转们队为这吗个]/.test(t) ? "zh-CN" : "zh-TW"; }
          export function classifyConversationClosure(text:string): ConversationClosureClassification {
            const t=String(text??"").normalize("NFKC").trim(); const language=lang(t);
            if (!t || MISSING_FACT_GUARD.test(t)) return {kind:"none",language,reason:!t?"empty":"missing_fact_not_closure"};
            if (NO_MORE.test(t)) return {kind:POSITIVE.test(t)?"positive_no_more_help":"no_more_help",language,reason:"customer_has_no_more_help_requests"};
            if (ACK_ONLY.test(t)) return {kind:"closure_candidate",language,reason:"customer_acknowledged_resolution"};
            return {kind:"none",language,reason:"substantive_or_unresolved_turn"};
          }
          export function buildConversationClosureReply(c:ConversationClosureClassification): string|null {
            if (c.kind === "none") return null;
            if (c.kind === "closure_candidate") return c.language === "en" ? "You're welcome. Is there anything else I can help you with?" : c.language === "zh-CN" ? "不用客气。还有什么可以帮到你吗？" : "不用客氣。還有什麼可以幫到你嗎？";
            return c.language === "en" ? "You're very welcome. Thank you for contacting us." : c.language === "zh-CN" ? "好的，不用客气。谢谢你联络我们！" : "好的，不用客氣。謝謝你聯絡我們！";
          }
          '''.replace('\n          ','\n').lstrip()

          warm = Path('supabase/functions/_shared/warm-handoff.ts').read_text()
          warm = warm.replace('  if (explicitNow) return false;\n  if (rule === "E1" || rule === "E2" || rule === "S0" || rule === "R1") return false;\n  return pkg.missing_facts.length > 0 && !pkg.collection_already_attempted;', '  if (rule === "E1" || rule === "E2" || rule === "S0") return false;\n  if (pkg.collection_already_attempted || pkg.missing_facts.length !== 1) return false;\n  return explicitNow || rule === "R1" || rule === "R2" || !rule;')
          Path('supabase/functions/_shared/warm-handoff.ts').write_text(warm)
          Path('supabase/functions/_shared/handoff-decision.ts').write_text(decision)
          Path('supabase/functions/_shared/conversation-closure.ts').write_text(closure)

          test = r'''import { deriveHandoffDecisionInput, evaluateHandoffDecision } from "./handoff-decision.ts";
          import { classifyConversationClosure, buildConversationClosureReply } from "./conversation-closure.ts";
          function a(v:unknown,n:string):asserts v { if(!v) throw new Error(`ASSERT_FAIL:${n}`); }
          const rows=(xs:string[])=>xs.map(content=>({role:"visitor",content}));
          let i=deriveHandoffDecisionInput(rows(["現在我要真人客服"]),"現在我要真人客服",["order_reference"],{explicit_human_request:true});
          let d=evaluateHandoffDecision(i); a(d.handoff_mode==="optional_clarification_then_handoff","calm_first_optional"); a(d.missing_info_policy==="ask_once_optional","optional_once");
          i=deriveHandoffDecisionInput(rows(["我要真人客服","我說了我要真人客服"]),"我說了我要真人客服",["order_reference"],{explicit_human_request:true}); d=evaluateHandoffDecision(i); a(d.handoff_mode==="immediate","repeat_immediate");
          i=deriveHandoffDecisionInput(rows(["不要AI，我只要真人客服"]),"不要AI，我只要真人客服",["order_reference"],{explicit_human_request:true}); d=evaluateHandoffDecision(i); a(d.handoff_mode==="immediate"&&d.missing_info_policy==="do_not_ask","no_ai_immediate");
          i=deriveHandoffDecisionInput(rows(["我很生氣，轉真人客服"]),"我很生氣，轉真人客服",["model"],{explicit_human_request:true}); d=evaluateHandoffDecision(i); a(d.handoff_mode==="immediate","anger_immediate");
          i=deriveHandoffDecisionInput(rows(["VIP會員"]),"VIP會員",[],{vip_tier:"gold"}); d=evaluateHandoffDecision(i); a(d.handoff_mode==="normal_ai_continue","vip_alone_not_handoff");
          i=deriveHandoffDecisionInput(rows(["真人客服幾點有人？"]),"真人客服幾點有人？",[],{explicit_human_request:false}); d=evaluateHandoffDecision(i); a(d.handoff_mode==="normal_ai_continue","support_hours_not_r1");
          i=deriveHandoffDecisionInput(rows(["現在我要真人客服"]),"現在我要真人客服",["model"],{explicit_human_request:true,threat_flag:true}); d=evaluateHandoffDecision(i); a(d.handoff_priority==="emergency"&&d.handoff_mode==="immediate","threat_emergency");
          a(classifyConversationClosure("沒有了").kind==="no_more_help","no_more_help");
          a(classifyConversationClosure("很滿意，沒有其他問題").kind==="positive_no_more_help","positive_no_more_help");
          a(classifyConversationClosure("沒有型號").kind==="none","missing_model_not_closure");
          a(classifyConversationClosure("沒有收到貨").kind==="none","missing_delivery_not_closure");
          a(classifyConversationClosure("謝謝").kind==="closure_candidate","thanks_candidate");
          a((buildConversationClosureReply(classifyConversationClosure("謝謝"))??"").includes("還有什麼"),"anything_else_prompt");
          console.log("HF1_DIRECTOR_UNIT_ASSERTIONS=PASS");
          '''.replace('\n          ','\n').lstrip()
          Path('supabase/functions/_shared/task1-closure-handoff.test.ts').write_text(test)

          p=Path('supabase/functions/generate-reply/index.ts'); s=p.read_text()
          import_anchor='import { buildMissingFactsQuestion, buildWarmHandoffPackage } from "../_shared/warm-handoff.ts";'
          assert s.count(import_anchor)==1, f'import_anchor={s.count(import_anchor)}'
          s=s.replace(import_anchor, import_anchor+'\nimport { deriveHandoffDecisionInput, evaluateHandoffDecision } from "../_shared/handoff-decision.ts";\nimport { buildConversationClosureReply, classifyConversationClosure } from "../_shared/conversation-closure.ts";',1)

          helper_anchor='async function legacyGenerateReply(conversation_id: string, source_message_id: string | null): Promise<Response> {'
          assert s.count(helper_anchor)==1
          helper='''async function handleConversationClosureIfNeeded(\n  supabaseAdmin: SupabaseAdminClient,\n  conversation_id: string,\n  source_message_id: string | null,\n  latestMessage: string,\n): Promise<Response | null> {\n  const classification = classifyConversationClosure(latestMessage);\n  const content = buildConversationClosureReply(classification);\n  if (!content || classification.kind === "none") return null;\n  const { data: conversation } = await supabaseAdmin.from("conversations").select("status, assigned_agent_id").eq("id", conversation_id).maybeSingle();\n  if (!conversation || conversation.status === "resolved" || isHumanControlState(String(conversation.status ?? ""), conversation.assigned_agent_id ?? null)) return null;\n  const { data: prior } = await supabaseAdmin.from("messages").select("role, metadata, content, created_at").eq("conversation_id", conversation_id).eq("is_recalled", false).neq("content", "__THINKING__").order("created_at", { ascending: false }).limit(4);\n  const previousAssistant = (prior ?? []).find((r:any) => r.role === "assistant" && String(r.content ?? "") !== content);\n  const pm = previousAssistant?.metadata && typeof previousAssistant.metadata === "object" ? previousAssistant.metadata as Record<string,unknown> : null;\n  if (!previousAssistant || pm?.handoff_required === true || ["warm_handoff_data_collection","kb_no_match_clarification","system_error_handoff"].includes(String(pm?.response_route ?? ""))) return null;\n  const committed = await commitAiReplyWithControlGate(supabaseAdmin, conversation_id, source_message_id, content, { response_route:"conversation_closure", closure_state:classification.kind === "closure_candidate" ? "awaiting_more_help" : "completed", closure_reason:classification.reason, feedback_eligible_candidate:classification.kind !== "closure_candidate", handoff_required:false });\n  await cleanupThinking(supabaseAdmin, conversation_id, source_message_id);\n  if (!committed.ok) { if (["human_control","resolved","superseded_source"].includes(committed.result)) return new Response(JSON.stringify({success:true,skipped:committed.result}),{headers:{...corsHeaders,"Content-Type":"application/json"}}); return new Response(JSON.stringify({success:false,error:`conversation_closure_${committed.result}`}),{status:409,headers:{...corsHeaders,"Content-Type":"application/json"}}); }\n  return new Response(JSON.stringify({success:true,response_route:"conversation_closure",closure_state:classification.kind}),{headers:{...corsHeaders,"Content-Type":"application/json"}});\n}\n\n'''
          s=s.replace(helper_anchor, helper+helper_anchor,1)

          orchestration_anchor='''  const _h1LastMsg = sourceVisitorMessage.content;\n\n  const [\n    { data: _pr5HistoryRows },'''
          assert s.count(orchestration_anchor)==1, f'orchestration_anchor={s.count(orchestration_anchor)}'
          orchestration_new='''  const _h1LastMsg = sourceVisitorMessage.content;\n\n  const _closureResponse = await handleConversationClosureIfNeeded(supabaseAdmin, conversation_id, source_message_id, _h1LastMsg);\n  if (_closureResponse) return _closureResponse;\n\n  const [\n    { data: _pr5HistoryRows },'''
          s=s.replace(orchestration_anchor,orchestration_new,1)

          # Replace the complete explicit R1 helper with decision-driven behavior while preserving explicit_handoff_tx.
          pattern=re.compile(r'async function persistExplicitR1IfRequested\(.*?\n\}\n\nasync function orchestrationGenerateReply',re.S)
          m=pattern.search(s); assert m, 'r1_helper_missing'
          old=m.group(0)
          # Reuse the existing helper body after its classification point by injecting readiness logic before source-id/RPC.
          body=old[:-len('\n\nasync function orchestrationGenerateReply')]
          class_anchor='''  const classified = classifyExplicitHandoff(latestMessage);\n  if (classified.rule !== "R1") return null;'''
          assert class_anchor in body, 'r1_class_anchor_missing'
          injected='''  const classified = classifyExplicitHandoff(latestMessage);\n  const { data: handoffHistory, error: handoffHistoryError } = await supabaseAdmin.from("messages").select("id, role, content, metadata, created_at").eq("conversation_id", conversation_id).eq("is_recalled", false).order("created_at", { ascending: true }).order("id", { ascending: true }).limit(40);\n  const pkg = buildWarmHandoffPackage(handoffHistory ?? [], "R1");\n  const collectionContinuation = pkg.collection_already_attempted && classified.rule !== "R1";\n  if (classified.rule !== "R1" && !collectionContinuation) return null;\n  const urgent = isDirectViolentThreat(latestMessage);\n  const hf1Input = deriveHandoffDecisionInput(handoffHistory ?? [], latestMessage, pkg.missing_facts, { explicit_human_request: classified.rule === "R1", threat_flag: urgent, current_topic: pkg.customer_goal });\n  const hf1Decision = evaluateHandoffDecision(hf1Input);\n  if (handoffHistoryError) console.error("[generate-reply] HF1 handoff history unavailable; fail-open to immediate handoff", conversation_id);\n  if (classified.rule === "R1" && !handoffHistoryError && hf1Decision.handoff_mode === "optional_clarification_then_handoff" && !pkg.collection_already_attempted) {\n    const question = buildMissingFactsQuestion(pkg, classified.language);\n    if (question) {\n      const collected = await commitAiReplyWithControlGate(supabaseAdmin, conversation_id, source_message_id, question, { escalation_rule:"R1", escalation_action:"collect_missing_handoff_facts", response_route:"warm_handoff_data_collection", handoff_required:false, hf1_decision:hf1Decision });\n      if (collected.ok) { await cleanupThinking(supabaseAdmin, conversation_id, source_message_id); return new Response(JSON.stringify({success:true,escalation_rule:"R1",response_route:"warm_handoff_data_collection",handoff_required:false,handoff_mode:hf1Decision.handoff_mode,missing_info_policy:hf1Decision.missing_info_policy}),{headers:{...corsHeaders,"Content-Type":"application/json"}}); }\n      if (["human_control","resolved","superseded_source"].includes(collected.result)) return new Response(JSON.stringify({success:true,skipped:collected.result}),{headers:{...corsHeaders,"Content-Type":"application/json"}});\n      return new Response(JSON.stringify({success:false,error:`r1_optional_clarification_${collected.result}`}),{status:409,headers:{...corsHeaders,"Content-Type":"application/json"}});\n    }\n  }'''
          body=body.replace(class_anchor,injected,1)
          s=s[:m.start()]+body+'\n\nasync function orchestrationGenerateReply'+s[m.end():]
          p.write_text(s)
          print('HF1_DIRECTOR_PATCH=PASS')
          PY
      - name: HF-1 deterministic assertions
        run: |
          set -euo pipefail
          node --experimental-strip-types supabase/functions/_shared/task1-closure-handoff.test.ts
      - name: Source contract and build
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "tanstack_start_ts"
          node -e "const p=require('./package.json'); if(p.private!==true) process.exit(1)"
          grep -q 'handoff_mode' supabase/functions/_shared/handoff-decision.ts
          grep -q 'optional_clarification_then_handoff' supabase/functions/generate-reply/index.ts
          grep -q 'missing_fact_not_closure' supabase/functions/_shared/conversation-closure.ts
          grep -q 'conversation_closure' supabase/functions/generate-reply/index.ts
          git diff --check
          npm ci
          npm run build
          echo HF1_DIRECTOR_FINAL_GATE=PASS
      - name: Commit Director takeover implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/warm-handoff.ts supabase/functions/_shared/handoff-decision.ts supabase/functions/_shared/conversation-closure.ts supabase/functions/_shared/task1-closure-handoff.test.ts supabase/functions/generate-reply/index.ts
          git commit -m "Director takeover: complete HF-1 handoff decision and closure" 
          git push origin HEAD:main
