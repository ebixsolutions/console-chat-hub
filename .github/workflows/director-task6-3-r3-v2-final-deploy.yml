name: Director Task 6.3 R3 V2 Final Deploy Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/director-task6-3-r3-v2-final-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Exact source assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('supabase/functions/_shared/escalation-shadow.ts').read_text()
          g=Path('supabase/functions/generate-reply/index.ts').read_text()
          r=Path('supabase/functions/_shared/runtime-signal-lifecycle.ts').read_text()
          e=Path('supabase/functions/_shared/emotion-reply-strategy.ts').read_text()
          assert 'current-turn-emotion-v1\\.0|current-turn-emotion-v2\\.0' in s
          assert 'startsWith("current-turn-emotion-v1.0")' not in s
          assert 'buildEmotionReplyStrategyContext' in g
          assert '_emotionReplyStrategyBlock' in g
          assert 'current-turn-emotion-v2.0' in r
          for k in ['angry','frustrated','disappointed','helpless','confused','hesitant','urgent','positive','positive_recovery','high_intent']:
              assert f'{k}:' in e, k
          print('TASK6_3_SOURCE_ASSERTIONS=PASS')
          PY
      - name: R3 v1 v2 provenance runtime assertions
        shell: bash
        run: |
          set -euo pipefail
          cat > .task6_3_r3_v2.test.ts <<'TS'
          const { evaluateEscalationShadow } = await import(`./supabase/functions/_shared/escalation-shadow.ts`);
          const env = { get(name: string) { if (name === 'ESC_SHADOW_MODE') return 'true'; if (name === 'ESC_ENABLE_R3') return 'true'; return undefined; } };
          const base = {
            conversation_id:'00000000-0000-4000-8000-000000000001',
            source_message_id:'00000000-0000-4000-8000-000000000002',
            latest_message_content:'我真的很生氣，已經試了很多次都沒有解決',
            conversation_status:'open', assigned_agent_id:null, explicit_request:false,
            expected_tenant_id:'tenant-test', anger_flag:true as const, sentiment_score:-0.9,
          };
          Deno.test('v2 provenance accepted and R3 never forced handoff',()=>{
            const r=evaluateEscalationShadow({...base,sentiment_provider_version:'current-turn-emotion-v2.0'},env)!;
            if(r.provider_warnings.includes('CE_ADVISORY_SIGNAL_PROVENANCE_INCOMPLETE')) throw new Error('v2 rejected');
            if(r.matched_rule==='R3' && r.decision!=='recommend_handoff') throw new Error(`bad R3 decision ${r.decision}`);
            if(r.matched_rule==='R3' && r.decision==='handoff') throw new Error('R3 forced handoff');
          });
          Deno.test('v1 backward compatibility accepted',()=>{
            const r=evaluateEscalationShadow({...base,sentiment_provider_version:'current-turn-emotion-v1.0'},env)!;
            if(r.provider_warnings.includes('CE_ADVISORY_SIGNAL_PROVENANCE_INCOMPLETE')) throw new Error('v1 rejected');
          });
          Deno.test('unknown provider rejected fail closed',()=>{
            const r=evaluateEscalationShadow({...base,sentiment_provider_version:'current-turn-emotion-v9.9'},env)!;
            if(!r.provider_warnings.includes('CE_ADVISORY_SIGNAL_PROVENANCE_INCOMPLETE')) throw new Error('unknown accepted');
          });
          TS
          deno test --allow-read .task6_3_r3_v2.test.ts
          rm .task6_3_r3_v2.test.ts
          echo TASK6_3_R3_V2_RUNTIME_ASSERTIONS=PASS
      - name: Compile and frozen regressions
        shell: bash
        run: |
          set -euo pipefail
          deno check --no-lock --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          if [ -f tests/edge/runtime-signal-lifecycle.test.ts ]; then deno test --allow-read tests/edge/runtime-signal-lifecycle.test.ts; fi
          if [ -f tests/edge/emotion-reply-strategy.test.ts ]; then deno test --allow-read tests/edge/emotion-reply-strategy.test.ts; fi
          deno test --allow-read tests/edge/warm-handoff-package.test.ts
          deno test --allow-read tests/edge/return-to-ai-control-context.test.ts
          npm ci
          npm run build
          git restore -- deno.lock package-lock.json 2>/dev/null || true
          git diff --check
          test -z "$(git status --porcelain)"
          echo TASK6_3_COMPILE_REGRESSION_BUILD=PASS
      - name: Deploy generate-reply only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@2.116.0 functions deploy generate-reply --project-ref "$PROJECT_REF"
          echo TASK6_3_GENERATE_REPLY_REDEPLOY=PASS
      - name: Final gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo TASK6_3_R3_V2_FINAL_DEPLOY_GATE=PASS
