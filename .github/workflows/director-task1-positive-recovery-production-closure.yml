name: Director Task 1 Positive Recovery Production Closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/director-task1-positive-recovery-production-closure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_ORIGIN: https://console-chat-hub.lovable.app
      CHANNEL_ID: b0000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Implement positive recovery source fix
        run: python scripts/task1-positive-recovery-closure.py patch

      - name: Validate source compile regressions and build
        shell: bash
        run: |
          set -euo pipefail
          deno check --no-lock --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          deno test --allow-read tests/edge/runtime-signal-multi-emotion.test.ts
          deno test --allow-read tests/edge/emotion-reply-strategy.test.ts
          deno test --allow-read tests/edge/warm-handoff-package.test.ts
          deno test --allow-read tests/edge/return-to-ai-control-context.test.ts
          if [ -f tests/edge/prior-grounded-transform.test.ts ]; then
            deno test --allow-read tests/edge/prior-grounded-transform.test.ts
          fi
          git diff --check
          npm ci
          npm run build
          git restore -- deno.lock package-lock.json 2>/dev/null || true
          dirty="$(git status --porcelain)"
          unexpected="$(printf '%s\n' "$dirty" | grep -v 'supabase/functions/generate-reply/index.ts' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo TASK1_PRECOMMIT_DIRTY_SCOPE=FAIL
            printf '%s\n' "$dirty"
            exit 1
          fi
          echo TASK1_COMPILE_REGRESSION_BUILD=PASS

      - name: Commit authoritative generate-reply fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/generate-reply/index.ts; then
            echo TASK1_GENERATE_REPLY_ALREADY_SYNCED=PASS
          else
            git config user.name ebixsolutions
            git config user.email 64578119+ebixsolutions@users.noreply.github.com
            git add supabase/functions/generate-reply/index.ts
            test "$(git diff --cached --name-only)" = "supabase/functions/generate-reply/index.ts"
            git commit -m "fix(task1): bypass grounding for pure positive recovery acknowledgement"
            git push origin HEAD:main
          fi
          test -z "$(git status --porcelain)"
          echo TASK1_AUTHORITATIVE_SOURCE_COMMIT=PASS

      - name: Deploy generate-reply only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@2.116.0 functions deploy generate-reply --project-ref "$PROJECT_REF"
          rm -rf supabase/.temp
          test -z "$(git status --porcelain)"
          echo TASK1_GENERATE_REPLY_DEPLOY=PASS

      - name: Run multilingual live production smoke
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          python scripts/task1-positive-recovery-closure.py smoke

      - name: Final gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/.temp
          git diff --check
          test -z "$(git status --porcelain)"
          python - <<'PY'
          from pathlib import Path
          g = Path('supabase/functions/generate-reply/index.ts').read_text()
          e = Path('supabase/functions/_shared/emotion-reply-strategy.ts').read_text()
          assert 'positive_recovery_acknowledgement' in g
          assert 'resolvePositiveRecoveryAcknowledgement' in g
          assert 'PURE_POSITIVE_RECOVERY_ACK' in e
          assert 'Emotion alone never authorizes' in e
          print('TASK1_FINAL_SOURCE_ASSERTIONS=PASS')
          PY
          echo TASK1_FINAL_GATE=PASS
          echo TASK1_FINAL_STATUS=READY
