name: A3 Task1 Director Final Gate Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a3-task1-director-final-gate-temp.yml'

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm ci
      - name: Run A3 source final gate
        run: node .github/scripts/task_a3_final_gate.mjs
