name: Workflow2 Task2.3 B1 B3 Production Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow2-task2-3-b1-b3-production-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@latest --version

      - name: Build ephemeral read-only runtime probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/task2-3-b1-b3-probe
          cat > supabase/functions/task2-3-b1-b3-probe/index.ts <<'TS'
          const json = (body: Record<string, unknown>, status = 200) => new Response(JSON.stringify(body), {
            status,
            headers: { 'content-type': 'application/json' },
          });
          const text = (v: string | undefined | null) => (v ?? '').trim();
          const valid = (v: string) => v.length >= 16 && v.length <= 4096 && !/[\r\n\0]/.test(v);

          Deno.serve(async (req) => {
            if (req.method !== 'POST') return json({ ok: false, error: 'method_not_allowed' }, 405);
            const expected = text(Deno.env.get('TASK2_3_PROBE_TOKEN'));
            const actual = text(req.headers.get('x-task2-3-probe-token'));
            if (!expected || !actual || expected !== actual) return json({ ok: false, error: 'unauthorized' }, 401);

            const serviceRole = [
              Deno.env.get('SINGAPORE_SERVICE_ROLE_SECRET'),
              Deno.env.get('KB_SINGAPORE_SERVICE_ROLE_SECRET'),
              Deno.env.get('SERVICE_ROLE_SECRET'),
            ].map(text).find(Boolean) ?? '';
            const backendToken = text(Deno.env.get('SINGAPORE_BACKEND_TOKEN'));
            const controlKind = serviceRole ? 'service_role' : backendToken ? 'bearer' : 'missing';
            const controlValue = serviceRole || backendToken;
            const base = text(Deno.env.get('KB_SINGAPORE_BASE_URL')) || 'https://py.ebixmall.com/py-knowledge-base';
            if (controlKind === 'missing' || !valid(controlValue)) {
              return json({ ok: false, b1: 'missing_or_invalid_control_credential', control_kind: controlKind }, 503);
            }
            const headers: Record<string, string> = { 'content-type': 'application/json' };
            if (controlKind === 'service_role') headers['x-service-role-secret'] = controlValue;
            else headers.authorization = `Bearer ${controlValue}`;

            async function call(path: string, init: RequestInit) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 15000);
              try {
                const response = await fetch(`${base}${path}`, { ...init, headers: { ...headers, ...(init.headers || {}) }, signal: controller.signal });
                const body = await response.text();
                return { status: response.status, body_prefix: body.slice(0, 240) };
              } catch (error) {
                return { status: 0, body_prefix: String(error).slice(0, 240) };
              } finally {
                clearTimeout(timeout);
              }
            }

            const entity = await call('/api/entities/KBDocument/__task2_3_probe_not_found__', { method: 'GET' });
            const review = await call('/api/functions/kbReviewExecute', {
              method: 'POST',
              body: JSON.stringify({
                document_id: '__task2_3_invalid__',
                review_mode: 'smart',
                idempotency_key: 'task2-3-probe-invalid',
                expected_global_document_id: '00000000-0000-4000-8000-000000000000',
                expected_version: '0.0',
                expected_content_hash: '0'.repeat(64),
              }),
            });

            return json({
              ok: true,
              control_kind: controlKind,
              b1_entity_http_status: entity.status,
              b3_review_http_status: review.status,
              b1_auth_rejected: [401, 403].includes(entity.status),
              b3_auth_rejected: [401, 403].includes(review.status),
              b3_endpoint_missing: review.status === 404,
              network_failed: entity.status === 0 || review.status === 0,
              entity_body_prefix: entity.body_prefix,
              review_body_prefix: review.body_prefix,
            });
          });
          TS

      - name: Install ephemeral probe token and deploy
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TOKEN="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(40))
          PY
          )"
          echo "PROBE_TOKEN=$PROBE_TOKEN" >> "$GITHUB_ENV"
          npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" TASK2_3_PROBE_TOKEN="$PROBE_TOKEN"
          npx --yes supabase@latest functions deploy task2-3-b1-b3-probe --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Execute machine B1 B3 runtime assertions
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/task2-3-b1-b3-probe"
          curl --fail-with-body --silent --show-error \
            -X POST "$URL" \
            -H 'content-type: application/json' \
            -H "x-task2-3-probe-token: $PROBE_TOKEN" \
            -d '{}' > /tmp/probe.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/probe.json'))
          print('B1_CONTROL_KIND=' + str(p.get('control_kind')))
          print('B1_ENTITY_HTTP_STATUS=' + str(p.get('b1_entity_http_status')))
          print('B3_REVIEW_HTTP_STATUS=' + str(p.get('b3_review_http_status')))
          if p.get('network_failed'):
              raise SystemExit('STOP_B1_B3_NETWORK_UNREACHABLE')
          if p.get('control_kind') not in ('service_role','bearer'):
              raise SystemExit('STOP_B1_CONTROL_CREDENTIAL_MISSING')
          if p.get('b1_auth_rejected'):
              raise SystemExit('STOP_B1_CONTROL_CREDENTIAL_REJECTED')
          # A read of a deliberately non-existing document should normally be 404;
          # any non-401/403 response proves the control credential reached the API.
          print('B1_CONTROL_RUNTIME=PASS')
          if p.get('b3_endpoint_missing'):
              raise SystemExit('STOP_B3_REVIEW_EXECUTOR_NOT_DEPLOYED')
          if p.get('b3_auth_rejected'):
              raise SystemExit('STOP_B3_REVIEW_EXECUTOR_AUTH_REJECTED')
          # Invalid body must fail closed; 2xx here would be unsafe.
          status=int(p.get('b3_review_http_status') or 0)
          if 200 <= status < 300:
              raise SystemExit('FAIL_B3_REVIEW_EXECUTOR_ACCEPTED_INVALID_BINDING')
          if status < 400 or status >= 500:
              raise SystemExit('STOP_B3_REVIEW_EXECUTOR_RUNTIME_UNHEALTHY')
          print('B3_REVIEW_EXECUTOR_RUNTIME=PASS')
          PY

      - name: Delete ephemeral runtime probe
        if: always()
        shell: bash
        run: |
          set +e
          npx --yes supabase@latest functions delete task2-3-b1-b3-probe --project-ref "$PROJECT_REF" --yes
          # The probe token is harmless without the deleted function. We do not
          # print or persist its value anywhere in repository artifacts.
