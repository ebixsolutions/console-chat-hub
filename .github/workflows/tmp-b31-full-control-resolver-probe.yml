name: tmp-b31-full-control-resolver-probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-b31-full-control-resolver-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
      PROBE_TOKEN: 7f898b55d0db4d7e8cb62764e9c1f84e
    steps:
      - uses: actions/checkout@v4
      - name: Build production-resolver probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/tmp-b31-full-control-resolver-probe
          cat > supabase/functions/tmp-b31-full-control-resolver-probe/index.ts <<'TS'
          import {
            resolveSingaporeControlCredential,
            singaporeCredentialHeaders,
            type KBCredentialConfig,
            type KBCredentialScope,
          } from '../_shared/kb-auth.ts';
          import { parseStringMap, resolveKBEndpoint } from '../_shared/kb-client.ts';

          const EXPECTED='7f898b55d0db4d7e8cb62764e9c1f84e';
          function response(x: unknown, status=200){return new Response(JSON.stringify(x),{status,headers:{'content-type':'application/json'}})}
          Deno.serve(async(req)=>{
            if(req.headers.get('x-probe-token')!==EXPECTED) return response({ok:false},401);
            const endpoint=resolveKBEndpoint();
            const tenantMap=parseStringMap(Deno.env.get('KB_SINGAPORE_TENANT_MAP_JSON'));
            if(!endpoint||!tenantMap) return response({ok:false,error:'runtime_config_missing'},503);
            const cfg: KBCredentialConfig={
              signingSecret:endpoint.signingSecret,
              jwtTtlSec:endpoint.jwtTtlSec,
              defaultToken:endpoint.defaultToken,
              tenantTokens:endpoint.tenantTokens,
              tenantApiKeys:endpoint.tenantApiKeys,
              apiKeyHeaderMode:endpoint.apiKeyHeaderMode,
            };
            const rows=[];
            for(const [aiCompanyId,singaporeTenantId] of Object.entries(tenantMap)){
              const scope: KBCredentialScope={mode:'canonical',aiCompanyId,singaporeTenantId};
              const credential=await resolveSingaporeControlCredential(scope,cfg);
              if(!credential.ok){rows.push({singaporeTenantId,resolver_ok:false,error_code:credential.error_code});continue;}
              const statuses:Record<string,number|string>={};
              for(const route of ['/api/entities/KBDocument','/api/entities/KBAgentRegistry','/api/entities/KBAgentToggleConfig','/api/entities/KBReview','/api/entities/KBAgentResult']){
                try{
                  const r=await fetch(endpoint.baseUrl+route,{headers:{...singaporeCredentialHeaders(credential,cfg),'accept':'application/json'}});
                  statuses[route]=r.status; await r.body?.cancel();
                }catch{statuses[route]='FETCH_ERROR'}
              }
              rows.push({singaporeTenantId,resolver_ok:true,credential_kind:credential.kind,statuses});
            }
            return response({ok:true,rows});
          });
          TS
      - name: Deploy invoke assert and delete
        shell: bash
        run: |
          set -euo pipefail
          cleanup(){ npx --yes supabase@latest functions delete tmp-b31-full-control-resolver-probe --project-ref "$PROJECT_REF" --yes >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@latest functions deploy tmp-b31-full-control-resolver-probe --project-ref "$PROJECT_REF" --no-verify-jwt
          sleep 4
          curl -sS --fail-with-body --max-time 40 -H "x-probe-token: ${PROBE_TOKEN}" "https://${PROJECT_REF}.supabase.co/functions/v1/tmp-b31-full-control-resolver-probe" >/tmp/result.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/result.json'))
          print('B31_FULL_RESOLVER_OK=' + ('YES' if x.get('ok') else 'NO'))
          for row in x.get('rows',[]):
              print('TENANT=' + str(row.get('singaporeTenantId')))
              print('RESOLVER_OK=' + str(row.get('resolver_ok')).upper())
              if row.get('resolver_ok'):
                  print('CREDENTIAL_KIND=' + str(row.get('credential_kind')))
                  for k,v in sorted(row.get('statuses',{}).items()): print('STATUS ' + k + '=' + str(v))
              else:
                  print('ERROR_CODE=' + str(row.get('error_code')))
          PY
