name: Task3C source workspace operation
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/task3c-source-workspace.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'ebixsolutions/console-chat-hub' && github.actor == 'ebixsolutions'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b374e98528499a9e0908abf7d01fda96809bf41e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact original source and unchanged application dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b374e98528499a9e0908abf7d01fda96809bf41e
          test "$(git rev-parse HEAD^{tree})" = 7b0452ae3bd0d10fe28d3c7a21e07a879d5dad51
          test "$(git hash-object package.json)" = 9cd32b21d414c853259e416510c745b56049443c
          npm ci
          mkdir -p "$RUNNER_TEMP/task3c-workspace/evidence" "$RUNNER_TEMP/task3c-workspace/sdk"
          npm --prefix "$RUNNER_TEMP/task3c-workspace/sdk" install --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2.45.0
          git diff --exit-code
          git bundle create "$RUNNER_TEMP/task3c-workspace/source.bundle" HEAD
          node --version > "$RUNNER_TEMP/task3c-workspace/evidence/node-version.txt"
          cp package-lock.json "$RUNNER_TEMP/task3c-workspace/evidence/package-lock.json"
          tar -czf "$RUNNER_TEMP/task3c-workspace/dependencies.tgz" node_modules
          tar -czf "$RUNNER_TEMP/task3c-workspace/sdk.tgz" -C "$RUNNER_TEMP/task3c-workspace" sdk
          rm -rf "$RUNNER_TEMP/task3c-workspace/sdk"
          cd "$RUNNER_TEMP/task3c-workspace"
          sha256sum source.bundle dependencies.tgz sdk.tgz > SHA256SUMS
      - name: Preserve original isolated baseline results
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task3c-sdk"
          tar -xzf "$RUNNER_TEMP/task3c-workspace/sdk.tgz" -C "$RUNNER_TEMP/task3c-sdk"
          export C3_CONSOLE_SDK_ROOT="$RUNNER_TEMP/task3c-sdk/sdk"
          node --test tests/emergency-p0/chain.test.mjs > "$RUNNER_TEMP/task3c-workspace/evidence/handler-before.log" 2>&1
          node --test tests/section15/human-service-routing.test.mjs > "$RUNNER_TEMP/task3c-workspace/evidence/section15-before.log" 2>&1
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3c-authoritative-workspace-b374e985
          path: ${{ runner.temp }}/task3c-workspace/
          if-no-files-found: error
          retention-days: 3
