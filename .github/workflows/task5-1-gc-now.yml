name: Task 5.1 Attachment GC Now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/task5-1-gc-now.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Execute target attachment GC
        shell: bash
        run: |
          set -euo pipefail
          set -a; source .env; set +a
          RESP=$(curl -fsS -X POST -H 'Content-Type: application/json' --data '{}' "${VITE_SUPABASE_FUNCTIONS_URL}/attachment-gc")
          python - <<'PY' "$RESP"
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('success') is True,d
          assert d.get('failed')==0,d
          print('PASS attachment-gc',d)
          PY
