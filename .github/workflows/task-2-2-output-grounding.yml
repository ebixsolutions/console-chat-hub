name: Task 2.2 Output Grounding Validation

on:
  push:
    branches:
      - director/task-2-2-output-grounding

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/task-2-2-output-grounding
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify package baseline
        run: |
          node -e 'const p=require("./package.json"); if(p.version!=="2.7.1"){console.error(`expected package.json 2.7.1, got ${p.version}`); process.exit(1)}; console.log("PACKAGE_BASELINE=PASS")'

      - name: Deno compile governed router
        run: deno check supabase/functions/_shared/llm-router.ts

      - name: Deno compile generate-reply integration
        run: deno check supabase/functions/generate-reply/index.ts

      - name: Task 2.2 unit assertions
        run: deno test tests/edge/task2-2-output-grounding-router.test.ts

      - name: Machine contract assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          router = Path('supabase/functions/_shared/llm-router.ts').read_text()
          generate = Path('supabase/functions/generate-reply/index.ts').read_text()
          checks = {
            'single governed provider callsite': 'from "../_shared/llm-router.ts"' in generate,
            'KB grounding marker detection': 'Knowledge Base grounding rules:' in router,
            'exact-fact gate': 'validateExactFactGrounding' in router,
            'semantic verifier': 'verifyGroundedGeneration' in router,
            'same-evidence verifier': 'grounding.evidence_text' in router,
            'no second KB search': '/api/v1/rag/context-search' not in router and 'fetchKBRag' not in router,
            'fail closed as invalid output': 'code: "LLM_INVALID_OUTPUT"' in router and 'LLM_OUTPUT_UNGROUNDED' in router,
            'verifier lineage allowlist': 'parseGroundingVerifierDecision' in router,
          }
          print(checks)
          failed = [k for k,v in checks.items() if not v]
          if failed:
            raise SystemExit('CONTRACT_FAIL: ' + ', '.join(failed))
          print('TASK_2_2_CONTRACT=PASS')
          PY
