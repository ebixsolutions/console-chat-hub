name: Director E2 E1 Critical Priority Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/director-e2-e1-critical-priority-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-validate-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_ORIGIN: https://console-chat-hub.lovable.app
      CHANNEL_ID: b0000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Move critical E2 ahead of early conversational returns and let high-risk E1 bypass generic clarification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/generate-reply/index.ts')
          s=p.read_text()
          anchor='  const _visitorLang = detectVisitorLanguage(_h1LastMsg);\n  const _canonicalTurn = classifyCanonicalConversationTurn(\n'
          assert anchor in s
          if 'const _criticalE2ThreatSignal = classifyAuthoritativeThreat(_h1LastMsg);' not in s:
              block='''  const _visitorLang = detectVisitorLanguage(_h1LastMsg);\n  // P0 critical preflight: E2 must run before customer-context and generic clarification early returns.\n  const _criticalE2ExpectedTenantId =\n    typeof conversation.company_id === "string" && conversation.company_id.length > 0\n      ? conversation.company_id\n      : undefined;\n  const _criticalE2ThreatSignal = classifyAuthoritativeThreat(_h1LastMsg);\n  if (isE2LiveActivationEnabled(Deno.env) && _criticalE2ThreatSignal) {\n    const _criticalE2Response = await evaluateAndPersistRequiredRulesLive(supabaseAdmin, {\n      conversation_id,\n      source_message_id,\n      latest_message_content: _h1LastMsg,\n      conversation_status: conversation.status,\n      assigned_agent_id: conversation.assigned_agent_id ?? null,\n      greeting_or_trivial: isGreetingOrTrivial(_h1LastMsg),\n      visitor_language: _visitorLang,\n      expected_tenant_id: _criticalE2ExpectedTenantId,\n      turn_count: _pr5History.turn_count,\n      consecutive_no_answer: _pr5History.consecutive_no_answer,\n      clarification_attempts: _pr5History.clarification_attempts,\n      exact_same_intent_repeated: _pr5History.exact_same_intent_repeated,\n      threat_flag: _criticalE2ThreatSignal,\n      compliance_jurisdiction_requires_human_review: resolveAuthoritativeComplianceReview(_criticalE2ExpectedTenantId),\n    });\n    if (_criticalE2Response) return _criticalE2Response;\n  }\n  const _criticalLocalRisk = classifyLocalTopicRisk(_h1LastMsg);\n  const _canonicalTurn = classifyCanonicalConversationTurn(\n'''
              s=s.replace(anchor,block,1)
          old='  if (_turnClassification.should_clarify_before_kb && !isHandoffIntent(_h1LastMsg)) {\n'
          new='  if (_turnClassification.should_clarify_before_kb && !isHandoffIntent(_h1LastMsg) && _criticalLocalRisk?.level !== "high") {\n'
          assert old in s or new in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('supabase/functions/generate-reply/index.ts').read_text()
          e2=s.index('const _criticalE2ThreatSignal = classifyAuthoritativeThreat(_h1LastMsg);')
          canonical=s.index('const _canonicalTurn = classifyCanonicalConversationTurn(', e2)
          clarify=s.index('if (_turnClassification.should_clarify_before_kb', canonical)
          assert e2 < canonical < clarify
          assert '_criticalLocalRisk?.level !== "high"' in s[clarify:clarify+300]
          print('CRITICAL_PRIORITY_TOPOLOGY=PASS')
          PY

      - name: Regression compile and full build
        shell: bash
        run: |
          set -euo pipefail
          deno test --allow-read tests/edge/e2-direct-threat.test.ts
          deno test --allow-read tests/edge/warm-handoff-package.test.ts
          deno test --allow-read --allow-env --node-modules-dir=auto tests/edge/task2-human-language-transform-regression.test.ts
          deno test --allow-read --allow-env --node-modules-dir=auto tests/edge/task2-standalone-simplify-regression.test.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          git diff --check
          npm ci
          npm run build
          echo CRITICAL_PRIORITY_REGRESSION_BUILD=PASS

      - name: Commit exact functional source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Director Runtime Fix'
          git config user.email 'director-runtime-fix@users.noreply.github.com'
          git add supabase/functions/generate-reply/index.ts
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -le 1
          if ! git diff --cached --quiet; then
            git commit -m '[director] enforce E2 E1 critical priority before clarification'
            git push origin HEAD:main
          fi
          echo CRITICAL_PRIORITY_FUNCTIONAL_COMMIT=PASS

      - name: Deploy generate-reply only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 functions deploy generate-reply --project-ref "$PROJECT_REF"
          echo CRITICAL_PRIORITY_DEPLOY=PASS

      - name: Production E2 smoke
        shell: bash
        run: |
          set -euo pipefail; set -a; source .env; set +a
          BASE="$VITE_SUPABASE_FUNCTIONS_URL"; SU="$VITE_SUPABASE_URL"
          curl -fsS --retry 3 --retry-all-errors -A 'curl/8 critical-priority-smoke' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" -o /tmp/k.json
          python - <<'PY' /tmp/k.json >/tmp/k.env
          import json,sys,shlex
          a=json.load(open(sys.argv[1])); val=lambda r:r.get('api_key') or r.get('key') or r.get('value'); sk=[val(r) for r in a if str(r.get('type') or '').lower()=='secret' and val(r)]; assert sk; print('SK='+shlex.quote(sk[0]))
          PY
          source /tmp/k.env; rm /tmp/k.json
          S=$(curl -fsS -X POST -H "Origin: $PROD_ORIGIN" -H 'Content-Type: application/json' --data "{\"channel_id\":\"$CHANNEL_ID\",\"visitor_metadata\":{\"critical_priority_smoke\":true,\"exclude_training\":true}}" "$BASE/create-visitor-session")
          python - <<'PY' "$S" >/tmp/s.env
          import json,sys,shlex; d=json.loads(sys.argv[1]); assert d.get('success') is True,d; x=d['data']; print('CID='+shlex.quote(x['conversation_id'])); print('TOK='+shlex.quote(x['session_token']))
          PY
          source /tmp/s.env
          payload=$(python - <<'PY' "$CID" "$TOK"
          import json,sys; print(json.dumps({'conversation_id':sys.argv[1],'session_token':sys.argv[2],'content':'我要殺了你。'},ensure_ascii=False))
          PY
          )
          curl -fsS -X POST -H "Origin: $PROD_ORIGIN" -H 'Content-Type: application/json' -H "idempotency-key: $(python -c 'import uuid;print(uuid.uuid4())')" --data "$payload" "$BASE/receive-widget-message" >/tmp/send.json
          for i in $(seq 1 30); do
            sleep 2
            curl -fsS -X POST -H "Origin: $PROD_ORIGIN" -H 'Content-Type: application/json' --data "{\"conversation_id\":\"$CID\",\"session_token\":\"$TOK\"}" "$BASE/widget-poll-messages" >/tmp/poll.json
            st=$(python -c 'import json;d=json.load(open("/tmp/poll.json"));print(d["data"].get("conversation_status",""))')
            [ "$st" = pending ] && break
          done
          curl -fsS -H "apikey: $SK" -H "Authorization: Bearer $SK" "$SU/rest/v1/handoff_event?conversation_id=eq.$CID&select=escalation_rule,branch_tag,handoff_reason&order=created_at.desc&limit=1" >/tmp/e.json
          python - <<'PY' /tmp/poll.json /tmp/e.json
          import json,sys
          d=json.load(open(sys.argv[1])); e=json.load(open(sys.argv[2])); assert d['data'].get('conversation_status')=='pending',(d['data'].get('conversation_status'),e); assert e and e[0].get('escalation_rule')=='E2',e
          m=[x for x in d['data'].get('messages',[]) if x.get('role')=='assistant'][-1]; assert (m.get('metadata') or {}).get('response_route')!='warm_handoff_data_collection'
          print('E2_CRITICAL_BYPASS=PASS')
          PY
          echo CRITICAL_PRIORITY_PRODUCTION_E2=PASS
