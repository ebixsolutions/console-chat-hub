name: Workflow 5 v71 Upstream Topical Routing Final

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workflow5-v71-receive-topical-final.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_ORIGIN: https://console-chat-hub.lovable.app
      CHANNEL_ID: b0000000-0000-0000-0000-000000000001
      BASE: https://nrfxhqabwblzxoushgnm.supabase.co/functions/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Closure rerun: compile gate injects a temporary type-only EdgeRuntime declaration.
      - name: Repair upstream routing deploy and fresh Case09 final gate
        shell: bash
        run: bash .github/scripts/workflow5_v71_receive_topical_final.sh
