name: Workflow 6 Final Assertion Closure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workflow6-case10-handoff-closure.yml'

permissions:
  actions: write
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair final assertion and run fresh 10x24
        shell: bash
        run: bash .github/scripts/workflow6_assertion_final.sh

# closure trigger v5
