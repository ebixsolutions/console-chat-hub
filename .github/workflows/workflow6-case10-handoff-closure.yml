name: Workflow 6 Case10 Handoff Closure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workflow6-case10-handoff-closure.yml'

permissions:
  actions: write
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Implement handoff closure and run final 10x24
        shell: bash
        run: |
          sed -i 's/\["假如我要真人會點？","conditional"\]/["假如我要真人會點？","hypothetical"]/' .github/scripts/workflow6_case10_handoff_closure.sh
          bash .github/scripts/workflow6_case10_handoff_closure.sh

