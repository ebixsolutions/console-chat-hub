name: Task 5.1 Widget Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/task5-1-widget-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Human support snippets
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 8 -E 'human_support|You are waiting for a team member|AI replies are paused' public/widget/chat.js || true
          grep -n -C 5 -E 'emoji|fileInput|multipart|FormData' public/widget/chat.js | head -240 || true
