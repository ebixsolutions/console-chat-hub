name: Task 2.2 Compiler Diagnostic
on: [push]
permissions:
  contents: write
jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/task-2-2-output-grounding
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Capture and persist generate-reply compiler output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts > task2-2-compile.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> task2-2-compile.log
          cat task2-2-compile.log
          content=$(base64 -w 0 task2-2-compile.log)
          payload=$(python3 -c 'import json,os; print(json.dumps({"message":"Persist Task 2.2 compiler diagnostic","content":os.environ["CONTENT"],"branch":"director/task-2-2-output-grounding"}))' CONTENT="$content")
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ebixsolutions/console-chat-hub/contents/task2-2-compile.log \
            -d "$payload"
          exit 0
