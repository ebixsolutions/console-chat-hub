name: Task 2.2 Compiler Diagnostic
on: [push]
permissions:
  contents: write
jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/task-2-2-output-grounding
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Capture generate-reply compiler output
        shell: bash
        run: |
          set +e
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts > task2-2-compile.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> task2-2-compile.log
          cat task2-2-compile.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task2-2-compile.log
          git commit -m "Capture Task 2.2 compiler diagnostic"
          git push origin HEAD:director/task-2-2-output-grounding
          exit 0
