name: Task 2.2 Final Gate
on: [push]
jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Authoritative package baseline
        shell: bash
        run: |
          test "$(git hash-object package.json)" = "7e2063d0268e63ed0a0401eb4fecabffcbbc40a4"
          echo PACKAGE_BASELINE_HASH=PASS
      - name: Check governed router
        run: deno check --node-modules-dir=auto supabase/functions/_shared/llm-router.ts
      - name: Check generate reply
        run: deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
      - name: Run Task 2.2 tests
        run: deno test --node-modules-dir=auto tests/edge/task2-2-output-grounding-router.test.ts
      - name: Contract assertions
        shell: bash
        run: |
          grep -q 'buildVerifierEvidenceAliases' supabase/functions/_shared/llm-router.ts
          grep -q 'verifyGroundedGeneration' supabase/functions/_shared/llm-router.ts
          grep -q 'LLM_OUTPUT_UNGROUNDED' supabase/functions/_shared/llm-router.ts
          grep -q 'parseGroundingVerifierDecision(parsed.text, verifierEvidence.allowed_ids)' supabase/functions/_shared/llm-router.ts
          ! grep -q 'fetchKBRag' supabase/functions/_shared/llm-router.ts
          ! grep -q '/api/v1/rag/context-search' supabase/functions/_shared/llm-router.ts
          echo TASK_2_2_CONTRACT=PASS
