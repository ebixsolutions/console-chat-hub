name: Task 4.1 Deploy Generate Reply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task4-1-deploy-generate-reply.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify deployment credential exists without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'EXTERNAL_BLOCKER: SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions.' >&2
            exit 78
          fi
          echo 'PASS: Supabase deployment credential is configured.'
      - name: Deploy authoritative generate-reply source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy generate-reply \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt=false
