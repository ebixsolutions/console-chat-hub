name: Task 6.3 CE Policy Gap Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/task6-3-ce-policy-gap-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply policy-gap non-blocking CE repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/_shared/ce-automation-engine.ts')
          s=p.read_text()
          old='''        riskLevel: "high",\n        requirePolicyEvidence: true,'''
          new='''        // Missing applicable policy evidence is a governed policy-gap signal,\n        // not a reason to suppress the other realtime CE dimensions. The\n        // grounding manifest preserves policy_gap=true for the policy evaluator.\n        riskLevel: "high",\n        requirePolicyEvidence: false,'''
          assert s.count(old)==1, 'canonical grounding policy baseline mismatch'
          p.write_text(s.replace(old,new,1))
          PY
          grep -q 'requirePolicyEvidence: false' supabase/functions/_shared/ce-automation-engine.ts
          git diff --check
          echo TASK6_3_CE_POLICY_GAP_NONBLOCKING=PASS
      - name: Install and production build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Freeze automation engine hash and run final gate
        shell: bash
        run: |
          set -euo pipefail
          H="$(git hash-object supabase/functions/_shared/ce-automation-engine.ts)"
          python - "$H" <<'PY'
          from pathlib import Path
          import sys
          h=sys.argv[1]
          p=Path('scripts/task6-3-final-gate.mjs')
          s=p.read_text()
          marker="  'supabase/functions/_shared/ce-grounding.ts':"
          assert marker in s
          line=next(x for x in s.splitlines() if marker in x)
          insertion=line+"\n  'supabase/functions/_shared/ce-automation-engine.ts': '"+h+"',"
          assert "'supabase/functions/_shared/ce-automation-engine.ts':" not in s
          p.write_text(s.replace(line,insertion,1))
          PY
          node scripts/task6-3-final-gate.mjs
          echo "TASK6_3_CE_AUTOMATION_ENGINE_BLOB=$H"
      - name: Commit authoritative repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          git add supabase/functions/_shared/ce-automation-engine.ts scripts/task6-3-final-gate.mjs
          git commit -m 'Keep CE realtime scoring active on policy gaps'
          git push origin HEAD:main
      - name: Deploy repaired CE worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@latest functions deploy ce-evaluation-worker --project-ref "$PROJECT_REF" --no-verify-jwt
          echo TASK6_3_CE_POLICY_GAP_DEPLOY=PASS
