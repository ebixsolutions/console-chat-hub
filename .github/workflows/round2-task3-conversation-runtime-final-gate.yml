name: Round2 Task3 Conversation Runtime Final Gate

on:
  push:
    branches:
      - director/round2-task3-conversation-runtime-final-gate
    paths:
      - .github/workflows/round2-task3-conversation-runtime-final-gate.yml
      - scripts/integrated_final_production_smoke.py
      - scripts/task3_patch_verifier_budget.py
      - supabase/functions/generate-reply/**
      - supabase/functions/receive-widget-message/**
      - supabase/functions/widget-poll-messages/**
      - supabase/functions/agent-assist/**
      - supabase/functions/conversation-evaluate/**
      - supabase/functions/ce-evaluation-worker/**
      - supabase/functions/customer360-adapter/**
      - supabase/functions/_shared/**
      - tests/edge/round2-task1-conversation-semantic-contract.test.ts
      - tests/edge/round2-task2-grounding-transform-boundary.test.ts
      - tests/edge/task2-2-output-grounding-router.test.ts
      - tests/edge/task2-3-citation-lineage.test.ts
      - tests/edge/task3-grounding-verifier-budget.test.ts
  workflow_dispatch:
    inputs:
      production_runtime_authorized:
        description: Explicit production-owner authorization to deploy and run the write-capable production smoke
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  task3-final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      PROD_ORIGIN: https://console-chat-hub.lovable.app
      CHANNEL_ID: b0000000-0000-0000-0000-000000000001
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/round2-task3-conversation-runtime-final-gate
          fetch-depth: 0

      - name: Apply and freeze production verifier-budget repair
        run: |
          set -euo pipefail
          python scripts/task3_patch_verifier_budget.py
          if ! git diff --quiet -- supabase/functions/_shared/llm-router.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add supabase/functions/_shared/llm-router.ts
            git commit -m '[authorized-prod] Fix grounding verifier output budget [skip ci]'
            git push origin HEAD:director/round2-task3-conversation-runtime-final-gate
          fi
          grep -q 'export const GROUNDING_VERIFIER_MAX_TOKENS = 2048;' supabase/functions/_shared/llm-router.ts
          test "$(grep -c 'GROUNDING_VERIFIER_MAX_TOKENS' supabase/functions/_shared/llm-router.ts)" -eq 4
          echo TASK3_VERIFIER_BUDGET_SOURCE=PASS

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Compile production runtime call chain
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/_shared/conversation-semantic-contract.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/prior-grounded-transform.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/llm-router.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          deno check --node-modules-dir=auto supabase/functions/receive-widget-message/index.ts
          deno check --node-modules-dir=auto supabase/functions/widget-poll-messages/index.ts
          deno check --node-modules-dir=auto supabase/functions/agent-assist/index.ts
          deno check --node-modules-dir=auto supabase/functions/conversation-evaluate/index.ts
          deno check --node-modules-dir=auto supabase/functions/ce-evaluation-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/customer360-adapter/index.ts
          echo TASK3_RUNTIME_COMPILE=PASS

      - name: Run frozen Task 1 and Task 2 regressions plus verifier-budget regression
        run: |
          set -euo pipefail
          deno test --allow-env --node-modules-dir=auto tests/edge/round2-task1-conversation-semantic-contract.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/round2-task2-grounding-transform-boundary.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-2-output-grounding-router.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-3-citation-lineage.test.ts
          deno test --allow-env --allow-read --node-modules-dir=auto tests/edge/task3-grounding-verifier-budget.test.ts
          echo TASK3_FROZEN_REGRESSION=PASS

      - name: Validate production smoke contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/integrated_final_production_smoke.py
          python - <<'PY'
          from pathlib import Path
          s = Path('scripts/integrated_final_production_smoke.py').read_text()
          for i in range(1, 21):
              assert f"('A{i}'" in s, f'missing stateful turn A{i}'
          assert "send(cid,tok,'幫我轉真人客服。',False,35)" in s
          assert "A21:R1" in s
          assert "A22:AI_AFTER_HANDOFF" in s
          for token in [
              'TWENTY_TURN_STATEFUL_CONVERSATION',
              'STANDALONE_KNOWN_KB_HIT',
              'FOLLOW_UP_SEMANTIC_RETRIEVAL',
              'PRONOUN_RESOLUTION',
              'CORRECTION_SUPERSESSION',
              'TOPIC_SWITCH_ISOLATION',
              'MULTILINGUAL_CONTINUITY',
              'PUBLISHED_ONLY_EVIDENCE',
              'FULL_CONTENT_FACTUAL_GROUNDING',
              'FIRST_NO_MATCH_CLARIFICATION',
              'EXPLICIT_R1',
              'ANGER_VIP_ADVISORY_ONLY',
              'HUMAN_CONTROL_AI_SUPPRESSION',
          ]:
              assert token in s, token
          assert 'create-visitor-session' in s
          assert 'receive-widget-message' in s
          print('TASK3_SMOKE_CONTRACT=PASS')
          PY

      - name: Machine assertions for frozen runtime boundaries
        run: |
          set -euo pipefail
          grep -q 'PRIOR_GROUNDED_ANSWER' supabase/functions/_shared/prior-grounded-transform.ts
          grep -q 'const _g1SkipKB = _pr5GreetingOrTrivial || Boolean(_priorGroundedTransform)' supabase/functions/generate-reply/index.ts
          grep -q 'buildInheritedTransformCitationMetadata(_priorGroundedTransform)' supabase/functions/generate-reply/index.ts
          grep -q 'commit_ai_reply_tx' supabase/functions/generate-reply/index.ts
          grep -q 'resolveTenantScope' supabase/functions/generate-reply/index.ts
          grep -q 'requirePublished: true' supabase/functions/generate-reply/index.ts
          grep -q 'full_content' supabase/functions/_shared/citation-lineage.ts
          grep -q 'export const GROUNDING_VERIFIER_MAX_TOKENS = 2048;' supabase/functions/_shared/llm-router.ts
          test "$(grep -c 'GROUNDING_VERIFIER_MAX_TOKENS' supabase/functions/_shared/llm-router.ts)" -eq 4
          grep -q '^verify_jwt = true$' <(awk '/\[functions.generate-reply\]/{f=1;next} /^\[/{f=0} f' supabase/config.toml)
          echo TASK3_MACHINE_ASSERTIONS=PASS

      - name: Full authoritative repository build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo TASK3_FULL_BUILD=PASS

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enforce one-shot production authorization and credential
        env:
          DISPATCH_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.production_runtime_authorized || 'false' }}
        run: |
          set -euo pipefail
          PUSH_AUTHORIZED=false
          if git log -2 --pretty=%B | grep -Fq '[authorized-prod]'; then PUSH_AUTHORIZED=true; fi
          if [[ "$DISPATCH_AUTHORIZED" != "true" && "$PUSH_AUTHORIZED" != "true" ]]; then
            echo 'TASK3_PRODUCTION_AUTHORIZATION=FAIL'
            exit 31
          fi
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'TASK3_DEPLOY_CREDENTIAL=NOT_CONFIGURED'
            exit 32
          fi
          echo 'TASK3_PRODUCTION_AUTHORIZATION=PASS'
          echo 'TASK3_DEPLOY_CREDENTIAL=CONFIGURED'

      - name: Capture exact live rollback source
        run: |
          set -euo pipefail
          rm -rf /tmp/task3-live-backup
          mkdir -p /tmp/task3-live-backup/supabase
          cp supabase/config.toml /tmp/task3-live-backup/supabase/config.toml
          cd /tmp/task3-live-backup
          supabase functions download generate-reply --project-ref "$PROJECT_REF" --use-api
          test -s supabase/functions/generate-reply/index.ts
          find supabase/functions -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/task3-live-backup.sha256
          echo TASK3_ROLLBACK_SOURCE_CAPTURE=PASS

      - name: Deploy validated generate-reply runtime
        run: |
          set -euo pipefail
          supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/task3-function-list.txt
          grep -q 'generate-reply' /tmp/task3-function-list.txt
          echo TASK3_PRODUCTION_DEPLOY=PASS

      - name: Run authorized 20-turn production smoke with automatic rollback
        run: |
          set -uo pipefail
          set -a
          source .env
          set +a
          set +e
          python scripts/integrated_final_production_smoke.py | tee /tmp/task3-production-smoke.log
          smoke_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$smoke_rc" -ne 0 ]]; then
            echo "TASK3_PRODUCTION_SMOKE=FAIL rc=$smoke_rc"
            echo 'TASK3_ROLLBACK=START'
            cd /tmp/task3-live-backup
            supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api
            supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/task3-rollback-function-list.txt
            grep -q 'generate-reply' /tmp/task3-rollback-function-list.txt
            echo 'TASK3_ROLLBACK=PASS'
            exit "$smoke_rc"
          fi
          grep -q 'FINAL_FAILURES=\[\]' /tmp/task3-production-smoke.log
          grep -q 'TWENTY_TURN_STATEFUL_CONVERSATION=PASS' /tmp/task3-production-smoke.log
          grep -q 'LONG_CONTEXT_CONTINUITY=PASS' /tmp/task3-production-smoke.log
          grep -q 'GROUNDING_OUTPUT_GATE=PASS' /tmp/task3-production-smoke.log
          grep -q 'CITATION_LINEAGE=PASS' /tmp/task3-production-smoke.log
          grep -q 'EXPLICIT_R1=PASS' /tmp/task3-production-smoke.log
          grep -q 'HUMAN_CONTROL_AI_SUPPRESSION=PASS' /tmp/task3-production-smoke.log
          echo 'TASK3_PRODUCTION_SMOKE=PASS'
          echo 'TASK3_FINAL_STATUS=READY'
