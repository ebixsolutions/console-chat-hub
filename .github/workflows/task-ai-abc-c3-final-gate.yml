name: AI ABC C3 Final Gate

on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID holding the verified v108/v43 recovery artifact
        required: true
        type: string
      recovery_authorization:
        description: Exact c3-recovery-<selected commit SHA> authorization
        required: true
        type: string
      recover_generate_reply:
        description: Recover generate-reply from the durable snapshot
        required: true
        default: false
        type: boolean
      recover_agent_assist:
        description: Recover agent-assist from the durable snapshot
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  C3_PROJECT_REF: nrfxhqabwblzxoushgnm
  C3_CAPTURE_NAME: C3-current-live-v108-v43-recovery-baseline
  C3_CAPTURE_RETENTION_DAYS: '30'
  C3_CLI_EPHEMERAL: supabase/.temp/cli-latest
  C3_ASSERT_LIB: |
    c3_assert(){ local n="$1" e="$2" a="$3"; if [ "$e" = "$a" ]; then echo "C3_SOURCE_ASSERT|name=$n|expected=$e|actual=$a|result=PASS"; else echo "C3_SOURCE_ASSERT|name=$n|expected=$e|actual=$a|result=FAIL"; return 1; fi; }
    c3_source_clean(){
      local phase="$1" expected_cli="$2" tracked staged approved unauthorized failed=0 offenders
      tracked="$(git diff --name-only | awk 'NF{n++} END{print n+0}')"
      staged="$(git diff --cached --name-only | awk 'NF{n++} END{print n+0}')"
      approved="$(git ls-files --others --exclude-standard | awk -v p="$C3_CLI_EPHEMERAL" '$0==p{n++} END{print n+0}')"
      offenders="$(git ls-files --others --exclude-standard | awk -v p="$C3_CLI_EPHEMERAL" 'NF && $0!=p{print}')"
      unauthorized="$(printf '%s\n' "$offenders" | awk 'NF{n++} END{print n+0}')"
      echo "C3_SOURCE_STATUS|phase=$phase"
      git status --porcelain || true
      printf '%s\n' "$offenders" | awk 'NF{print "C3_SOURCE_OFFENDER|kind=unauthorized_untracked|path=" $0}'
      c3_assert "${phase}_tracked_modified" 0 "$tracked" || failed=1
      c3_assert "${phase}_staged" 0 "$staged" || failed=1
      c3_assert "${phase}_exact_cli_ephemeral" "$expected_cli" "$approved" || failed=1
      c3_assert "${phase}_unauthorized_untracked" 0 "$unauthorized" || failed=1
      if git ls-files --error-unmatch "$C3_CLI_EPHEMERAL" >/dev/null 2>&1; then echo "C3_SOURCE_ASSERT|name=${phase}_cli_ephemeral_untracked|expected=untracked|actual=tracked|result=FAIL"; failed=1; else echo "C3_SOURCE_ASSERT|name=${phase}_cli_ephemeral_untracked|expected=untracked|actual=untracked|result=PASS"; fi
      return "$failed"
    }
    c3_cli_delta(){
      local before="$1" after="$2" delta
      delta="$(comm -13 "$before" "$after" | awk 'NF')"
      if [ "$delta" = "$C3_CLI_EPHEMERAL" ]; then echo "C3_SOURCE_ASSERT|name=cli_setup_created_exact_path|expected=$C3_CLI_EPHEMERAL|actual=$delta|result=PASS"; else printf '%s\n' "$delta" | awk 'NF{print "C3_SOURCE_OFFENDER|kind=cli_setup_delta|path=" $0}'; echo "C3_SOURCE_ASSERT|name=cli_setup_created_exact_path|expected=$C3_CLI_EPHEMERAL|actual=${delta:-NONE}|result=FAIL"; return 1; fi
    }

jobs:
  c3-current-live-capture:
    if: >-
      (github.event_name == 'push' && github.repository == 'ebixsolutions/console-chat-hub') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.pull_request.number == 12 && github.actor == 'ebixsolutions' &&
       github.event.label.name == format('c3-prod-{0}', github.event.pull_request.head.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      C3_EVENT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Guard recovery-only capture authority
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = ebixsolutions/console-chat-hub
          test "$C3_EVENT_BRANCH" = director/ai-abc-c3-long-memory-final-cutover
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$C3_PROJECT_REF" = nrfxhqabwblzxoushgnm
          echo C3_RECOVERY_ONLY_CAPTURE_AUTHORITY=PASS
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - name: Download exact current live v108 and v43 closures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/c3-current-live"; rm -rf "$ROOT"
          mkdir -p "$ROOT/_meta" "$ROOT/generate-reply/supabase" "$ROOT/agent-assist/supabase"
          (cd "$ROOT" && supabase functions list --project-ref "$C3_PROJECT_REF" --output json > _meta/live-functions-before.json)
          for fn in generate-reply agent-assist; do
            printf 'project_id = "%s"\n\n[functions.%s]\nverify_jwt = true\nentrypoint = "./functions/%s/index.ts"\n' "$C3_PROJECT_REF" "$fn" "$fn" > "$ROOT/$fn/supabase/config.toml"
            (cd "$ROOT/$fn" && supabase functions download "$fn" --project-ref "$C3_PROJECT_REF" --use-api)
          done
          (cd "$ROOT" && supabase functions list --project-ref "$C3_PROJECT_REF" --output json > _meta/live-functions-after.json)
          CAPTURED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" python - "$ROOT" <<'PY'
          import hashlib,json,os,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]); before=json.loads((root/'_meta/live-functions-before.json').read_text()); after=json.loads((root/'_meta/live-functions-after.json').read_text())
          rows=before.get('functions',before) if isinstance(before,dict) else before
          after_rows=after.get('functions',after) if isinstance(after,dict) else after
          expected={'generate-reply':(108,'f5c85c002c99ca7f094d1e1c9b1cb7349e44e73a159a8970b78a6b2a2bf7e397'),'agent-assist':(43,'eeadc5c9dfb35c51e8778756fcae96ff0c0fc68fc68599ade565ef7479e4e4cb')}
          index={'classification':'INTERIM LIVE RECOVERY BASELINE — NOT PRODUCT-READY','project':'nrfxhqabwblzxoushgnm','captured_at':os.environ['CAPTURED_AT'],'functions':[],'frozen_functions':[]}
          frozen={'receive-widget-message':(23,False,'3674faf3499a319269c8d9fda63bd1e7ee6ca770219b2f701854f33863d1af08'),'ce-evaluation-worker':(25,False,'626ade7e2dcd45d56314e986e1394ab70ca41e4e52f416e01324885011a682f2'),'conversation-evaluate':(20,True,'2176d2412fe921c0d3ab47abc04daa324d2101f54548ce9c29f8de95e2b7496d')}
          rx=re.compile(r'(?:from\s*|import\s*\()\s*["\x27]([^"\x27]+)["\x27]|^\s*import\s*["\x27]([^"\x27]+)["\x27]',re.M)
          for fn,(version,bundle) in expected.items():
            meta=next((x for x in rows if x.get('slug')==fn or x.get('name')==fn),None)
            post=next((x for x in after_rows if x.get('slug')==fn or x.get('name')==fn),None)
            if not meta: raise SystemExit(f'missing_live_metadata:{fn}')
            checks={'status':meta.get('status')=='ACTIVE','version':int(meta.get('version',-1))==version,'bundle':str(meta.get('ezbr_sha256',''))==bundle,'verify_jwt':meta.get('verify_jwt') is True,'import_map':meta.get('import_map') is False}
            checks['stable_during_download']=bool(post and all(post.get(k)==meta.get(k) for k in ('status','version','ezbr_sha256','verify_jwt','import_map')))
            for name,ok in checks.items(): print(f'C3_LIVE_ASSERT|function={fn}|name={name}|result={"PASS" if ok else "FAIL"}')
            if not all(checks.values()): raise SystemExit(f'live_identity_drift:{fn}:{meta}')
            base=root/fn; source=base/'supabase/functions'; files=[]; imports=[]; empty=[]
            for path in sorted((x for x in source.rglob('*') if x.is_file()),key=lambda x:x.relative_to(source).as_posix().encode()):
              data=path.read_bytes(); rel=path.relative_to(source).as_posix(); files.append({'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
              if not data: empty.append(rel)
              if path.suffix in {'.ts','.tsx','.js','.mjs'}:
                for m in rx.finditer(data.decode()):
                  spec=m.group(1) or m.group(2); imports.append({'from':rel,'specifier':spec,'kind':'relative' if spec.startswith('.') else 'external'})
            entry=f'{fn}/index.ts'
            if not files or empty or not (source/entry).is_file(): raise SystemExit(f'invalid_live_closure:{fn}:files={len(files)}:empty={empty}')
            manifest={'project':'nrfxhqabwblzxoushgnm','function':fn,'version':version,'capture_time':os.environ['CAPTURED_AT'],'entrypoint':entry,'file_count':len(files),'verify_jwt':True,'import_map':False,'observed_bundle_sha256':bundle,'files':files,'dependencies':imports}
            cfg={'entrypoint':entry,'import_map':False,'observed_bundle_sha256':bundle,'status':'ACTIVE','verify_jwt':True,'version':version}
            (base/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
            (base/'CONFIGURATION.json').write_text(json.dumps(cfg,indent=2,sort_keys=True)+'\n')
            index['functions'].append({'function':fn,'version':version,'bundle':bundle,'file_count':len(files)})
          for fn,(version,verify_jwt,bundle) in frozen.items():
            meta=next((x for x in rows if x.get('slug')==fn or x.get('name')==fn),None)
            ok=bool(meta and meta.get('status')=='ACTIVE' and int(meta.get('version',-1))==version and meta.get('verify_jwt') is verify_jwt and meta.get('import_map') is False and str(meta.get('ezbr_sha256',''))==bundle)
            print(f'C3_FROZEN_CAPTURE_ASSERT|function={fn}|result={"PASS" if ok else "FAIL"}')
            if not ok: raise SystemExit(f'frozen_identity_drift:{fn}:{meta}')
            index['frozen_functions'].append({'function':fn,'version':version,'verify_jwt':verify_jwt,'import_map':False,'bundle':bundle,'status':'ACTIVE'})
          (root/'CAPTURE.json').write_text(json.dumps(index,indent=2,sort_keys=True)+'\n')
          (root/'_meta/live-functions-before.json').unlink(); (root/'_meta/live-functions-after.json').unlink(); (root/'_meta').rmdir()
          print('CURRENT_LIVE_V108_V43_CAPTURE_PREUPLOAD=PASS')
          PY
          ! grep -RIlE '(SUPABASE_ACCESS_TOKEN|service_role)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_.-]{20,}' "$ROOT"
      - name: Upload protected recovery artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.C3_CAPTURE_NAME }}
          path: ${{ runner.temp }}/c3-current-live
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: false
      - name: Report durable artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.upload.outputs.artifact-id }}'
          test -n '${{ steps.upload.outputs.artifact-digest }}'
          echo "C3_DURABLE_ARTIFACT|id=${{ steps.upload.outputs.artifact-id }}|digest=${{ steps.upload.outputs.artifact-digest }}|retention_days=$C3_CAPTURE_RETENTION_DAYS"

  c3-current-live-roundtrip:
    needs: c3-current-live-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - name: Download durable snapshot on another clean runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.C3_CAPTURE_NAME }}
          path: ${{ runner.temp }}/c3-restored-clean
      - name: Verify remote bytes, manifests and configuration
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/c3-restored-clean" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); cap=json.loads((root/'CAPTURE.json').read_text())
          assert cap['classification']=='INTERIM LIVE RECOVERY BASELINE — NOT PRODUCT-READY' and cap['project']=='nrfxhqabwblzxoushgnm'
          expected={'generate-reply':(108,'f5c85c002c99ca7f094d1e1c9b1cb7349e44e73a159a8970b78a6b2a2bf7e397'),'agent-assist':(43,'eeadc5c9dfb35c51e8778756fcae96ff0c0fc68fc68599ade565ef7479e4e4cb')}
          failed=False
          for fn,(version,bundle) in expected.items():
            base=root/fn; manifest=json.loads((base/'MANIFEST.json').read_text()); cfg=json.loads((base/'CONFIGURATION.json').read_text()); source=base/'supabase/functions'
            exp={x['path']:x['sha256'] for x in manifest['files']}; actual={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob('*') if p.is_file()}
            missing=sorted(set(exp)-set(actual)); unexpected=sorted(set(actual)-set(exp)); mismatch=sorted(p for p in set(exp)&set(actual) if exp[p]!=actual[p])
            cfg_ok=cfg=={'entrypoint':f'{fn}/index.ts','import_map':False,'observed_bundle_sha256':bundle,'status':'ACTIVE','verify_jwt':True,'version':version}
            checks=[('expected_files',len(exp),len(actual),len(exp)==len(actual)),('missing',0,len(missing),not missing),('unexpected',0,len(unexpected),not unexpected),('byte_hash_mismatch',0,len(mismatch),not mismatch),('configuration_mismatch',0,0 if cfg_ok else 1,cfg_ok)]
            for name,e,a,ok in checks: print(f'C3_ROUNDTRIP_ASSERT|function={fn}|name={name}|expected={e}|actual={a}|result={"PASS" if ok else "FAIL"}'); failed=failed or not ok
            for kind,items in [('missing',missing),('unexpected',unexpected),('mismatch',mismatch)]:
              for item in items: print(f'C3_ROUNDTRIP_OFFENDER|function={fn}|kind={kind}|path={item}')
          if failed: raise SystemExit(1)
          print('CURRENT_LIVE_V108_V43_DURABLE_CAPTURE=PASS')
          PY
          echo 'verified=PASS' >> "$GITHUB_OUTPUT"

  c3-preproduction:
    needs: c3-current-live-roundtrip
    if: github.event_name == 'push' && github.repository == 'ebixsolutions/console-chat-hub'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      C3_GATE_PHASE: preproduction
      C3_LIVE_BASELINE_READBACK: PASS
      C3_SCHEMA_READ_ONLY_TRACE: PASS
      C3_MIGRATION_HISTORY_COMPATIBILITY: PASS
      C3_MIGRATION_RUNTIME_REHEARSAL: PASS
      C3_RECOVERY_INTERIM_BASELINE: PASS
      C3_CURRENT_LIVE_DURABLE_CAPTURE: PASS
      C3_CURRENT_LIVE_SOURCE_PARITY: PASS
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, clean: true}
      - name: Record pristine source before CLI
        shell: bash
        run: |
          set -euo pipefail; eval "$C3_ASSERT_LIB"
          git ls-files --others --exclude-standard | LC_ALL=C sort > "$RUNNER_TEMP/before-cli"
          c3_source_clean before_cli_setup 0
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.9.6}
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - name: Verify exact CLI ephemeral isolation
        shell: bash
        run: |
          set -euo pipefail; eval "$C3_ASSERT_LIB"
          git ls-files --others --exclude-standard | LC_ALL=C sort > "$RUNNER_TEMP/after-cli"
          c3_cli_delta "$RUNNER_TEMP/before-cli" "$RUNNER_TEMP/after-cli"
          c3_source_clean after_cli_setup 1
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Download verified live snapshot outside checkout
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.C3_CAPTURE_NAME }}
          path: ${{ runner.temp }}/c3-live-parity
      - name: Verify current live source closure equals repository runtime
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/c3-live-parity" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); repo=pathlib.Path('supabase/functions')
          failed=False
          for fn in ('generate-reply','agent-assist'):
            manifest=json.loads((root/fn/'MANIFEST.json').read_text())
            for row in manifest['files']:
              path=repo/row['path']; actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else 'MISSING'
              ok=actual==row['sha256']
              print(f'C3_LIVE_REPO_PARITY|function={fn}|path={row["path"]}|result={"PASS" if ok else "FAIL"}')
              failed=failed or not ok
          if failed: raise SystemExit(1)
          print('C3_CURRENT_LIVE_SOURCE_PARITY=PASS')
          PY
      - name: Non-production A-H recovery control-flow regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          cases={'A':({'preflight':'fail'},[]),'B':({'g':'affected'},['generate-reply']),'C':({'g':'affected','a':'affected','final':'fail'},['generate-reply','agent-assist']),'D':({'g':'affected','rollback':'fail'},['generate-reply']),'E':({'g':'candidate','a':'candidate','final':'pass'},[]),'F':({'g':'unknown'},['READBACK:generate-reply']),'G':({'artifact':'fail'},['BLOCK_FORWARD_WRITE']),'H':({'runner':'replacement','artifact':'verified'},['RESTORE_AVAILABLE'])}
          for name,(state,expected) in cases.items():
            if state.get('artifact')=='fail': plan=['BLOCK_FORWARD_WRITE']
            elif state.get('runner')=='replacement': plan=['RESTORE_AVAILABLE'] if state.get('artifact')=='verified' else []
            elif state.get('preflight')=='fail': plan=[]
            elif state.get('g')=='unknown': plan=['READBACK:generate-reply']
            elif state.get('final')=='pass': plan=[]
            else: plan=[fn for key,fn in [('g','generate-reply'),('a','agent-assist')] if state.get(key)=='affected']
            ok=plan==expected; print(f'C3_CONTROL_FLOW_CASE|case={name}|expected={expected}|actual={plan}|result={"PASS" if ok else "FAIL"}')
            if not ok: raise SystemExit(1)
            if name=='D': print('C3_RECOVERY_FAILURE|function=generate-reply|result=FAIL|independent_from_original=true')
          print('C3_NONPRODUCTION_CONTROL_FLOW_A_H=PASS')
          PY
          grep -q 'workflow_dispatch:' .github/workflows/task-ai-abc-c3-final-gate.yml
          grep -q 'run-id:.*inputs.artifact_run_id' .github/workflows/task-ai-abc-c3-final-gate.yml
          echo C3_REPLACEMENT_RUNNER_RECOVERY_PATH_H=PASS
      - name: Offender-before-fail telemetry regression
        shell: bash
        run: |
          set -euo pipefail; eval "$C3_ASSERT_LIB"; P="$RUNNER_TEMP/telemetry"; mkdir -p "$P"; touch c3-intentional-offender
          set +e; c3_source_clean telemetry_test 1 > "$P/log" 2>&1; rc=$?; set -e; rm c3-intentional-offender
          test "$rc" -ne 0
          offender="$(grep -n 'C3_SOURCE_OFFENDER|kind=unauthorized_untracked|path=c3-intentional-offender' "$P/log"|cut -d: -f1)"
          assertion="$(grep -n 'name=telemetry_test_unauthorized_untracked.*result=FAIL' "$P/log"|cut -d: -f1)"
          test -n "$offender"; test -n "$assertion"; test "$offender" -lt "$assertion"
          echo C3_OFFENDER_BEFORE_FAIL_TELEMETRY=PASS
      - name: Deno, C3 tests, build and source cleanliness
        shell: bash
        run: |
          set -euo pipefail; eval "$C3_ASSERT_LIB"; c3_source_clean before_deno 1
          deno check --no-lock supabase/functions/generate-reply/index.ts
          deno check --no-lock supabase/functions/agent-assist/index.ts
          deno test --no-lock --allow-read supabase/functions/_shared/conversation-long-memory.test.ts supabase/functions/_shared/conversation-long-memory.integration.test.ts supabase/functions/_shared/generation-terminal-guard.test.ts
          c3_source_clean after_deno 1
          git worktree add --detach "$RUNNER_TEMP/c3-build-checkout" "$GITHUB_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/c3-build-checkout/node_modules"
          (cd "$RUNNER_TEMP/c3-build-checkout" && npm run build)
          c3_source_clean after_build 1
          echo C3_NONPRODUCTION_REGRESSION=PASS
      - name: Run pristine C3 source final gate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/c3-final-gate-checkout" "$GITHUB_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/c3-final-gate-checkout/node_modules"
          (cd "$RUNNER_TEMP/c3-final-gate-checkout" && node .github/scripts/task_ai_abc_c3_final_gate.mjs)
          echo C3_PRISTINE_SOURCE_FINAL_GATE=PASS

  c3-durable-recovery-execution:
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == 'ebixsolutions' &&
      inputs.recovery_authorization == format('c3-recovery-{0}', github.sha) &&
      (inputs.recover_generate_reply || inputs.recover_agent_assist)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, clean: true}
      - name: Verify explicit recovery authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.recovery_authorization }}" = "c3-recovery-${{ github.sha }}"
          test "${{ github.ref_name }}" = director/ai-abc-c3-long-memory-final-cutover
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo C3_EXPLICIT_RECOVERY_AUTHORIZATION=PASS
      - name: Download prior-run durable snapshot on replacement runner
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.C3_CAPTURE_NAME }}
          path: ${{ runner.temp }}/replacement-recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify durable snapshot before recovery write
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/replacement-recovery" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); cap=json.loads((root/'CAPTURE.json').read_text())
          assert cap['classification']=='INTERIM LIVE RECOVERY BASELINE — NOT PRODUCT-READY'
          expected={'generate-reply':(108,'f5c85c002c99ca7f094d1e1c9b1cb7349e44e73a159a8970b78a6b2a2bf7e397'),'agent-assist':(43,'eeadc5c9dfb35c51e8778756fcae96ff0c0fc68fc68599ade565ef7479e4e4cb')}
          for fn,(version,bundle) in expected.items():
            manifest=json.loads((root/fn/'MANIFEST.json').read_text()); cfg=json.loads((root/fn/'CONFIGURATION.json').read_text()); source=root/fn/'supabase/functions'
            exp={x['path']:x['sha256'] for x in manifest['files']}; act={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob('*') if p.is_file()}
            assert exp==act and cfg['version']==version and cfg['observed_bundle_sha256']==bundle and cfg['verify_jwt'] is True and cfg['import_map'] is False
          print('C3_REPLACEMENT_RUNNER_DURABLE_ARTIFACT_VERIFIED=PASS')
          PY
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - name: Execute explicitly authorized recovery and independent verification
        shell: bash
        run: |
          set -uo pipefail; failed=0; R="$RUNNER_TEMP/replacement-recovery"
          recover(){
            local fn="$1" d="$RUNNER_TEMP/replacement-readback-$1"; rm -rf "$d"; mkdir -p "$d/supabase"; cp "$GITHUB_WORKSPACE/supabase/config.toml" "$d/supabase/config.toml"
            if ! (cd "$R/$fn" && supabase functions deploy "$fn" --project-ref "$C3_PROJECT_REF" --use-api); then echo "C3_RECOVERY_RESULT|function=$fn|result=FAIL|stage=deploy"; return 1; fi
            if ! (cd "$d" && supabase functions download "$fn" --project-ref "$C3_PROJECT_REF" --use-api); then echo "C3_RECOVERY_RESULT|function=$fn|result=FAIL|stage=readback"; return 1; fi
            if python - "$R/$fn/MANIFEST.json" "$d/supabase/functions" <<'PY'
          import hashlib,json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text()); root=pathlib.Path(sys.argv[2])
          exp={x['path']:x['sha256'] for x in m['files']}; act={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if exp!=act: raise SystemExit(1)
          PY
            then echo "C3_RECOVERY_RESULT|function=$fn|result=PASS"; else echo "C3_RECOVERY_RESULT|function=$fn|result=FAIL|stage=identity"; return 1; fi
          }
          if [ "${{ inputs.recover_generate_reply }}" = true ]; then recover generate-reply || failed=1; fi
          if [ "${{ inputs.recover_agent_assist }}" = true ]; then recover agent-assist || failed=1; fi
          exit "$failed"

  c3-production-edge-transport:
    needs: c3-current-live-roundtrip
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.pull_request.number == 12 && github.actor == 'ebixsolutions' &&
      github.event.label.name == format('c3-prod-{0}', github.event.pull_request.head.sha) &&
      needs.c3-current-live-roundtrip.outputs.verified == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, clean: true}
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - name: Re-download durable baseline before first forward write
        uses: actions/download-artifact@v4
        with: {name: '${{ env.C3_CAPTURE_NAME }}', path: '${{ runner.temp }}/baseline'}
      - name: Baseline gate
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -s "$RUNNER_TEMP/baseline/CAPTURE.json"
          test -s "$RUNNER_TEMP/baseline/generate-reply/MANIFEST.json"
          test -s "$RUNNER_TEMP/baseline/agent-assist/MANIFEST.json"
          python - "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/forward" <<'PY'
          import hashlib,json,pathlib,shutil,sys
          baseline=pathlib.Path(sys.argv[1]); forward=pathlib.Path(sys.argv[2]); repo=pathlib.Path('supabase/functions')
          for fn in ('generate-reply','agent-assist'):
            manifest=json.loads((baseline/fn/'MANIFEST.json').read_text()); source=baseline/fn/'supabase/functions'
            exp={x['path']:x['sha256'] for x in manifest['files']}; act={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob('*') if p.is_file()}
            if exp!=act: raise SystemExit(f'durable_baseline_hash_mismatch:{fn}')
            work=forward/fn; (work/'supabase/functions').mkdir(parents=True); shutil.copy2('supabase/config.toml',work/'supabase/config.toml')
            for rel in exp:
              src=repo/rel; dst=work/'supabase/functions'/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          PY
          echo ready=PASS >> "$GITHUB_OUTPUT"
          echo C3_DURABLE_BASELINE_BEFORE_FIRST_FORWARD_WRITE=PASS
      - name: Deploy generate-reply
        id: deploy_generate
        if: steps.baseline.outputs.ready == 'PASS'
        continue-on-error: true
        shell: bash
        run: |
          echo attempted=true >> "$GITHUB_OUTPUT"
          if (cd "$RUNNER_TEMP/forward/generate-reply" && supabase functions deploy generate-reply --project-ref "$C3_PROJECT_REF" --use-api); then echo command_result=success >> "$GITHUB_OUTPUT"; else echo command_result=unknown >> "$GITHUB_OUTPUT"; exit 1; fi
      - name: Mandatory readback after generate attempt
        id: readback_generate
        if: always() && steps.deploy_generate.outputs.attempted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; D="$RUNNER_TEMP/post-generate"; mkdir -p "$D/supabase"; cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download generate-reply --project-ref "$C3_PROJECT_REF" --use-api)
          python - "$RUNNER_TEMP/baseline/generate-reply/MANIFEST.json" "$D/supabase/functions" > "$RUNNER_TEMP/generate-identity" <<'PY'
          import hashlib,json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text()); root=pathlib.Path(sys.argv[2])
          exp={x['path']:x['sha256'] for x in m['files']}; act={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          print('baseline' if exp==act else 'affected')
          PY
          echo completed=true >> "$GITHUB_OUTPUT"; echo "identity=$(cat "$RUNNER_TEMP/generate-identity")" >> "$GITHUB_OUTPUT"
      - name: Deploy agent-assist after known generate readback
        id: deploy_assist
        if: steps.deploy_generate.outputs.command_result == 'success' && steps.readback_generate.outputs.completed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo attempted=true >> "$GITHUB_OUTPUT"
          if (cd "$RUNNER_TEMP/forward/agent-assist" && supabase functions deploy agent-assist --project-ref "$C3_PROJECT_REF" --use-api); then echo command_result=success >> "$GITHUB_OUTPUT"; else echo command_result=unknown >> "$GITHUB_OUTPUT"; exit 1; fi
      - name: Mandatory readback after assist attempt
        id: readback_assist
        if: always() && steps.deploy_assist.outputs.attempted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; D="$RUNNER_TEMP/post-assist"; mkdir -p "$D/supabase"; cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download agent-assist --project-ref "$C3_PROJECT_REF" --use-api)
          python - "$RUNNER_TEMP/baseline/agent-assist/MANIFEST.json" "$D/supabase/functions" > "$RUNNER_TEMP/assist-identity" <<'PY'
          import hashlib,json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text()); root=pathlib.Path(sys.argv[2])
          exp={x['path']:x['sha256'] for x in m['files']}; act={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          print('baseline' if exp==act else 'affected')
          PY
          echo completed=true >> "$GITHUB_OUTPUT"; echo "identity=$(cat "$RUNNER_TEMP/assist-identity")" >> "$GITHUB_OUTPUT"
      - name: Post-deployment P0 final transport gate
        id: final_gate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; eval "$C3_ASSERT_LIB"
          test "${{ steps.deploy_generate.outputs.command_result }}" = success
          test "${{ steps.readback_generate.outputs.completed }}" = true
          test "${{ steps.deploy_assist.outputs.command_result }}" = success
          test "${{ steps.readback_assist.outputs.completed }}" = true
          (cd "$RUNNER_TEMP" && supabase functions list --project-ref "$C3_PROJECT_REF" --output json > post-functions.json)
          python - "$RUNNER_TEMP/baseline/CAPTURE.json" "$RUNNER_TEMP/post-functions.json" <<'PY'
          import json,sys
          cap=json.load(open(sys.argv[1])); raw=json.load(open(sys.argv[2])); rows=raw.get('functions',raw) if isinstance(raw,dict) else raw
          for exp in cap['frozen_functions']:
            got=next((x for x in rows if x.get('slug')==exp['function'] or x.get('name')==exp['function']),None)
            ok=bool(got and got.get('status')==exp['status'] and int(got.get('version',-1))==exp['version'] and got.get('verify_jwt') is exp['verify_jwt'] and got.get('import_map') is exp['import_map'] and str(got.get('ezbr_sha256',''))==exp['bundle'])
            print(f'C3_FROZEN_READBACK_ASSERT|function={exp["function"]}|result={"PASS" if ok else "FAIL"}')
            if not ok: raise SystemExit(1)
          PY
          c3_source_clean production_final 1
          echo C3_POST_DEPLOYMENT_P0_FINAL_GATE=PASS
      - name: Failure-safe recovery after all post-deployment P0 gates
        id: recovery
        if: >-
          always() &&
          (steps.deploy_generate.outcome == 'failure' || steps.readback_generate.outcome == 'failure' ||
           steps.deploy_assist.outcome == 'failure' || steps.readback_assist.outcome == 'failure' ||
           steps.final_gate.outcome == 'failure')
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail; failed=0; R="$RUNNER_TEMP/baseline"
          verify_restored(){
            local fn="$1" d="$RUNNER_TEMP/recovered-$1"; rm -rf "$d"; mkdir -p "$d/supabase"; cp supabase/config.toml "$d/supabase/config.toml"
            (cd "$d" && supabase functions download "$fn" --project-ref "$C3_PROJECT_REF" --use-api) || return 1
            python - "$R/$fn/MANIFEST.json" "$d/supabase/functions" <<'PY'
          import hashlib,json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text()); root=pathlib.Path(sys.argv[2])
          exp={x['path']:x['sha256'] for x in m['files']}; act={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          if exp!=act: raise SystemExit(1)
          PY
          }
          if [ "${{ steps.deploy_generate.outputs.attempted }}" = true ] && [ "${{ steps.readback_generate.outputs.identity }}" != baseline ]; then
            if (cd "$R/generate-reply" && supabase functions deploy generate-reply --project-ref "$C3_PROJECT_REF" --use-api) && verify_restored generate-reply; then echo 'C3_RECOVERY_RESULT|function=generate-reply|result=PASS'; else echo 'C3_RECOVERY_RESULT|function=generate-reply|result=FAIL'; failed=1; fi
          fi
          if [ "${{ steps.deploy_assist.outputs.attempted }}" = true ] && [ "${{ steps.readback_assist.outputs.identity }}" != baseline ]; then
            if (cd "$R/agent-assist" && supabase functions deploy agent-assist --project-ref "$C3_PROJECT_REF" --use-api) && verify_restored agent-assist; then echo 'C3_RECOVERY_RESULT|function=agent-assist|result=PASS'; else echo 'C3_RECOVERY_RESULT|function=agent-assist|result=FAIL'; failed=1; fi
          fi
          echo recovery_failed=$failed >> "$GITHUB_OUTPUT"; exit "$failed"
      - name: Final transport result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.final_gate.outcome }}" = success
          test "${{ steps.recovery.outputs.recovery_failed || '0' }}" = 0
          echo C3_EDGE_TRANSPORT_FINAL_RESULT=PASS
