            live={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob('*') if p.is_file()}
            target={x['path']:x['sha256'] for x in identity['target']['functions'][fn]['files']}
            baseline={x['path']:x['sha256'] for x in identity['baseline']['functions'][fn]['files']}
            classification='target' if live==target else 'baseline' if live==baseline else 'external_drift'
            meta=next((x for x in rows if (x.get('slug') or x.get('name'))==fn),None)
            config_ok=bool(meta and meta.get('status')=='ACTIVE' and meta.get('verify_jwt') is True and meta.get('import_map') is not True)
            if scope=='release':
              expected=identity['actual']['functions'][fn]
              config_ok=config_ok and int(meta.get('version',-1))==expected['version'] and meta.get('ezbr_sha256')==expected['bundle']
              if classification!='target': raise SystemExit(f'recovery_external_or_parallel_drift:{fn}:{classification}')
            elif classification=='external_drift': raise SystemExit(f'recovery_external_or_parallel_drift:{fn}')
            if not config_ok: raise SystemExit(f'recovery_live_config_drift:{fn}')
            (temp/f'recovery-class-{fn}').write_text(classification)
            print(f'C3_RECOVERY_LIVE_CLASSIFICATION|function={fn}|identity={classification}|result=PASS')
          PY
          echo C3_RECOVERY_LIVE_TARGET_DRIFT_CHECK=PASS
      - name: Execute explicitly authorized recovery and independent verification
        shell: bash
        run: |
          set -uo pipefail; failed=0; R="$RUNNER_TEMP/replacement-recovery"
          recover(){
            local fn="$1" d="$RUNNER_TEMP/replacement-readback-$1"; rm -rf "$d"; mkdir -p "$d/supabase"; cp "$GITHUB_WORKSPACE/supabase/config.toml" "$d/supabase/config.toml"
            if ! (cd "$R/$fn" && supabase functions deploy "$fn" --project-ref "$C3_PROJECT_REF" --use-api); then echo "C3_RECOVERY_RESULT|function=$fn|result=FAIL|stage=deploy"; return 1; fi
            if ! (cd "$d" && supabase functions download "$fn" --project-ref "$C3_PROJECT_REF" --use-api); then echo "C3_RECOVERY_RESULT|function=$fn|result=FAIL|stage=readback"; return 1; fi
            supabase functions list --project-ref "$C3_PROJECT_REF" --output json > "$d/functions.json" || return 1
            if node "$GITHUB_WORKSPACE/.github/scripts/c3_release_identity.mjs" rollback --function "$fn" \
              --source-root "$d/supabase/functions" --baseline "$R/$fn/MANIFEST.json" \
              --configuration "$R/$fn/CONFIGURATION.json" --metadata "$d/functions.json"; then
              echo "C3_RECOVERY_RESULT|function=$fn|source=EXACT|configuration=EXACT|bundle=EXACT|result=PASS"
            else
              echo "C3_RECOVERY_RESULT|function=$fn|result=FAIL|stage=exact_runtime_identity"; return 1
            fi
          }
          if [ "${{ inputs.recover_generate_reply }}" = true ] && [ "$(cat "$RUNNER_TEMP/recovery-class-generate-reply")" = target ]; then recover generate-reply || failed=1; fi
          if [ "${{ inputs.recover_agent_assist }}" = true ] && [ "$(cat "$RUNNER_TEMP/recovery-class-agent-assist")" = target ]; then recover agent-assist || failed=1; fi
          exit "$failed"

  c3-production-edge-transport:
    needs: c3-current-live-roundtrip
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.pull_request.number == 12 && github.actor == 'ebixsolutions' &&
      github.event.label.name == format('c3-prod-{0}', github.event.pull_request.head.sha) &&
      needs.c3-current-live-roundtrip.outputs.verified == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, clean: true}
      - uses: supabase/setup-cli@v1
        with: {version: '2.117.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Re-download durable baseline before first forward write
        uses: actions/download-artifact@v4
        with: {name: '${{ env.C3_CAPTURE_NAME }}', path: '${{ runner.temp }}/baseline'}
      - name: Baseline gate
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(supabase --version)" = "$C3_CLI_VERSION"
          test -s "$RUNNER_TEMP/baseline/CAPTURE.json"
          test -s "$RUNNER_TEMP/baseline/generate-reply/MANIFEST.json"
          test -s "$RUNNER_TEMP/baseline/agent-assist/MANIFEST.json"
          mkdir -p "$RUNNER_TEMP/release/target/generate-reply" "$RUNNER_TEMP/release/target/agent-assist"
          for fn in generate-reply agent-assist; do
            node .github/scripts/c3_release_identity.mjs target \
              --function "$fn" --source-root supabase/functions \
              --template "$RUNNER_TEMP/baseline/$fn/MANIFEST.json" \
              --head "$AUTHORIZED_HEAD" --tree "$(git rev-parse HEAD^{tree})" \
              --out "$RUNNER_TEMP/release/target/$fn/MANIFEST.json"
          done
          python - "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/forward" "$RUNNER_TEMP/release/target" <<'PY'
          import hashlib,json,pathlib,shutil,sys
          baseline=pathlib.Path(sys.argv[1]); forward=pathlib.Path(sys.argv[2]); target=pathlib.Path(sys.argv[3]); repo=pathlib.Path('supabase/functions')
          for fn in ('generate-reply','agent-assist'):
            manifest=json.loads((baseline/fn/'MANIFEST.json').read_text()); source=baseline/fn/'supabase/functions'
            exp={x['path']:x['sha256'] for x in manifest['files']}; act={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob('*') if p.is_file()}
            if exp!=act: raise SystemExit(f'durable_baseline_hash_mismatch:{fn}')
            proposed=json.loads((target/fn/'MANIFEST.json').read_text())
            work=forward/fn; (work/'supabase/functions').mkdir(parents=True); shutil.copy2('supabase/config.toml',work/'supabase/config.toml')
            for rel in [row['path'] for row in proposed['files']]:
              src=repo/rel; dst=work/'supabase/functions'/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          PY
          for fn in generate-reply agent-assist; do
            node .github/scripts/c3_release_identity.mjs package --function "$fn" \
              --source-root "$RUNNER_TEMP/forward/$fn/supabase/functions" \
              --target "$RUNNER_TEMP/release/target/$fn/MANIFEST.json"
          done
          python - "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/release" <<'PY'
          import hashlib,json,os,pathlib,sys
          baseline=pathlib.Path(sys.argv[1]); release=pathlib.Path(sys.argv[2])
          def load(path): return json.loads(path.read_text())
          def baseline_manifest(fn):
            path=baseline/fn/'MANIFEST.json'; value=load(path)
            value.setdefault('manifest_sha256',hashlib.sha256(path.read_bytes()).hexdigest()); return value
          tree=os.popen('git rev-parse HEAD^{tree}').read().strip()
          value={
            'head':os.environ['AUTHORIZED_HEAD'],'tree':tree,
            'deployment_run_id':os.environ['GITHUB_RUN_ID'],'deployment_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'baseline':{
              'artifact_id':'${{ needs.c3-current-live-roundtrip.outputs.artifact_id }}',
              'artifact_digest':'${{ needs.c3-current-live-roundtrip.outputs.artifact_digest }}',
              'artifact_run_id':os.environ['GITHUB_RUN_ID'],
              'functions':{fn:baseline_manifest(fn) for fn in ('generate-reply','agent-assist')}},
            'target':{'head':os.environ['AUTHORIZED_HEAD'],'tree':tree,
              'functions':{fn:load(release/'target'/fn/'MANIFEST.json') for fn in ('generate-reply','agent-assist')}},
          }
          (release/'intent-input.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
          node .github/scripts/c3_release_identity.mjs create-intent \
            --input "$RUNNER_TEMP/release/intent-input.json" --out "$RUNNER_TEMP/release/INTENT.json"
          echo ready=PASS >> "$GITHUB_OUTPUT"
          echo C3_DURABLE_BASELINE_BEFORE_FIRST_FORWARD_WRITE=PASS
      - name: Upload durable target intent before first forward write
        id: intent_upload
        if: steps.baseline.outputs.ready == 'PASS'
        uses: actions/upload-artifact@v4
        with:
          name: C3-release-intent-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/release/INTENT.json
            ${{ runner.temp }}/release/target
          if-no-files-found: error
          retention-days: 30
      - name: Download target intent to a clean round-trip path
        if: steps.intent_upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: C3-release-intent-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/intent-roundtrip
      - name: Verify target intent remote round-trip before first write
        id: intent_roundtrip
        if: steps.intent_upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/c3_release_identity.mjs verify-intent \
            --intent "$RUNNER_TEMP/intent-roundtrip/INTENT.json" --head "$AUTHORIZED_HEAD" \
            --tree "$(git rev-parse HEAD^{tree})" --deployment-run-id "$GITHUB_RUN_ID"
          test "$(sha256sum "$RUNNER_TEMP/release/INTENT.json"|cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP/intent-roundtrip/INTENT.json"|cut -d' ' -f1)"
          echo verified=PASS >> "$GITHUB_OUTPUT"
      - name: Deploy generate-reply
        id: deploy_generate
        if: steps.intent_roundtrip.outputs.verified == 'PASS'
        continue-on-error: true
        shell: bash
        run: |
          echo attempted=true >> "$GITHUB_OUTPUT"
          if (cd "$RUNNER_TEMP/forward/generate-reply" && supabase functions deploy generate-reply --project-ref "$C3_PROJECT_REF" --use-api); then echo command_result=success >> "$GITHUB_OUTPUT"; else echo command_result=unknown >> "$GITHUB_OUTPUT"; exit 1; fi
      - name: Mandatory readback after generate attempt
        id: readback_generate
        if: always() && steps.deploy_generate.outputs.attempted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; D="$RUNNER_TEMP/post-generate"; mkdir -p "$D/supabase"; cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download generate-reply --project-ref "$C3_PROJECT_REF" --use-api)
          (cd "$RUNNER_TEMP" && supabase functions list --project-ref "$C3_PROJECT_REF" --output json > post-generate-list.json)
          node .github/scripts/c3_release_identity.mjs actual --function generate-reply \
            --source-root "$D/supabase/functions" --target "$RUNNER_TEMP/release/target/generate-reply/MANIFEST.json" \
            --metadata "$RUNNER_TEMP/post-generate-list.json" \
            --out "$RUNNER_TEMP/release/actual/generate-reply/MANIFEST.json"
          mkdir -p "$RUNNER_TEMP/release/actual/generate-reply/supabase"
          cp -R "$D/supabase/functions" "$RUNNER_TEMP/release/actual/generate-reply/supabase/functions"
          echo completed=true >> "$GITHUB_OUTPUT"; echo identity=target >> "$GITHUB_OUTPUT"
      - name: Deploy agent-assist after known generate readback
        id: deploy_assist
        if: steps.deploy_generate.outputs.command_result == 'success' && steps.readback_generate.outputs.completed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          echo attempted=true >> "$GITHUB_OUTPUT"
          if (cd "$RUNNER_TEMP/forward/agent-assist" && supabase functions deploy agent-assist --project-ref "$C3_PROJECT_REF" --use-api); then echo command_result=success >> "$GITHUB_OUTPUT"; else echo command_result=unknown >> "$GITHUB_OUTPUT"; exit 1; fi
      - name: Mandatory readback after assist attempt
        id: readback_assist
        if: always() && steps.deploy_assist.outputs.attempted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; D="$RUNNER_TEMP/post-assist"; mkdir -p "$D/supabase"; cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download agent-assist --project-ref "$C3_PROJECT_REF" --use-api)
          (cd "$RUNNER_TEMP" && supabase functions list --project-ref "$C3_PROJECT_REF" --output json > post-assist-list.json)
          node .github/scripts/c3_release_identity.mjs actual --function agent-assist \
            --source-root "$D/supabase/functions" --target "$RUNNER_TEMP/release/target/agent-assist/MANIFEST.json" \
            --metadata "$RUNNER_TEMP/post-assist-list.json" \
            --out "$RUNNER_TEMP/release/actual/agent-assist/MANIFEST.json"
          mkdir -p "$RUNNER_TEMP/release/actual/agent-assist/supabase"
          cp -R "$D/supabase/functions" "$RUNNER_TEMP/release/actual/agent-assist/supabase/functions"
          echo completed=true >> "$GITHUB_OUTPUT"; echo identity=target >> "$GITHUB_OUTPUT"
      - name: Assemble baseline-target-actual release identity
        id: release_identity
        if: always() && steps.readback_generate.outcome == 'success' && steps.readback_assist.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/release" <<'PY'
          import hashlib,json,os,pathlib,sys
          baseline=pathlib.Path(sys.argv[1]); release=pathlib.Path(sys.argv[2])
          def load(path): return json.loads(path.read_text())
          def load_baseline(path):
            value=load(path)
            value.setdefault('manifest_sha256',hashlib.sha256(path.read_bytes()).hexdigest())
            return value
          payload={
            'head':os.environ['AUTHORIZED_HEAD'],'tree':os.popen('git rev-parse HEAD^{tree}').read().strip(),
            'deployment_run_id':os.environ['GITHUB_RUN_ID'],'deployment_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'baseline':{
              'artifact_id':'${{ needs.c3-current-live-roundtrip.outputs.artifact_id }}',
              'artifact_digest':'${{ needs.c3-current-live-roundtrip.outputs.artifact_digest }}',
              'artifact_run_id':os.environ['GITHUB_RUN_ID'],
              'functions':{fn:load_baseline(baseline/fn/'MANIFEST.json') for fn in ('generate-reply','agent-assist')}},
            'target':{'head':os.environ['AUTHORIZED_HEAD'],'tree':os.popen('git rev-parse HEAD^{tree}').read().strip(),
              'functions':{fn:load(release/'target'/fn/'MANIFEST.json') for fn in ('generate-reply','agent-assist')}},
            'actual':{'functions':{fn:load(release/'actual'/fn/'MANIFEST.json') for fn in ('generate-reply','agent-assist')}},
            'cleanup_manifest_name':f'C3-validation-production-evidence-{os.environ["AUTHORIZED_HEAD"]}/fixture-manifest.json',
          }
          (release/'release-input.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          node .github/scripts/c3_release_identity.mjs create-release \
            --input "$RUNNER_TEMP/release/release-input.json" --out "$RUNNER_TEMP/release/RELEASE.json"
          echo ready=PASS >> "$GITHUB_OUTPUT"
      - name: Upload durable release execution identity
        id: release_upload
        if: steps.release_identity.outputs.ready == 'PASS'
        uses: actions/upload-artifact@v4
        with:
          name: C3-release-identity-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30
      - name: Remote round-trip release identity on clean path
        if: steps.release_upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: C3-release-identity-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/release-roundtrip
      - name: Verify remote release identity round-trip
        id: release_roundtrip
        if: steps.release_upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/release/RELEASE.json" | cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP/release-roundtrip/RELEASE.json" | cut -d' ' -f1)"
          node .github/scripts/c3_release_identity.mjs verify-release \
            --release "$RUNNER_TEMP/release-roundtrip/RELEASE.json" --head "$AUTHORIZED_HEAD" \
            --tree "$(git rev-parse HEAD^{tree})" --deployment-run-id "$GITHUB_RUN_ID" \
            --root "$RUNNER_TEMP/release-roundtrip"
          echo verified=PASS >> "$GITHUB_OUTPUT"
      - name: Post-deployment P0 final transport gate
        id: final_gate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail; eval "$C3_ASSERT_LIB"
          test "${{ steps.deploy_generate.outputs.command_result }}" = success
          test "${{ steps.readback_generate.outputs.completed }}" = true
          test "${{ steps.deploy_assist.outputs.command_result }}" = success
          test "${{ steps.readback_assist.outputs.completed }}" = true
          test "${{ steps.release_roundtrip.outputs.verified }}" = PASS
          (cd "$RUNNER_TEMP" && supabase functions list --project-ref "$C3_PROJECT_REF" --output json > post-functions.json)
          python - "$RUNNER_TEMP/baseline/CAPTURE.json" "$RUNNER_TEMP/post-functions.json" <<'PY'
          import json,sys
          cap=json.load(open(sys.argv[1])); raw=json.load(open(sys.argv[2])); rows=raw.get('functions',raw) if isinstance(raw,dict) else raw
          for exp in cap['frozen_functions']:
            got=next((x for x in rows if x.get('slug')==exp['function'] or x.get('name')==exp['function']),None)
            ok=bool(got and got.get('status')==exp['status'] and int(got.get('version',-1))==exp['version'] and got.get('verify_jwt') is exp['verify_jwt'] and got.get('import_map') is exp['import_map'] and str(got.get('ezbr_sha256',''))==exp['bundle'])
            print(f'C3_FROZEN_READBACK_ASSERT|function={exp["function"]}|result={"PASS" if ok else "FAIL"}')
            if not ok: raise SystemExit(1)
          PY
          c3_source_clean production_final 1
          echo C3_POST_DEPLOYMENT_P0_FINAL_GATE=PASS
      - name: Failure-safe recovery after all post-deployment P0 gates
        id: recovery
        if: >-
          always() &&
          (steps.deploy_generate.outcome == 'failure' || steps.readback_generate.outcome == 'failure' ||
           steps.deploy_assist.outcome == 'failure' || steps.readback_assist.outcome == 'failure' ||
           steps.final_gate.outcome == 'failure')
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail; failed=0; R="$RUNNER_TEMP/baseline"
          verify_restored(){
            local fn="$1" d="$RUNNER_TEMP/recovered-$1"; rm -rf "$d"; mkdir -p "$d/supabase"; cp supabase/config.toml "$d/supabase/config.toml"
            (cd "$d" && supabase functions download "$fn" --project-ref "$C3_PROJECT_REF" --use-api) || return 1
            supabase functions list --project-ref "$C3_PROJECT_REF" --output json > "$d/functions.json" || return 1
            node .github/scripts/c3_release_identity.mjs rollback --function "$fn" \
              --source-root "$d/supabase/functions" --baseline "$R/$fn/MANIFEST.json" \
              --configuration "$R/$fn/CONFIGURATION.json" --metadata "$d/functions.json"
          }
          if [ "${{ steps.deploy_generate.outputs.attempted }}" = true ] && [ "${{ steps.readback_generate.outputs.identity }}" != baseline ]; then
            if (cd "$R/generate-reply" && supabase functions deploy generate-reply --project-ref "$C3_PROJECT_REF" --use-api) && verify_restored generate-reply; then echo 'C3_RECOVERY_RESULT|function=generate-reply|result=PASS'; else echo 'C3_RECOVERY_RESULT|function=generate-reply|result=FAIL'; failed=1; fi
          fi
          if [ "${{ steps.deploy_assist.outputs.attempted }}" = true ] && [ "${{ steps.readback_assist.outputs.identity }}" != baseline ]; then
            if (cd "$R/agent-assist" && supabase functions deploy agent-assist --project-ref "$C3_PROJECT_REF" --use-api) && verify_restored agent-assist; then echo 'C3_RECOVERY_RESULT|function=agent-assist|result=PASS'; else echo 'C3_RECOVERY_RESULT|function=agent-assist|result=FAIL'; failed=1; fi
          fi
          echo recovery_failed=$failed >> "$GITHUB_OUTPUT"; exit "$failed"
      - name: Final transport result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.final_gate.outcome }}" = success
          test "${{ steps.recovery.outputs.recovery_failed || '0' }}" = 0
          echo C3_EDGE_TRANSPORT_FINAL_RESULT=PASS
