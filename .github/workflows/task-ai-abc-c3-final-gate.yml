            manifest={'project':'nrfxhqabwblzxoushgnm','function':fn,'version':version,'capture_time':os.environ['CAPTURED_AT'],'entrypoint':entry,'file_count':len(files),'verify_jwt':True,'import_map':False,'observed_bundle_sha256':bundle,'files':files,'dependencies':imports}
            cfg={'entrypoint':entry,'import_map':False,'observed_bundle_sha256':bundle,'status':'ACTIVE','verify_jwt':True,'version':version}
