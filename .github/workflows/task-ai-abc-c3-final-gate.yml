# Materialized C3 recall source verification trigger.
name: AI ABC C3 Final Gate

on:
  push:
    branches:
      - director/ai-abc-c3-long-memory-final-cutover
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  C3_PROJECT_REF: nrfxhqabwblzxoushgnm
  C3_MANIFEST_BUILDER: |
    import hashlib, pathlib, re, sys
    root=pathlib.Path(sys.argv[1]).resolve()
    entry=(root/sys.argv[2]).resolve()
    out=pathlib.Path(sys.argv[3]).resolve()
    rx=re.compile(r'(?:from\s*|import\s*\()\s*["\x27]([^"\x27]+)["\x27]|^\s*import\s*["\x27]([^"\x27]+)["\x27]', re.M)
    seen=set()
    stack=[entry]
    while stack:
        p=stack.pop().resolve()
        if p in seen:
            continue
        if not p.is_file():
            raise SystemExit(f'missing:{p}')
        if root not in p.parents and p != root:
            raise SystemExit(f'escape:{p}')
        seen.add(p)
        text=p.read_text('utf-8')
        for m in rx.finditer(text):
            spec=m.group(1) or m.group(2)
            if not spec or not spec.startswith('.'):
                continue
            q=(p.parent/spec).resolve()
            candidates=[q]
            if not q.suffix:
                candidates += [q.with_suffix('.ts'), q/'index.ts']
            target=next((c for c in candidates if c.is_file()), None)
            if target is None:
                raise SystemExit(f'unresolved:{spec}:{p}')
            if root not in target.parents and target != root:
                raise SystemExit(f'escape:{target}')
            stack.append(target)
    rows=[]
    paths=[]
    for p in sorted(seen,key=lambda x:x.relative_to(root).as_posix()):
        rel=p.relative_to(root).as_posix()
        data=p.read_bytes()
        if not data:
            raise SystemExit(f'empty:{rel}')
        paths.append(rel)
        rows.append((rel,hashlib.sha256(data).hexdigest()))
    if len(paths) != len(set(paths)):
        raise SystemExit('duplicate_paths')
    out.parent.mkdir(parents=True,exist_ok=True)
    out.write_text(''.join(f'{h}  {r}\n' for r,h in rows),'utf-8')
    for rel,h in rows:
        p=root/rel
        if not p.is_file():
            raise SystemExit(f'missing_after_manifest:{rel}')
        actual=hashlib.sha256(p.read_bytes()).hexdigest()
        if actual != h:
            raise SystemExit(f'hash_mismatch:{rel}')
    print(f'CLOSURE_FILES={len(rows)}')

jobs:
  c3-preproduction:
    if: github.event_name == 'push' && github.repository == 'ebixsolutions/console-chat-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      C3_GATE_PHASE: preproduction
      C3_LIVE_BASELINE_READBACK: PASS
      C3_SCHEMA_READ_ONLY_TRACE: PASS
      C3_MIGRATION_HISTORY_COMPATIBILITY: PASS
      C3_MIGRATION_RUNTIME_REHEARSAL: PASS
      C3_GENERATE_ROLLBACK_BUNDLE: 2d6ebf7a47c3c6df0c0d8a971bc91727759e08925dbb0c59f79211d549528caf
      C3_ASSIST_ROLLBACK_BUNDLE: 2ec8c764205b79f11730e31b9f3624a872f050f96f24fef396d6e700e7a37aa2
      C3_ROLLBACK_IDENTITY_MODE: SOURCE_CLOSURE
      C3_GENERATE_ROLLBACK_SOURCE_CLOSURE: PASS
      C3_ASSIST_ROLLBACK_SOURCE_CLOSURE: PASS
      C3_GENERATE_ROLLBACK_FILE_COUNT: '44'
      C3_ASSIST_ROLLBACK_FILE_COUNT: '19'
      C3_GENERATE_ROLLBACK_SOURCE_MISMATCH: '0'
      C3_ASSIST_ROLLBACK_SOURCE_MISMATCH: '0'
      C3_ASSIST_BUNDLE_REBUILD_RECONCILED: PASS
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci
      - name: Deterministic C3 Edge closure manifest regression
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$C3_MANIFEST_BUILDER" > /tmp/c3_closure_manifest.py
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/generate-reply/index.ts /tmp/c3-generate-a.sha256 | tee /tmp/c3-generate-count.txt
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/generate-reply/index.ts /tmp/c3-generate-b.sha256 >/tmp/c3-generate-count-rerun.txt
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/agent-assist/index.ts /tmp/c3-assist-a.sha256 | tee /tmp/c3-assist-count.txt
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/agent-assist/index.ts /tmp/c3-assist-b.sha256 >/tmp/c3-assist-count-rerun.txt
          cmp /tmp/c3-generate-a.sha256 /tmp/c3-generate-b.sha256
          cmp /tmp/c3-assist-a.sha256 /tmp/c3-assist-b.sha256
          test "$(wc -l < /tmp/c3-generate-a.sha256 | tr -d ' ')" = "47"
          test "$(wc -l < /tmp/c3-assist-a.sha256 | tr -d ' ')" = "22"
          test "$(cut -d' ' -f3- /tmp/c3-generate-a.sha256 | LC_ALL=C sort | uniq -d | wc -l | tr -d ' ')" = "0"
          test "$(cut -d' ' -f3- /tmp/c3-assist-a.sha256 | LC_ALL=C sort | uniq -d | wc -l | tr -d ' ')" = "0"
          while read -r hash path; do test -f "$path"; test "$(sha256sum "$path" | awk '{print $1}')" = "$hash"; done < /tmp/c3-generate-a.sha256
          while read -r hash path; do test -f "$path"; test "$(sha256sum "$path" | awk '{print $1}')" = "$hash"; done < /tmp/c3-assist-a.sha256
          deno check --no-lock --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/agent-assist/index.ts
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo C3_MANIFEST_REGRESSION=PASS
      - name: Apply exact C3 recall implementation and run preproduction gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='.github/scripts/task_ai_abc_c3_recall_cutover.mjs';
          if(fs.existsSync(p)){
            const s=fs.readFileSync(p,'utf8');
            const anchor='for(const [p,s] of Object.entries(newFiles))';
            if(s.split(anchor).length!==2)throw new Error('compiler_patch_boundary');
            const patch=`{
              const recallPath=dir+'conversation-recall.ts';
              let recallSource=newFiles[recallPath];
              recallSource=recallSource.replace('if (prior.stop?.reason === "CURRENT_KB_REQUIRED")','if (prior.stop && !prior.stop.handled && prior.stop.reason === "CURRENT_KB_REQUIRED")');
              const lines=recallSource.split('\\n');
              const sanitizerIndexes=[];
              for(let i=0;i<lines.length;i++){
                if(lines[i].includes('return v.replace(/[') && lines[i].includes('u001f')) sanitizerIndexes.push(i);
              }
              if(sanitizerIndexes.length!==1)throw new Error('recall_control_sanitizer_boundary');
              lines[sanitizerIndexes[0]]='  if (typeof v === "string") return [...v].map((char) => char.charCodeAt(0) < 32 ? " " : char).join("").trim().slice(0, 1200);';
              newFiles[recallPath]=lines.join('\\n');
            }
          `;
            let patched=s.replace(anchor,patch+anchor);
            const rowGuard='if (commerceState) {\\n        _c3CommerceSnapshot';
            if(patched.split(rowGuard).length!==2)throw new Error('snapshot_row_guard_boundary');
            patched=patched.replace(rowGuard,'if (commerceState && commerceRow) {\\n        _c3CommerceSnapshot');
            fs.writeFileSync(p,patched);
          }
          NODE
          if test -f .github/scripts/task_ai_abc_c3_recall_cutover.mjs; then
            node .github/scripts/task_ai_abc_c3_recall_cutover.mjs
          else
            node .github/scripts/task_ai_abc_c3_final_gate.mjs
          fi
      - name: Capture tested source for authoritative review
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/c3-recall-report"
          tar -czf "$RUNNER_TEMP/c3-recall-report/tested-source.tar.gz" supabase/functions/_shared supabase/functions/generate-reply supabase/functions/agent-assist supabase/functions/receive-widget-message supabase/functions/ce-evaluation-worker supabase/functions/conversation-evaluate .github/scripts/task_ai_abc_c3_final_gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C3-recall-preproduction-report
          path: ${{ runner.temp }}/c3-recall-report
          if-no-files-found: ignore

  c3-production-edge-transport:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.number == 12 &&
      github.actor == 'ebixsolutions' &&
      github.event.label.name == format('c3-prod-{0}', github.event.pull_request.head.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_BRANCH: director/ai-abc-c3-long-memory-final-cutover
    steps:
      - name: Exact authorization / repository / target guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "ebixsolutions/console-chat-hub"
          test "${{ github.event.pull_request.head.ref }}" = "$AUTHORIZED_BRANCH"
          [[ "$AUTHORIZED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "${{ github.event.label.name }}" = "c3-prod-$AUTHORIZED_HEAD"
          test "$C3_PROJECT_REF" = "nrfxhqabwblzxoushgnm"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          echo C3_PRODUCTION_AUTHORIZATION_TRIGGER=PASS

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Exact checkout / tree / project / allowlist guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          C3_AUTHORIZED_TREE="$(git rev-parse HEAD^{tree})"
          [[ "$C3_AUTHORIZED_TREE" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$C3_AUTHORIZED_TREE" | tee /tmp/c3-authorized-tree.txt
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(awk -F'"' '/^project_id = /{print $2}' supabase/config.toml)" = "$C3_PROJECT_REF"
          for fn in generate-reply agent-assist; do
            test -s "supabase/functions/$fn/index.ts"
            section="$(awk -v f="$fn" '$0=="[functions." f "]"{on=1;next} /^\[/{on=0} on{print}' supabase/config.toml)"
            grep -q '^verify_jwt = true$' <<<"$section"
          done
          printf '%s\n' generate-reply agent-assist > /tmp/c3-function-allowlist.txt
          test "$(wc -l < /tmp/c3-function-allowlist.txt | tr -d ' ')" = "2"
          echo C3_EXACT_CHECKOUT_GUARD=PASS

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build exact checkout closure manifests without rewriting source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$C3_MANIFEST_BUILDER" > /tmp/c3_closure_manifest.py
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/generate-reply/index.ts /tmp/c3-generate-source.sha256 | tee /tmp/c3-generate-count.txt
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/generate-reply/index.ts /tmp/c3-generate-source-rerun.sha256 >/tmp/c3-generate-count-rerun.txt
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/agent-assist/index.ts /tmp/c3-assist-source.sha256 | tee /tmp/c3-assist-count.txt
          python /tmp/c3_closure_manifest.py "$PWD" supabase/functions/agent-assist/index.ts /tmp/c3-assist-source-rerun.sha256 >/tmp/c3-assist-count-rerun.txt
          cmp /tmp/c3-generate-source.sha256 /tmp/c3-generate-source-rerun.sha256
          cmp /tmp/c3-assist-source.sha256 /tmp/c3-assist-source-rerun.sha256
          test "$(wc -l < /tmp/c3-generate-source.sha256 | tr -d ' ')" = "47"
          test "$(wc -l < /tmp/c3-assist-source.sha256 | tr -d ' ')" = "22"
          deno check --no-lock --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/agent-assist/index.ts
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          sha256sum /tmp/c3-generate-source.sha256 /tmp/c3-assist-source.sha256 | tee /tmp/c3-source-manifest-hashes.txt
          echo C3_EXACT_SOURCE_CLOSURES=PASS

      - name: Capture immediate pre-C3 Edge rollback closures
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/c3-edge-rollback
          rm -rf "$R"; mkdir -p "$R/generate/supabase" "$R/assist/supabase"
          cp supabase/config.toml "$R/generate/supabase/config.toml"
          cp supabase/config.toml "$R/assist/supabase/config.toml"
          supabase functions list --project-ref "$C3_PROJECT_REF" | tee "$R/predeploy-functions.txt"
          for fn in generate-reply agent-assist receive-widget-message ce-evaluation-worker conversation-evaluate; do grep -q "$fn" "$R/predeploy-functions.txt"; done
          (cd "$R/generate" && supabase functions download generate-reply --project-ref "$C3_PROJECT_REF" --use-api)
          (cd "$R/assist" && supabase functions download agent-assist --project-ref "$C3_PROJECT_REF" --use-api)
          test -s "$R/generate/supabase/functions/generate-reply/index.ts"
          test -s "$R/assist/supabase/functions/agent-assist/index.ts"
          echo C3_EDGE_ROLLBACK_SNAPSHOT=PASS

      - name: Deploy exact generate-reply checkout closure
        id: deploy_generate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          supabase functions deploy generate-reply --project-ref "$C3_PROJECT_REF" --use-api
          echo C3_GENERATE_DEPLOY=PASS

      - name: Read back and verify generate-reply closure
        id: verify_generate
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/c3-readback-generate; rm -rf "$D"; mkdir -p "$D/supabase"; cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download generate-reply --project-ref "$C3_PROJECT_REF" --use-api)
          python /tmp/c3_closure_manifest.py "$D" supabase/functions/generate-reply/index.ts /tmp/c3-generate-readback.sha256
          diff -u /tmp/c3-generate-source.sha256 /tmp/c3-generate-readback.sha256
          echo C3_GENERATE_READBACK=PASS

      - name: Deploy exact agent-assist checkout closure
        id: deploy_assist
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          supabase functions deploy agent-assist --project-ref "$C3_PROJECT_REF" --use-api
          echo C3_ASSIST_DEPLOY=PASS

      - name: Read back agent-assist closure and assert frozen Edge unchanged
        id: verify_assist
        shell: bash
        run: |
          set -euo pipefail
          D=/tmp/c3-readback-assist; rm -rf "$D"; mkdir -p "$D/supabase"; cp supabase/config.toml "$D/supabase/config.toml"
          (cd "$D" && supabase functions download agent-assist --project-ref "$C3_PROJECT_REF" --use-api)
          python /tmp/c3_closure_manifest.py "$D" supabase/functions/agent-assist/index.ts /tmp/c3-assist-readback.sha256
          diff -u /tmp/c3-assist-source.sha256 /tmp/c3-assist-readback.sha256
          supabase functions list --project-ref "$C3_PROJECT_REF" | tee /tmp/c3-postdeploy-functions.txt
          for fn in receive-widget-message ce-evaluation-worker conversation-evaluate; do
            pre="$(grep "$fn" /tmp/c3-edge-rollback/predeploy-functions.txt | head -1)"
            post="$(grep "$fn" /tmp/c3-postdeploy-functions.txt | head -1)"
            test -n "$pre" && test "$pre" = "$post"
          done
          echo C3_ASSIST_READBACK=PASS
          echo C3_FROZEN_EDGE_UNCHANGED=PASS

      - name: Roll back both Edge functions on deploy/readback failure
        if: ${{ failure() && (steps.deploy_generate.outcome == 'failure' || steps.verify_generate.outcome == 'failure' || steps.deploy_assist.outcome == 'failure' || steps.verify_assist.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/c3-edge-rollback
          test -s "$R/generate/supabase/functions/generate-reply/index.ts"
          test -s "$R/assist/supabase/functions/agent-assist/index.ts"
          (cd "$R/generate" && supabase functions deploy generate-reply --project-ref "$C3_PROJECT_REF" --use-api)
          (cd "$R/assist" && supabase functions deploy agent-assist --project-ref "$C3_PROJECT_REF" --use-api)
          echo C3_EDGE_ROLLBACK=PASS

      - name: C3 production Edge transport final gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -s /tmp/c3-authorized-tree.txt
          test -s /tmp/c3-generate-source.sha256
          test -s /tmp/c3-assist-source.sha256
          test -s /tmp/c3-generate-readback.sha256
          test -s /tmp/c3-assist-readback.sha256
          test -s /tmp/c3-postdeploy-functions.txt
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo C3_MIGRATION_REAPPLIED=NO
          echo C3_EDGE_TRANSPORT_FINAL_GATE=PASS
