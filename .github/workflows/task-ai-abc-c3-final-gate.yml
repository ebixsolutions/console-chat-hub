  c3-durable-recovery-execution:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'recovery' && github.actor == 'ebixsolutions' &&
      ((inputs.recovery_scope == 'release' && inputs.recovery_authorization == format('c3-recovery-{0}-{1}', inputs.release_id, inputs.validation_run_id)) ||
       (inputs.recovery_scope == 'intent' && inputs.recovery_authorization == format('c3-recovery-intent-{0}-{1}', inputs.release_id, inputs.deployment_run_id))) &&
      (inputs.recover_generate_reply || inputs.recover_agent_assist)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, clean: true}
      - name: Verify explicit recovery authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.recovery_scope }}" = release ]; then
            test "${{ inputs.recovery_authorization }}" = "c3-recovery-${{ inputs.release_id }}-${{ inputs.validation_run_id }}"
          else
            test "${{ inputs.recovery_authorization }}" = "c3-recovery-intent-${{ inputs.release_id }}-${{ inputs.deployment_run_id }}"
          fi
          test "${{ github.ref_name }}" = director/ai-abc-c3-long-memory-final-cutover
