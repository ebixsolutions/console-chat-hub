          index={'classification':'INTERIM LIVE RECOVERY BASELINE — NOT PRODUCT-READY','project':'nrfxhqabwblzxoushgnm','captured_at':os.environ['CAPTURED_AT'],'functions':[],'frozen_functions':[]}
          frozen={'receive-widget-message':(23,False,'3674faf3499a319269c8d9fda63bd1e7ee6ca770219b2f701854f33863d1af08'),'ce-evaluation-worker':(25,False,'626ade7e2dcd45d56314e986e1394ab70ca41e4e52f416e01324885011a682f2'),'conversation-evaluate':(20,True,'2176d2412fe921c0d3ab47abc04daa324d2101f54548ce9c29f8de95e2b7496d')}
