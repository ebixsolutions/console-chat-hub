name: AI ABC C3 Final Gate

on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: Secret-free preflight, synthetic nonproduction regression, separately authorized live validation, cleanup-only, or recovery
        required: true
        default: preflight_offline
        type: choice
        options:
          - preflight_offline
          - nonproduction_external_quality
          - validation_only
          - evidence_finalize
          - cleanup_only
          - recovery
      expected_head:
        description: Exact authorized validation HEAD
        required: false
        type: string
      expected_tree:
        description: Exact authorized validation TREE
        required: false
        type: string
      nonproduction_model_authorization:
        description: Exact C3 zero-cost isolated generation credential authorization token
        required: false
        type: string
      validation_authorization:
        description: Exact c3-validation-HEAD-TREE-RELEASE_ID authorization
        required: false
        type: string
      deployment_run_id:
        description: Parent deployment run holding the durable release identity
        required: false
        type: string
      deployment_attempt:
        description: Exact parent deployment run attempt
        required: false
        default: '1'
        type: string
      release_id:
        description: Exact release execution identity
        required: false
        type: string
      release_digest:
        description: Exact sha256 digest of RELEASE.json
        required: false
        type: string
      artifact_run_id:
        description: Parent deployment run holding the release baseline artifact
        required: false
        type: string
      artifact_id:
        description: Exact release baseline artifact ID
        required: false
        type: string
      artifact_digest:
        description: Exact release baseline artifact sha256 digest
        required: false
        type: string
      cleanup_source_run_id:
        description: Validation run containing a fixture manifest for cleanup-only recovery
        required: false
        type: string
      validation_run_id:
        description: Failed validation child run authorizing release-scoped recovery
        required: false
        type: string
      validation_run_attempt:
        description: Exact validation run attempt containing runtime evidence
        required: false
        default: '1'
        type: string
      validation_artifact_identity:
        description: JSON with exact runtime evidence artifact id and digest
        required: false
        type: string
      finalization_authorization:
        description: Exact c3-evidence-finalize-HEAD-TREE-RELEASE_ID-VALIDATION_RUN authorization
        required: false
        type: string
      human_artifact_identity:
        description: JSON with external human artifact id, digest and run_id
        required: false
        type: string
      cleanup_fixture_marker:
        description: Exact deterministic fixture marker if the prior runner vanished before artifact upload
        required: false
        type: string
      recovery_authorization:
        description: Exact c3-recovery-<selected commit SHA> authorization
        required: false
        type: string
      recovery_scope:
        description: Recover a failed validation release or an interrupted deployment intent
        required: true
        default: release
        type: choice
        options:
          - release
          - intent
      recover_generate_reply:
        description: Recover generate-reply from the durable snapshot
        required: true
        default: false
        type: boolean
      recover_agent_assist:
        description: Recover agent-assist from the durable snapshot
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  C3_PROJECT_REF: nrfxhqabwblzxoushgnm
  C3_CAPTURE_NAME: C3-current-live-v112-v43-recovery-baseline
  C3_CAPTURE_RETENTION_DAYS: '30'
  C3_CLI_VERSION: '2.117.0'
  C3_CLI_EPHEMERAL: supabase/.temp/cli-latest
  C3_ASSERT_LIB: |
    c3_assert(){ local n="$1" e="$2" a="$3"; if [ "$e" = "$a" ]; then echo "C3_SOURCE_ASSERT|name=$n|expected=$e|actual=$a|result=PASS"; else echo "C3_SOURCE_ASSERT|name=$n|expected=$e|actual=$a|result=FAIL"; return 1; fi; }
    c3_source_clean(){
      local phase="$1" expected_cli="$2" tracked staged approved unauthorized failed=0 offenders
      tracked="$(git diff --name-only | awk 'NF{n++} END{print n+0}')"
      staged="$(git diff --cached --name-only | awk 'NF{n++} END{print n+0}')"
      approved="$(git ls-files --others --exclude-standard | awk -v p="$C3_CLI_EPHEMERAL" '$0==p{n++} END{print n+0}')"
      offenders="$(git ls-files --others --exclude-standard | awk -v p="$C3_CLI_EPHEMERAL" 'NF && $0!=p{print}')"
      unauthorized="$(printf '%s\n' "$offenders" | awk 'NF{n++} END{print n+0}')"
      echo "C3_SOURCE_STATUS|phase=$phase"
      git status --porcelain || true
      printf '%s\n' "$offenders" | awk 'NF{print "C3_SOURCE_OFFENDER|kind=unauthorized_untracked|path=" $0}'
      c3_assert "${phase}_tracked_modified" 0 "$tracked" || failed=1
      c3_assert "${phase}_staged" 0 "$staged" || failed=1
      c3_assert "${phase}_exact_cli_ephemeral" "$expected_cli" "$approved" || failed=1
      c3_assert "${phase}_unauthorized_untracked" 0 "$unauthorized" || failed=1
      if git ls-files --error-unmatch "$C3_CLI_EPHEMERAL" >/dev/null 2>&1; then echo "C3_SOURCE_ASSERT|name=${phase}_cli_ephemeral_untracked|expected=untracked|actual=tracked|result=FAIL"; failed=1; else echo "C3_SOURCE_ASSERT|name=${phase}_cli_ephemeral_untracked|expected=untracked|actual=untracked|result=PASS"; fi
      return "$failed"
    }
    c3_cli_delta(){
      local before="$1" after="$2" delta
      delta="$(comm -13 "$before" "$after" | awk 'NF')"
      if [ "$delta" = "$C3_CLI_EPHEMERAL" ]; then echo "C3_SOURCE_ASSERT|name=cli_setup_created_exact_path|expected=$C3_CLI_EPHEMERAL|actual=$delta|result=PASS"; else printf '%s\n' "$delta" | awk 'NF{print "C3_SOURCE_OFFENDER|kind=cli_setup_delta|path=" $0}'; echo "C3_SOURCE_ASSERT|name=cli_setup_created_exact_path|expected=$C3_CLI_EPHEMERAL|actual=${delta:-NONE}|result=FAIL"; return 1; fi
    }

jobs:
  c3-nonproduction-external-quality:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'nonproduction_external_quality' &&
      github.actor == 'ebixsolutions'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: c3-nonproduction-free
    env:
      C3_NONPROD_SUPABASE_PROJECT_REF: ${{ secrets.C3_NONPROD_SUPABASE_PROJECT_REF }}
      C3_NONPROD_SUPABASE_URL: ${{ secrets.C3_NONPROD_SUPABASE_URL }}
      C3_NONPROD_SUPABASE_ACCESS_TOKEN: ${{ secrets.C3_NONPROD_SUPABASE_ACCESS_TOKEN }}
      C3_NONPROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.C3_NONPROD_SUPABASE_SERVICE_ROLE_KEY }}
      C3_NONPROD_TEST_AGENT_EMAIL: ${{ secrets.C3_NONPROD_TEST_AGENT_EMAIL }}
      C3_NONPROD_TEST_AGENT_PASSWORD: ${{ secrets.C3_NONPROD_TEST_AGENT_PASSWORD }}
      C3_NONPROD_MODEL_AUTHORIZATION: ${{ inputs.nonproduction_model_authorization }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, clean: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reject production identity and bind exact runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${C3_NONPROD_SUPABASE_PROJECT_REF:-}" = nbtowfuvvfqpxqydyoby
          test "$C3_NONPROD_SUPABASE_PROJECT_REF" != nrfxhqabwblzxoushgnm
          test "${C3_NONPROD_SUPABASE_URL:-}" = "https://$C3_NONPROD_SUPABASE_PROJECT_REF.supabase.co"
          case "$C3_NONPROD_SUPABASE_URL" in *nrfxhqabwblzxoushgnm*) exit 1;; esac
          test -n "${C3_NONPROD_SUPABASE_ACCESS_TOKEN:-}"
          test -n "${C3_NONPROD_SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${C3_NONPROD_TEST_AGENT_EMAIL:-}"
          test -n "${C3_NONPROD_TEST_AGENT_PASSWORD:-}"
          node .github/scripts/c3_nonproduction_external_quality.mjs preflight
      - name: Verify synthetic regression dataset and anti-fake controls
        run: |
          set -euo pipefail
          node .github/scripts/c3_nonproduction_external_quality.mjs verify-dataset
          node .github/scripts/c3_nonproduction_external_quality.test.mjs
      - name: Run isolated synthetic HTTP regression and exact-ID cleanup
        run: node .github/scripts/c3_nonproduction_external_quality.mjs run "$RUNNER_TEMP/c3-nonproduction-http-evidence.json"
      - name: Reverify immutable synthetic runtime evidence
        run: node .github/scripts/c3_nonproduction_external_quality.mjs verify-evidence "$RUNNER_TEMP/c3-nonproduction-http-evidence.json"
      - name: Upload isolated synthetic regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-synthetic-regression-http-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c3-nonproduction-http-evidence.json
          if-no-files-found: warn
          retention-days: 30

  c3-validation-preflight-offline:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight_offline')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_FINAL_SMOKE_AGENT_EMAIL: ${{ secrets.FINAL_SMOKE_AGENT_EMAIL != '' }}
      HAS_FINAL_SMOKE_AGENT_PASSWORD: ${{ secrets.FINAL_SMOKE_AGENT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, clean: true}
      - name: Record exact preflight identity and credential presence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "C3_PREFLIGHT_IDENTITY|head=$(git rev-parse HEAD)|tree=$(git rev-parse HEAD^{tree})"
          echo "C3_CREDENTIAL_PRESENCE|name=SUPABASE_ACCESS_TOKEN|present=$HAS_SUPABASE_ACCESS_TOKEN"
          echo "C3_CREDENTIAL_PRESENCE|name=FINAL_SMOKE_AGENT_EMAIL|present=$HAS_FINAL_SMOKE_AGENT_EMAIL"
          echo "C3_CREDENTIAL_PRESENCE|name=FINAL_SMOKE_AGENT_PASSWORD|present=$HAS_FINAL_SMOKE_AGENT_PASSWORD"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validation evidence, anti-fake, sequencing, cleanup and merge-guard controls
        run: |
          set -euo pipefail
          python -c "import ast,pathlib; ast.parse(pathlib.Path('.github/scripts/c3_validation_only_runner.py').read_text())"
          node .github/scripts/c3_validation_control_tests.mjs
          node .github/scripts/c3_nonproduction_external_quality.mjs verify-dataset
          node .github/scripts/c3_real_customer_dataset.mjs verify-registry
          node .github/scripts/c3_real_customer_dataset.mjs verify-dataset
          node .github/scripts/c3_real_customer_dataset.mjs verify-derived 3a15223c96c3909e014fc095f3bd39256438df02 6dd0af943f9f6bce870eebc16db24c5cc766f6a0
          node .github/scripts/c3_real_customer_dataset.test.mjs
          node .github/scripts/c3_nonproduction_independent_grader.test.mjs
          node .github/scripts/c3_human_blind_calibration.test.mjs
          node .github/scripts/c3_deterministic_runtime_closure.test.mjs
          node .github/scripts/c3_deterministic_fts.test.mjs
          node .github/scripts/c3_deterministic_quality.test.mjs
          node .github/scripts/c3_deterministic_quality.mjs verify-oracle .github/scripts/c3_real_case_derived_dataset_v1.json .github/scripts/c3_deterministic_objective_oracle_v1.json .github/scripts/c3_deterministic_objective_freeze_v1.json
      - name: Production DB security readback preflight (read-only, no fixtures)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validation_only'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python .github/scripts/c3_validation_only_runner.py db-readback \
            --out "$RUNNER_TEMP/c3-db-security-readback" \
            --contract .github/scripts/c3_validation_scenarios.json
      - name: Prove event routing is preflight-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/task-ai-abc-c3-final-gate.yml').read_text()
          start=p.index('\n  c3-validation-only:\n')+1
          end=p.index('\n  c3-validation-cleanup-only:\n',start)
          block=p[start:end]
          assert "github.event_name == 'workflow_dispatch'" in block
          assert "inputs.mode == 'validation_only'" in block
          assert "github.actor == 'ebixsolutions'" in block
          for forbidden in ('functions deploy','db push','migration up','rollback deploy','apply_migration'):
              assert forbidden not in block.lower(), forbidden
          print('C3_VALIDATION_EVENT_ROUTING=PASS')
          PY
      - name: Preflight-only terminal marker
        run: echo 'C3_VALIDATION_PREFLIGHT_OFFLINE=PASS; production_validation=SKIPPED; production_writes=0'

  c3-validation-only:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'validation_only' &&
      github.actor == 'ebixsolutions'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FINAL_SMOKE_AGENT_EMAIL: ${{ secrets.FINAL_SMOKE_AGENT_EMAIL }}
      FINAL_SMOKE_AGENT_PASSWORD: ${{ secrets.FINAL_SMOKE_AGENT_PASSWORD }}
      VITE_SUPABASE_URL: https://nrfxhqabwblzxoushgnm.supabase.co
      VITE_SUPABASE_FUNCTIONS_URL: https://nrfxhqabwblzxoushgnm.supabase.co/functions/v1
      C3_EXPECTED_HEAD: ${{ inputs.expected_head }}
      C3_EXPECTED_TREE: ${{ inputs.expected_tree }}
      C3_ARTIFACT_ID: ${{ inputs.artifact_id }}
      C3_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      C3_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      C3_RELEASE_ID: ${{ inputs.release_id }}
      C3_RELEASE_DIGEST: ${{ inputs.release_digest }}
      C3_DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
      C3_DEPLOYMENT_ATTEMPT: ${{ inputs.deployment_attempt }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, clean: true}
      - name: Guard exact validation-only authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = ebixsolutions/console-chat-hub
          test "${{ github.ref_name }}" = director/ai-abc-c3-long-memory-final-cutover
          test "$(git rev-parse HEAD)" = "$C3_EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$C3_EXPECTED_TREE"
          test "${{ inputs.validation_authorization }}" = "c3-validation-$C3_EXPECTED_HEAD-$C3_EXPECTED_TREE-$C3_RELEASE_ID"
          test -n "$C3_DEPLOYMENT_RUN_ID"
          test -n "$C3_RELEASE_ID"
          test -n "$C3_RELEASE_DIGEST"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${FINAL_SMOKE_AGENT_EMAIL:-}"
          test -n "${FINAL_SMOKE_AGENT_PASSWORD:-}"
          test -n "$C3_ARTIFACT_ID"
          test "$C3_ARTIFACT_RUN_ID" = "$C3_DEPLOYMENT_RUN_ID"
          test -n "$C3_ARTIFACT_DIGEST"
          echo C3_VALIDATION_ONLY_AUTHORIZATION=PASS
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.9.6}
      - uses: supabase/setup-cli@v1
        with: {version: '2.117.0'}
      - run: npm ci
      - name: Bind durable artifact inputs to GitHub artifact metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          artifact_id=os.environ['C3_ARTIFACT_ID']; repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          request=urllib.request.Request(
            f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}',
            headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'c3-validation-only/1.0'})
          artifact=json.load(urllib.request.urlopen(request))
          assert artifact['id']==int(artifact_id)
          assert artifact['name']==os.environ['C3_CAPTURE_NAME']
          assert artifact.get('expired') is False
          assert str(artifact.get('workflow_run',{}).get('id'))=='${{ inputs.artifact_run_id }}'
          assert artifact.get('digest')==os.environ['C3_ARTIFACT_DIGEST']
          print(f'C3_VALIDATION_ARTIFACT_IDENTITY|id={artifact_id}|digest={artifact["digest"]}|run_id=${{ inputs.artifact_run_id }}|result=PASS')
          PY
      - name: Download exact durable baseline outside checkout
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.C3_CAPTURE_NAME }}
          path: ${{ runner.temp }}/c3-validation-baseline
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify durable baseline before fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/c3-validation-baseline" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); cap=json.loads((root/'CAPTURE.json').read_text())
          assert cap['project']=='nrfxhqabwblzxoushgnm'
          for fn,count in {'generate-reply':47,'agent-assist':22}.items():
            m=json.loads((root/fn/'MANIFEST.json').read_text()); src=root/fn/'supabase/functions'
            exp={x['path']:x['sha256'] for x in m['files']}; act={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in src.rglob('*') if p.is_file()}
            assert len(exp)==count and exp==act
          print('C3_VALIDATION_DURABLE_BASELINE=PASS')
          PY
      - name: Download and authorize exact durable release identity
        uses: actions/download-artifact@v4
        with:
          name: C3-release-identity-${{ inputs.expected_head }}
          path: ${{ runner.temp }}/c3-release-identity
          github-token: ${{ github.token }}
          run-id: ${{ inputs.deployment_run_id }}
      - name: Bind validation child to parent deployment and actual target
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/c3_release_identity.mjs authorize-validation \
            --release "$RUNNER_TEMP/c3-release-identity/RELEASE.json" \
            --head "$C3_EXPECTED_HEAD" --tree "$C3_EXPECTED_TREE" \
            --deployment-run-id "$C3_DEPLOYMENT_RUN_ID" \
            --deployment-attempt "$C3_DEPLOYMENT_ATTEMPT" \
            --release-id "$C3_RELEASE_ID" --release-digest "$C3_RELEASE_DIGEST" \
            --authorization "${{ inputs.validation_authorization }}"
          python - "$RUNNER_TEMP/c3-release-identity/RELEASE.json" <<'PY'
          import json,os,sys
          release=json.load(open(sys.argv[1])); baseline=release['baseline']
          assert str(baseline['artifact_id'])==os.environ['C3_ARTIFACT_ID']
          assert baseline['artifact_digest']==os.environ['C3_ARTIFACT_DIGEST']
          assert str(baseline['artifact_run_id'])==os.environ['C3_ARTIFACT_RUN_ID']
          print('C3_VALIDATION_BASELINE_RELEASE_BINDING=PASS')
          PY
      - name: Run existing-live validation only
        id: live_validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python .github/scripts/c3_validation_only_runner.py validate \
            --out "$RUNNER_TEMP/c3-validation-evidence" \
            --contract .github/scripts/c3_validation_scenarios.json \
            --artifact-root "$RUNNER_TEMP/c3-validation-baseline" \
            --release-root "$RUNNER_TEMP/c3-release-identity"
      - name: Verify deterministic quality closure is ready for independent human review
        if: always() && steps.live_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/c3-validation-evidence/evidence.json"
          python - "$E" <<'PY'
          import json,os,sys
          e=json.load(open(sys.argv[1])); q=e.get('machine_quality') or {}; long=e.get('long_run') or {}; cleanup=e.get('cleanup') or {}
          assert e['runner']=={'head':os.environ['C3_EXPECTED_HEAD'],'tree':os.environ['C3_EXPECTED_TREE']}
          assert q.get('schema_version')=='c3-deterministic-machine-quality-1.0.0'
          assert q.get('status')=='PASS' and q.get('subjective_quality_status')=='AWAITING_INDEPENDENT_HUMAN_REVIEW'
          metrics=q.get('metrics') or {}
          assert q.get('sample_count',0)>=100
          assert metrics.get('p0_count')==metrics.get('known_answer_dead_end')==metrics.get('unnecessary_reask')==0
          assert metrics.get('fallback_denominator')==q.get('sample_count') and metrics.get('fallback_rate')==metrics.get('fallback_count')/metrics.get('fallback_denominator')
          assert metrics['fallback_rate'] < .05
          assert all(k not in q for k in ('dimension_averages','weighted_score','scores','grader_provenance'))
          preparation=q.get('human_review_preparation') or {}
          assert preparation.get('status')=='AWAITING_INDEPENDENT_HUMAN_REVIEW' and preparation.get('sample_count')==20 and preparation.get('minimum_independent_reviewers')==2
          assert len(preparation.get('samples') or [])==20 and all(len(row.get('context_sha256',''))==len(row.get('response_sha256',''))==64 for row in preparation['samples'])
          assert long.get('transport_successes',0)>=100 and long.get('semantic_correct')==long.get('semantic_total')==15
          assert cleanup.get('completed') is True and cleanup.get('safely_deletable_residue')==0
          print('C3_DETERMINISTIC_QUALITY_GATE|result=PASS|subjective=AWAITING_INDEPENDENT_HUMAN_REVIEW|next=human_calibration')
          PY
      - name: Upload fixture manifest and evidence for cleanup recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C3-validation-production-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/c3-validation-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Validation-only result
        if: always()
        run: test '${{ steps.live_validation.outcome }}' = success

  c3-evidence-finalize:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'evidence_finalize' &&
      github.actor == 'ebixsolutions'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0, clean: true}
      - name: Guard exact evidence finalization authority
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = director/ai-abc-c3-long-memory-final-cutover
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_head }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.expected_tree }}"
          test "${{ inputs.finalization_authorization }}" = "c3-evidence-finalize-${{ inputs.expected_head }}-${{ inputs.expected_tree }}-${{ inputs.release_id }}-${{ inputs.validation_run_id }}"
          for value in '${{ inputs.validation_run_id }}' '${{ inputs.validation_artifact_identity }}' '${{ inputs.human_artifact_identity }}'; do test -n "$value"; done
          echo C3_EVIDENCE_FINALIZATION_AUTHORIZATION=PASS
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.9.6}
      - run: npm ci
      - name: Validate external artifact metadata
        id: artifact_identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUMAN_SPEC: ${{ inputs.human_artifact_identity }}
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          VALIDATION_SPEC: ${{ inputs.validation_artifact_identity }}
          VALIDATION_RUN: ${{ inputs.validation_run_id }}
