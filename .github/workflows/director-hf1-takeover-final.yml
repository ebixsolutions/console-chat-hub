name: Director HF-1 Takeover Final
on:
  push:
    paths:
      - '.github/workflows/director-hf1-takeover-final.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Execute corrected Director takeover patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          src = Path('.github/workflows/director-hf1-takeover.yml').read_text()
          old = 'let i=deriveHandoffDecisionInput(rows(["現在我要真人客服"]),"現在我要真人客服",["order_reference"],{explicit_human_request:true});'
          new = 'let i=deriveHandoffDecisionInput(rows(["可以幫我轉真人客服嗎？"]),"可以幫我轉真人客服嗎？",["order_reference"],{explicit_human_request:true});'
          if old not in src:
              raise SystemExit('HF1_ORACLE_ANCHOR_MISSING')
          src = src.replace(old, new, 1)
          m = re.search(r"python3 - <<'PY'\n(.*?)\n\s+PY\n\s+- name: HF-1 deterministic assertions", src, re.S)
          if not m:
              raise SystemExit('HF1_PATCH_BLOCK_MISSING')
          code = textwrap.dedent(m.group(1))
          exec(compile(code, '<hf1-director-patch>', 'exec'), {'__name__':'__main__'})
          print('HF1_CORRECTED_DIRECTOR_PATCH=PASS')
          PY
      - name: Deterministic HF-1 semantics
        run: |
          set -euo pipefail
          node --experimental-strip-types supabase/functions/_shared/task1-closure-handoff.test.ts
      - name: HF-1 source contract
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "tanstack_start_ts"
          node -e "const p=require('./package.json'); if(p.private!==true) process.exit(1)"
          grep -q 'handoff_mode' supabase/functions/_shared/handoff-decision.ts
          grep -q 'handoff_priority' supabase/functions/_shared/handoff-decision.ts
          grep -q 'missing_info_policy' supabase/functions/_shared/handoff-decision.ts
          grep -q 'reason_codes' supabase/functions/_shared/handoff-decision.ts
          grep -q 'optional_clarification_then_handoff' supabase/functions/generate-reply/index.ts
          grep -q 'conversation_closure' supabase/functions/generate-reply/index.ts
          grep -q 'missing_fact_not_closure' supabase/functions/_shared/conversation-closure.ts
          git diff --check
          echo HF1_SOURCE_CONTRACT=PASS
      - name: Deno Edge compile
        run: |
          set -euo pipefail
          deno check supabase/functions/generate-reply/index.ts
          echo HF1_DENO_COMPILE=PASS
      - name: Production-authoritative app build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo HF1_BUILD=PASS
      - name: Commit complete HF-1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/handoff-decision.ts \
            supabase/functions/_shared/conversation-closure.ts \
            supabase/functions/_shared/warm-handoff.ts \
            supabase/functions/_shared/task1-closure-handoff.test.ts \
            supabase/functions/generate-reply/index.ts
          git diff --cached --quiet && { echo 'HF1_NO_SOURCE_DIFF'; exit 1; }
          git commit -m "Director takeover: implement HF-1 intelligent closure and handoff decision"
          git push origin HEAD:main
          echo HF1_SOURCE_COMMIT=PASS
      - name: Final markers
        run: |
          echo HF1_DIRECTOR_TAKEOVER_FINAL_GATE=PASS
          echo HF1_SOURCE_IMPLEMENTATION=READY
