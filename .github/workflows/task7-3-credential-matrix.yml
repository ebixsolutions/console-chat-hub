name: Task 7.3 Credential Matrix
on:
  push:
    branches: [task7-3-production-acceptance]
    paths: [.github/workflows/task7-3-credential-matrix.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - shell: bash
        run: |
          set -euo pipefail
          B=https://nrfxhqabwblzxoushgnm.supabase.co
          supabase projects api-keys --project-ref nrfxhqabwblzxoushgnm -o json >/tmp/k.json; chmod 600 /tmp/k.json
          S="$(jq -r '[.[]|select(((.api_key//.key//.value//"")|startswith("sb_secret_")))|(.api_key//.key//.value)][0]//empty' /tmp/k.json)"
          P="$(jq -r '[.[]|select(((.api_key//.key//.value//"")|startswith("sb_publishable_")))|(.api_key//.key//.value)][0]//empty' /tmp/k.json)"
          J="$(jq -r '[.[]|select((.name//"")|ascii_downcase=="service_role")|(.api_key//.key//.value)][0]//empty' /tmp/k.json)"
          A="$(jq -r '[.[]|select((.name//"")|ascii_downcase=="anon")|(.api_key//.key//.value)][0]//empty' /tmp/k.json)"
          for x in S P J A; do v="${!x:-}"; [[ -z "$v" ]] || echo "::add-mask::$v"; done
          probe(){ local n="$1"; shift; local c; c="$(curl -sS -o /dev/null -w '%{http_code}' "$B/rest/v1/conversations?select=id&limit=1" "$@")"; echo "$n=$c"; }
          probe SECRET_APIKEY -H "apikey: $S"
          probe SECRET_BEARER -H "apikey: $S" -H "Authorization: Bearer $S"
          probe PUB_SERVICEJWT -H "apikey: ${P:-$A}" -H "Authorization: Bearer $J"
          probe SERVICEJWT_BOTH -H "apikey: $J" -H "Authorization: Bearer $J"
