name: Task 6.3 Authorized Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task6-3-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'EXTERNAL_BLOCKER: SUPABASE_ACCESS_TOKEN missing' >&2
            exit 78
          fi
          echo 'TASK6_3_DEPLOY_CREDENTIAL=PASS'
      - name: Verify authoritative source hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object supabase/functions/generate-reply/index.ts)" = "0cf21f6f3949974ee227c12cd00e8fcb0274bbe0"
          test "$(git hash-object supabase/functions/ce-evaluation-worker/index.ts)" = "85230c4af3592f169a7684d1899175a7ea543ffc"
          test "$(git hash-object supabase/functions/_shared/runtime-signal-lifecycle.ts)" = "ee4fc601a90f459d89df8c7e3fbee14189a789ed"
          test "$(git hash-object supabase/migrations/20260901062000_task6_2_realtime_ce_dispatch.sql)" = "423e8b672fd7999a3fee76f5d3c91a71cd7312fc"
          echo 'TASK6_3_DEPLOY_SOURCE_HASHES=PASS'
      - name: Deploy generate-reply
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy generate-reply --project-ref "$PROJECT_REF"
      - name: Deploy ce-evaluation-worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy ce-evaluation-worker --project-ref "$PROJECT_REF"
      - name: Deployment command closure
        run: echo 'TASK6_3_EDGE_DEPLOY=PASS'
