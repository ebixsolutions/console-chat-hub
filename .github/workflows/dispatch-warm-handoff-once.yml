name: Dispatch Warm Handoff Implementation Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-warm-handoff-once.yml'
permissions:
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Director takeover implementation and final gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          python scripts/director-warm-handoff-takeover.py
          deno test --allow-read tests/edge/warm-handoff-package.test.ts
          deno test --allow-read --allow-env --node-modules-dir=auto tests/edge/task2-human-language-transform-regression.test.ts
          deno test --allow-read --allow-env --node-modules-dir=auto tests/edge/task2-standalone-simplify-regression.test.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/warm-handoff.ts
          deno check --node-modules-dir=auto supabase/functions/agent-assist/index.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          npm ci
          npm run build
          git diff --check
          python - <<'PY'
          from pathlib import Path
          a=Path('supabase/functions/agent-assist/index.ts').read_text()
          g=Path('supabase/functions/generate-reply/index.ts').read_text()
          u=Path('src/components/console/AgentToolPanel.tsx').read_text()
          r=Path('src/routes/_authenticated/console.conversations.$id.tsx').read_text()
          w=Path('supabase/functions/_shared/warm-handoff.ts').read_text()
          assert 'toolType==="handoff_context"' in a
          assert 'response_route: "warm_handoff_data_collection"' in g
          assert 'warm_handoff_question: _warmHandoffQuestion' in g
          assert 'decision.decision === "handoff" && decision.matched_rule === "R2"' in g
          assert 'Warm Handoff Context / 真人接手摘要' in u
          assert 'tool_type: "handoff_context"' in u
          assert 'autoLoadHandoffContext={conv.status === "pending" || Boolean(conv.assigned_agent_id)}' in r
          assert 'plain order' not in w
          assert '訂單(?:編號|號碼|号码)' in w
          print('WARM_HANDOFF_MACHINE_COVERAGE=PASS')
          PY
          git add supabase/functions/_shared/warm-handoff.ts supabase/functions/agent-assist/index.ts supabase/functions/generate-reply/index.ts src/components/console/AgentToolPanel.tsx 'src/routes/_authenticated/console.conversations.$id.tsx' tests/edge/warm-handoff-package.test.ts
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "6"
          git commit -m '[director] complete warm handoff package and takeover context panel'
          git push origin HEAD:main
          echo WARM_HANDOFF_IMPLEMENTATION_FINAL_GATE=PASS
