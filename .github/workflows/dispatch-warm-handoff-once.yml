name: Dispatch Warm Handoff Implementation Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-warm-handoff-once.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch implementation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo round2-final
          gh workflow run director-warm-handoff-context-panel.yml --repo ebixsolutions/console-chat-hub --ref main
