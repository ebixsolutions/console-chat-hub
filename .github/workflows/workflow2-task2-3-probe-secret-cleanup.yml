name: Workflow2 Task2.3 Probe Secret Cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/workflow2-task2-3-probe-secret-cleanup.yml']
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary probe secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@latest secrets unset --project-ref "$PROJECT_REF" TASK2_3_PROBE_TOKEN
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" --output json >/tmp/secrets.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/secrets.json'))
          names={str(r.get('name') or '') for r in rows}
          assert 'TASK2_3_PROBE_TOKEN' not in names
          print('TASK2_3_PROBE_SECRET_CLEANUP=PASS')
          PY
