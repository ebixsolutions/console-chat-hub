name: Director Task 6.2 - Human-like Empathy Reply Strategy
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/emotion-reply-strategy.ts'
      - 'tests/edge/emotion-reply-strategy.test.ts'
      - 'scripts/director-task6-2-wire-emotion-reply-strategy.py'
      - '.github/workflows/director-task6-2-empathy-reply-strategy.yml'
concurrency:
  group: director-task6-2-empathy-reply-strategy
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Apply exact Task 6.2 wiring
        run: python scripts/director-task6-2-wire-emotion-reply-strategy.py
      - name: Source contract assertions
        run: |
          set -euo pipefail
          grep -q 'buildEmotionReplyStrategyContext' supabase/functions/generate-reply/index.ts
          grep -q '_emotionReplyStrategyBlock' supabase/functions/generate-reply/index.ts
          grep -q 'emotion_kind: _pr5R3Sentiment?.emotion_kind' supabase/functions/generate-reply/index.ts
          grep -q 'Emotion alone never authorizes' supabase/functions/_shared/emotion-reply-strategy.ts
          echo 'TASK6_2_SOURCE_CONTRACT=PASS'
      - name: Task 6.2 strategy tests
        run: deno test --no-lock --allow-env tests/edge/emotion-reply-strategy.test.ts
      - name: Task 6.1 classifier regression
        run: deno test --no-lock --allow-env tests/edge/runtime-signal-multi-emotion.test.ts
      - name: Frozen escalation and control regressions
        run: |
          deno test --no-lock --allow-env tests/edge/e2-direct-threat.test.ts
          deno test --no-lock --allow-env tests/edge/warm-handoff-package.test.ts
          deno test --no-lock --allow-env tests/edge/return-to-ai-control-context.test.ts
      - name: Compile changed runtime and generate-reply
        run: |
          deno check --no-lock --node-modules-dir=auto supabase/functions/_shared/emotion-reply-strategy.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/generate-reply/index.ts
      - name: Full application build
        run: npm run build
      - name: Restore validation-generated tracked drift
        run: git restore -- deno.lock package-lock.json src/routeTree.gen.ts || true
      - name: Diff safety and exact functional scope
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'supabase/functions/generate-reply/index.ts'}
          assert changed == expected, {'expected': sorted(expected), 'actual': sorted(changed)}
          print('TASK6_2_CHANGED_FILES_EXACT=PASS')
          PY
      - name: Commit functional wiring to main
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          git add supabase/functions/generate-reply/index.ts
          git commit -m '[director] wire differentiated emotion reply strategy'
          git push origin HEAD:main
          echo "TASK6_2_FUNCTIONAL_COMMIT=$(git rev-parse HEAD)"
          echo 'TASK6_2_FINAL_GATE=PASS'
