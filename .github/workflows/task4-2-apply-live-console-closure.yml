name: Task 4.2 Apply Live Console Closure

on:
  push:
    branches: [main]
    paths:
      - 'scripts/task4-2-live-console-closure.py'
      - '.github/workflows/task4-2-apply-live-console-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact Task 4.2 source closure
        run: python scripts/task4-2-live-console-closure.py
      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Waiting for Human' src/routes/_authenticated/console.conversations.index.tsx
          grep -q 'closure_checklist_required' supabase/functions/return-to-ai/index.ts
          grep -q 'knowledge_helper' supabase/functions/agent-assist/index.ts
          grep -q 'Knowledge Helper' src/components/console/AgentToolPanel.tsx
          grep -q 'Policy Check' src/components/console/AgentToolPanel.tsx
          if grep -q 'runTool("suggest_reply")' src/components/console/AgentToolPanel.tsx; then
            echo 'FAIL: Live Console still exposes suggest_reply' >&2
            exit 1
          fi
          echo 'TASK4_2_SOURCE_INVARIANTS=PASS'
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No source changes required'
            exit 0
          fi
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          git add \
            src/routes/_authenticated/console.conversations.index.tsx \
            src/components/console/AgentToolPanel.tsx \
            supabase/functions/agent-assist/index.ts \
            supabase/functions/return-to-ai/index.ts
          git commit -m 'Task 4.2: close human handoff queue experience'
          git push origin HEAD:main
