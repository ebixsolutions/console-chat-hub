name: Round2 Task2 Grounding Transform Boundary

on:
  push:
    branches:
      - director/round2-task2-grounding-transform-boundary
    paths:
      - .github/workflows/round2-task2-grounding-transform-boundary.yml
      - scripts/round2-task2-apply.py
      - supabase/functions/_shared/prior-grounded-transform.ts
      - tests/edge/round2-task2-grounding-transform-boundary.test.ts
      - supabase/functions/_shared/llm-router.ts
      - supabase/functions/generate-reply/index.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task2-final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/round2-task2-grounding-transform-boundary
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Apply Task 2 runtime integration
        run: |
          set -euo pipefail
          python scripts/round2-task2-apply.py
          git diff --check

      - name: Compile affected runtime
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/_shared/prior-grounded-transform.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/llm-router.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          echo TASK2_RUNTIME_COMPILE=PASS

      - name: Run Task 2 grounding transform regressions
        run: |
          set -euo pipefail
          deno test --allow-env --node-modules-dir=auto tests/edge/round2-task2-grounding-transform-boundary.test.ts
          echo TASK2_TRANSFORM_TESTS=PASS

      - name: Run frozen semantic and grounding regressions
        run: |
          set -euo pipefail
          deno test --allow-env --node-modules-dir=auto tests/edge/round2-task1-conversation-semantic-contract.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-2-output-grounding-router.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-3-citation-lineage.test.ts
          echo TASK2_FROZEN_REGRESSION=PASS

      - name: Machine assertions
        run: |
          set -euo pipefail
          grep -q 'PRIOR_GROUNDED_ANSWER' supabase/functions/_shared/prior-grounded-transform.ts
          grep -q 'Prior Grounded Answer Evidence' supabase/functions/_shared/llm-router.ts
          grep -q '_pr5GreetingOrTrivial || Boolean(_priorGroundedTransform)' supabase/functions/generate-reply/index.ts
          grep -q 'buildInheritedTransformCitationMetadata(_priorGroundedTransform)' supabase/functions/generate-reply/index.ts
          grep -q 'buildPriorGroundedTransformBlock(_priorGroundedTransform)' supabase/functions/generate-reply/index.ts
          python - <<'PY'
          from pathlib import Path
          s = Path('supabase/functions/generate-reply/index.ts').read_text()
          resolve = s.index('const _priorGroundedTransform = resolvePriorGroundedTransform(')
          skip = s.index('const _g1SkipKB = _pr5GreetingOrTrivial || Boolean(_priorGroundedTransform);', resolve)
          kb = s.index('if (flags.ENABLE_KB && !_g1SkipKB)', skip)
          done = s.index('if (!flags.ENABLE_KB || _g1SkipKB) _kbDone = true;', kb)
          prompt = s.index('buildPriorGroundedTransformBlock(_priorGroundedTransform)', done)
          citation = s.index('buildInheritedTransformCitationMetadata(_priorGroundedTransform)', prompt)
          assert resolve < skip < kb < done < prompt < citation
          assert 'fetchKBRag(' not in s[resolve:skip], 'transform authority resolution must not retrieve KB'
          assert 'fetchKBRag(' not in s[done:citation], 'transform prompt/citation path must not retrieve KB'
          # The Task 2 patch must not create any transform-specific second retrieval.
          patch = Path('scripts/round2-task2-apply.py').read_text()
          assert 'fetchKBRag(' not in patch, 'Task 2 patch must not add a KB retrieval call'
          print('TASK2_MACHINE_ASSERTIONS=PASS')
          PY

      - name: Full authoritative build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo TASK2_FULL_BUILD=PASS

      - name: Commit validated Task 2 source
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add supabase/functions/_shared/llm-router.ts supabase/functions/generate-reply/index.ts
            git commit -m 'Complete Round 2 Task 2 grounded transform boundary'
            git push origin HEAD:director/round2-task2-grounding-transform-boundary
          fi
          echo TASK2_FINAL_GATE=PASS
