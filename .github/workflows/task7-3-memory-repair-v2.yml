name: Task 7.3 Long-Range Memory Repair v2
on:
  push:
    branches: [task7-3-production-acceptance]
    paths: [.github/workflows/task7-3-memory-repair-v2.yml]
jobs:
  repair-validate-publish:
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
    steps:
      - uses: actions/checkout@v4
        with: { ref: c133a1e91ffb5a4716fb56b9d3000d4ffd7dc20b, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Apply prior-only memory repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/_shared/conversation-runtime-state.ts'); s=p.read_text()
          old='const CORRECTION = /(我講錯|我说错|我說錯|更正|其實係|其实是|唔係.*係|不是.*是|改返|改成|actually|i meant|correction|not .* but )/i;'
          new='const CORRECTION = /(我講錯|我说错|我說錯|我要更正|我想更正|更正一下[：:]?|更正[：:]|其實係|其实是|唔係.*係|不是.*是|改返|改成|actually[,\\s]+i meant|i meant|correction\\s*[:：]|not .+ but .+)/i;'
          assert old in s; s=s.replace(old,new)
          marker='export function buildCanonicalRetrievalQuery(\n'; assert marker in s
          block=r'''export function resolveConversationMemoryResponse(
            latestInput: string,
            newestFirst: RuntimeHistoryRow[],
          ): string | null {
            const latest = clean(latestInput);
            if (!latest) return null;
            if (/(請記住|请记住|please\s+remember|remember\s+that)/i.test(latest)) return null;

            // Memory answers are derived from PRIOR turns only. The current
            // recall request must never become its own correction/constraint/name.
            let currentRemoved = false;
            const priorRows = newestFirst.filter((row) => {
              const role = String(row.role ?? "").toLowerCase();
              const text = clean(row.content);
              if (!currentRemoved && CUSTOMER.has(role) && text === latest) {
                currentRemoved = true;
                return false;
              }
              return true;
            });
            const state = projectConversationRuntimeState(priorRows);
            const lang = detectLanguage(latest);
            const firstRequest = /(一開始|一开始|第一個問題|第一个问题|最初).*(問|問題|问题)|what\s+(?:did\s+i\s+ask|was\s+(?:my\s+)?first)|first\s+(?:question|thing\s+i\s+asked)/i.test(latest);
            const correctionRequest = /(之前|先前|剛才|刚才|earlier|previous).*(更正|改正|correct)|更正後|更正后|what\s+did\s+i\s+correct|latest\s+correction/i.test(latest);
            const constraintRequest = /(限制|約束|约束|不要猜|唔好估|constraint|restriction|what.*(?:told|asked).*(?:not|don.?t))/i.test(latest) && /(記得|记得|總結|总结|告訴|告诉|什麼|什么|what|recall|remember|summari)/i.test(latest);
            const summaryRequest = /(總結|总结|summari[sz]e).*(記得|记得|更正|限制|constraint|correction|remember)/i.test(latest);
            const recommendationRequest = /(之前|先前|剛才|刚才|earlier|previous).*(建議|建议|recommend|suggest)|what\s+did\s+you\s+(?:recommend|suggest)/i.test(latest);
            const nameRequest = /(我叫什麼|我叫什么|我的名字|我個名|我个名|what(?:'s| is)\s+my\s+name|do\s+you\s+remember\s+my\s+name)/i.test(latest);
            const locationRequest = /(我(?:現在|现在|目前).*(?:哪裡|哪里)|我.*(?:在哪|喺邊)|where\s+am\s+i|my\s+(?:current\s+)?location|更正後.*(?:地點|地点)|更正后.*(?:地點|地点))/i.test(latest);
            if (!(firstRequest || correctionRequest || constraintRequest || summaryRequest || recommendationRequest || nameRequest || locationRequest)) return null;

            const zh = lang !== "en";
            const q = lang === "zh-CN" ? { first:"你一开始问的是", correction:"你之前最新的更正是", constraint:"你之前明确提出的限制包括", recommendation:"我之前的相关建议包括", name:"你之前告诉我你的名字是", location:"你之前更正后的地点是", none:"这段对话里没有足够资料可以确认。" } : { first:"你一開始問的是", correction:"你之前最新的更正是", constraint:"你之前明確提出的限制包括", recommendation:"我之前的相關建議包括", name:"你之前告訴我你的名字是", location:"你之前更正後的地點是", none:"這段對話裡沒有足夠資料可以確認。" };
            const en = { first:"Your first question was", correction:"Your latest correction was", constraint:"The constraints you explicitly gave me include", recommendation:"My relevant earlier recommendations include", name:"You told me your name is", location:"The location from your latest correction is", none:"There is not enough information in this conversation to confirm that." };
            const t = zh ? q : en;
            const quote = (v: string) => zh ? `「${v}」` : `“${v}”`;
            const list = (xs: string[]) => xs.map((x, i) => `${i + 1}. ${x}`).join("\n");
            if (summaryRequest) {
              const parts: string[] = [];
              if (state.latest_corrections.length) parts.push(`${t.correction}：\n${list(state.latest_corrections.slice(0, 3))}`);
              if (state.active_constraints.length) parts.push(`${t.constraint}：\n${list(state.active_constraints.slice(0, 5))}`);
              return parts.length ? parts.join("\n\n").slice(0, 1800) : t.none;
            }
            if (firstRequest) return state.first_customer_turn ? `${t.first} ${quote(state.first_customer_turn)}` : t.none;
            if (correctionRequest) return state.latest_corrections[0] ? `${t.correction} ${quote(state.latest_corrections[0])}` : t.none;
            if (constraintRequest) return state.active_constraints.length ? `${t.constraint}：\n${list(state.active_constraints.slice(0, 5))}` : t.none;
            if (recommendationRequest) return state.prior_recommendations.length ? `${t.recommendation}：\n${list(state.prior_recommendations.slice(0, 3))}` : t.none;
            if (nameRequest) {
              const customerTexts = priorRows.filter((r) => CUSTOMER.has(String(r.role ?? "").toLowerCase())).map((r) => clean(r.content));
              const named = customerTexts.find((x) => /^我叫\s*[^，。,.!?！？]{1,40}/.test(x));
              const m = named?.match(/^我叫\s*([^，。,.!?！？]{1,40})/);
              return m?.[1] ? `${t.name} ${quote(m[1].replace(/(?:請|请)?記住.*$/,'').trim())}` : t.none;
            }
            if (locationRequest) {
              const corrected = state.latest_corrections.map((x) => detectExplicitJurisdiction(x)).find(Boolean) ?? null;
              const label: Record<string, Record<RuntimeLanguage,string>> = {
                hong_kong:{"zh-TW":"香港","zh-CN":"香港",en:"Hong Kong"}, macau:{"zh-TW":"澳門","zh-CN":"澳门",en:"Macau"}, singapore:{"zh-TW":"新加坡","zh-CN":"新加坡",en:"Singapore"}, taiwan:{"zh-TW":"台灣","zh-CN":"台湾",en:"Taiwan"}, mainland_china:{"zh-TW":"中國大陸","zh-CN":"中国大陆",en:"Mainland China"}, mars:{"zh-TW":"火星","zh-CN":"火星",en:"Mars"}
              };
              const value = corrected ? label[corrected]?.[lang] : undefined;
              return value ? `${t.location} ${value}` : t.none;
            }
            return null;
          }

          '''
          s=s.replace(marker,block+marker); p.write_text(s)
          g=Path('supabase/functions/generate-reply/index.ts'); x=g.read_text()
          oldimport='import { buildCanonicalRetrievalQuery, buildCanonicalContinuityBlock } from "../_shared/conversation-runtime-state.ts";'; assert oldimport in x
          x=x.replace(oldimport,'import { buildCanonicalRetrievalQuery, buildCanonicalContinuityBlock, resolveConversationMemoryResponse } from "../_shared/conversation-runtime-state.ts";')
          anchor='  const _g1SkipKB = _pr5GreetingOrTrivial;\n'; assert anchor in x
          memory='''  const _conversationMemoryReply = resolveConversationMemoryResponse(_h1LastMsg, _pr5HistoryRows ?? []);\n  if (_conversationMemoryReply) {\n    const committed = await commitAiReplyWithControlGate(supabaseAdmin, conversation_id, source_message_id, _conversationMemoryReply, { response_route: "conversation_memory", conversation_grounded: true });\n    await cleanupThinking(supabaseAdmin, conversation_id, source_message_id);\n    if (!committed.ok) {\n      if (committed.result === "human_control" || committed.result === "resolved" || committed.result === "superseded_source") return new Response(JSON.stringify({ success: true, skipped: committed.result }), { headers: { ...corsHeaders, "Content-Type": "application/json" } });\n      return new Response(JSON.stringify({ success: false, error: `conversation_memory_commit_${committed.result}` }), { status: 409, headers: { ...corsHeaders, "Content-Type": "application/json" } });\n    }\n    return new Response(JSON.stringify({ success: true, response_route: "conversation_memory", conversation_grounded: true }), { headers: { ...corsHeaders, "Content-Type": "application/json" } });\n  }\n\n'''
          x=x.replace(anchor,memory+anchor); g.write_text(x)
      - name: Install
        run: npm ci
      - name: Prior-only same-class regression
        shell: bash
        run: |
          cat >/tmp/memory.test.ts <<'EOF'
          import assert from 'node:assert/strict'; import {projectConversationRuntimeState,resolveConversationMemoryResponse} from '${{ github.workspace }}/supabase/functions/_shared/conversation-runtime-state.ts';
          const h=(latest:string,prior:string[])=>[{role:'visitor',content:latest},...prior.map(content=>({role:'visitor',content}))]; const fillers=Array.from({length:14},(_,i)=>`中間對話 ${i+1}`);
          let r=h('請再次告訴我之前更正後的地點。',[...fillers,'我講錯，我其實在澳門。','我在香港。','什么是四電一腦？']); assert.equal(projectConversationRuntimeState(r).latest_corrections[0],'我講錯，我其實在澳門。'); assert.match(resolveConversationMemoryResponse(r[0].content!,r)!,/澳門/);
          r=h('最後一題：我最初問的是什麼？',[...fillers,'我講錯，我其實在澳門。','什么是四電一腦？']); assert.match(resolveConversationMemoryResponse(r[0].content!,r)!,/四電一腦/);
          r=h('請總結目前你記得的更正與限制，不要新增資料。',['不要猜任何產品型號。','我講錯，我其實在澳門。','我在香港。']); const s=resolveConversationMemoryResponse(r[0].content!,r)!; assert.match(s,/澳門/); assert.match(s,/型號/); assert.doesNotMatch(s,/不要新增資料/);
          r=h('我現在在哪裡？',['如果我在火星呢？','我講錯，我其實在澳門。','我在香港。']); assert.match(resolveConversationMemoryResponse(r[0].content!,r)!,/澳門/);
          r=h('我叫什麼名字？',['我叫測試甲，請記住。']); assert.match(resolveConversationMemoryResponse(r[0].content!,r)!,/測試甲/); assert.doesNotMatch(resolveConversationMemoryResponse(r[0].content!,r)!,/什麼名字/);
          r=h('請記住我不要你猜型號。',['我講錯，我其實在澳門。']); assert.equal(resolveConversationMemoryResponse(r[0].content!,r),null);
          r=h('我講錯，我其實在澳門。',['我在香港。']); assert.equal(resolveConversationMemoryResponse(r[0].content!,r),null);
          r=[{role:'visitor',content:'What was my first question?'},{role:'assistant',content:'Earlier recommendation: provide details.'},{role:'visitor',content:'First topic please'}]; assert.match(resolveConversationMemoryResponse(r[0].content!,r)!,/First topic please/);
          console.log('TASK7_3_PRIOR_ONLY_MEMORY=PASS');
          EOF
          node --experimental-strip-types /tmp/memory.test.ts
          grep -q 'resolveConversationMemoryResponse(_h1LastMsg, _pr5HistoryRows' supabase/functions/generate-reply/index.ts
      - name: Frozen Task 7.1 regression
        run: node tests/task7-1-canonical-runtime.test.mjs
      - name: Compile and build
        run: npx tsc --noEmit && npm run build
      - name: Scope guard
        shell: bash
        run: |
          git checkout -- src/routeTree.gen.ts
          mapfile -t f < <(git diff --name-only|sort); printf '%s\n' "${f[@]}"
          test "${#f[@]}" -eq 2; [[ " ${f[*]} " == *" supabase/functions/_shared/conversation-runtime-state.ts "* ]]; [[ " ${f[*]} " == *" supabase/functions/generate-reply/index.ts "* ]]
      - name: Publish validated source and deploy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/conversation-runtime-state.ts supabase/functions/generate-reply/index.ts
          git commit -m 'Fix Task 7.3 long-range conversation memory'
          git push origin HEAD:main
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          supabase functions deploy generate-reply --project-ref "$PROJECT_REF"
      - name: Conclusion
        run: echo TASK7_3_LONG_RANGE_MEMORY_REPAIR=PASS
