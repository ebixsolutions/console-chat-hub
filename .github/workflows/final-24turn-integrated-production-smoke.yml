name: Final 24-Turn Integrated Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-24turn-integrated-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_ORIGIN: https://console-chat-hub.lovable.app
      CHANNEL_ID: b0000000-0000-0000-0000-000000000001
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run authenticated stateful T01-T24 final gate
        shell: bash
        run: |
          set -euo pipefail
          set -a; source .env; set +a
          BASE="${VITE_SUPABASE_FUNCTIONS_URL}"
          SUPABASE_URL="${VITE_SUPABASE_URL}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

          CREATE=$(curl -fsS -X POST \
            -H "Origin: ${PROD_ORIGIN}" \
            -H 'Content-Type: application/json' \
            --data "{\"channel_id\":\"${CHANNEL_ID}\",\"visitor_metadata\":{\"final_24turn_smoke\":true,\"exclude_training\":true,\"started_by\":\"director\"}}" \
            "${BASE}/create-visitor-session")

          python - <<'PY' "$CREATE" > /tmp/session.env
          import json,sys,shlex
          d=json.loads(sys.argv[1]); assert d.get('success') is True,d
          x=d['data']
          print('CONVERSATION_ID='+shlex.quote(x['conversation_id']))
          print('SESSION_TOKEN='+shlex.quote(x['session_token']))
          PY
          source /tmp/session.env
          echo "FINAL_SMOKE_CONVERSATION_ID=${CONVERSATION_ID}"

          cat >/tmp/turns.txt <<'EOF'
          什么是四電一腦？
          請用繁體中文簡單解釋。
          Explain that in English.
          用繁體中文再講一次，不要增加新資料。
          用一句話總結。
          只說冷氣機相關部分。
          那回收安排的重點是什麼？
          簡單一點。
          我現在問的是哪個地區和哪個項目？
          Answer the same question in English.
          回到繁體中文，不要增加新資料。
          根據已確認資料列兩點。
          第一點再解釋簡單一點。
          第二點呢？
          剛才內容有沒有提到回收和送貨／安裝是同一件事？
          用香港客戶聽得懂的人話回答。
          用英文只翻譯上一個答案。
          再用繁體中文。
          最後只根據已確認資料，用三點總結。
          我現在問的是哪個地區和哪個項目？
          真人客服幾點有人？
          現在我要真人客服。
          我再補充一下，我沒有型號。
          EOF

          poll_json() {
            curl -fsS -X POST \
              -H "Origin: ${PROD_ORIGIN}" \
              -H 'Content-Type: application/json' \
              --data "{\"conversation_id\":\"${CONVERSATION_ID}\",\"session_token\":\"${SESSION_TOKEN}\"}" \
              "${BASE}/widget-poll-messages"
          }

          assistant_count() {
            python -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for m in d["data"].get("messages",[]) if m.get("role")=="assistant"))'
          }

          visitor_count() {
            python -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for m in d["data"].get("messages",[]) if m.get("role")=="visitor"))'
          }

          status_of() {
            python -c 'import json,sys; d=json.load(sys.stdin); print(d["data"].get("conversation_status",""))'
          }

          send_turn() {
            local n="$1" text="$2"
            local idem
            idem=$(python - <<'PY'
          import uuid; print(uuid.uuid4())
          PY
          )
            python - <<'PY' "$n" "$text"
          import json,sys
          print('TURN_INPUT='+json.dumps({'turn':int(sys.argv[1]),'text':sys.argv[2]},ensure_ascii=False))
          PY
            RESP=$(python - <<'PY' "$CONVERSATION_ID" "$SESSION_TOKEN" "$text"
          import json,sys
          print(json.dumps({'conversation_id':sys.argv[1],'session_token':sys.argv[2],'content':sys.argv[3]},ensure_ascii=False))
          PY
          )
            curl -fsS -X POST \
              -H "Origin: ${PROD_ORIGIN}" \
              -H 'Content-Type: application/json' \
              -H "idempotency-key: ${idem}" \
              --data "$RESP" \
              "${BASE}/receive-widget-message" >/tmp/send.json
            python - <<'PY' /tmp/send.json "$n"
          import json,sys
          d=json.load(open(sys.argv[1])); assert d.get('success') is True,d
          print(f'TURN_SEND_ACCEPTED={sys.argv[2]}')
          PY
          }

          mapfile -t TURNS </tmp/turns.txt
          test "${#TURNS[@]}" -eq 23

          for idx in $(seq 1 21); do
            text="${TURNS[$((idx-1))]}"
            before=$(poll_json | assistant_count)
            send_turn "$idx" "$text"
            ok=0
            for attempt in $(seq 1 24); do
              sleep 2
              P=$(poll_json)
              after=$(printf '%s' "$P" | assistant_count)
              status=$(printf '%s' "$P" | status_of)
              if [ "$after" -gt "$before" ]; then
                printf '%s' "$P" | python -c 'import json,sys; d=json.load(sys.stdin); m=[x for x in d["data"].get("messages",[]) if x.get("role")=="assistant"][-1]; print("TURN_OUTPUT="+json.dumps({"turn":int(sys.argv[1]),"status":d["data"].get("conversation_status"),"route":(m.get("metadata") or {}).get("response_route"),"escalation":(m.get("metadata") or {}).get("escalation_rule"),"content":m.get("content")},ensure_ascii=False))' "$idx"
                [ "$status" != "pending" ] || { echo "FAIL_UNEXPECTED_HANDOFF_AT_TURN=${idx}"; exit 1; }
                ok=1; break
              fi
            done
            [ "$ok" -eq 1 ] || { echo "FAIL_NO_ASSISTANT_REPLY_TURN=${idx}"; exit 1; }
          done

          # T22 must be the first explicit R1 handoff.
          before=$(poll_json | assistant_count)
          send_turn 22 "${TURNS[21]}"
          r1=0
          for attempt in $(seq 1 30); do
            sleep 2
            P=$(poll_json)
            after=$(printf '%s' "$P" | assistant_count)
            status=$(printf '%s' "$P" | status_of)
            if [ "$status" = "pending" ] && [ "$after" -gt "$before" ]; then
              printf '%s' "$P" | python -c 'import json,sys; d=json.load(sys.stdin); m=[x for x in d["data"].get("messages",[]) if x.get("role")=="assistant"][-1]; hs=d["data"].get("human_support") or {}; print("TURN_OUTPUT="+json.dumps({"turn":22,"status":d["data"].get("conversation_status"),"human_support":hs,"route":(m.get("metadata") or {}).get("response_route"),"escalation":(m.get("metadata") or {}).get("escalation_rule"),"content":m.get("content")},ensure_ascii=False))'
              r1=1; break
            fi
          done
          [ "$r1" -eq 1 ] || { echo FAIL_R1_HANDOFF; exit 1; }
          echo T22_R1_HANDOFF=PASS

          # Build a real authenticated agent session without storing an agent password.
          # Use curl for Management API because Python urllib is blocked by the Supabase edge/WAF
          # from hosted runners (403 code 1010). Never print the returned project keys.
          umask 077
          curl -fsS --retry 3 --retry-all-errors \
            -A 'curl/8 github-actions-auth-smoke' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true" \
            -o /tmp/project-api-keys.json
          python - <<'PY' /tmp/project-api-keys.json "$SUPABASE_URL" "$CONVERSATION_ID" > /tmp/agent.env
          import json,sys,urllib.request,urllib.parse,urllib.error,shlex
          keys_path,supa_url,conversation_id=sys.argv[1:]
          keys=json.load(open(keys_path))
          assert isinstance(keys,list) and keys, 'Management API returned no project keys'

          def call(url, headers=None, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              h={'User-Agent':'github-actions-auth-smoke/1.0', **(headers or {})}
              req=urllib.request.Request(url,data=data,method=method,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode()
                  try: payload=json.loads(raw)
                  except Exception: payload={'raw':raw[:300]}
                  return e.code,payload

          public_key=server_key=None
          for row in keys:
              value=row.get('api_key') or row.get('key') or row.get('value')
              name=str(row.get('name') or '').lower()
              typ=str(row.get('type') or '').lower()
              tmpl=row.get('secret_jwt_template') or {}
              role=str(tmpl.get('role') or '').lower() if isinstance(tmpl,dict) else ''
              if value and (name=='anon' or typ=='publishable') and public_key is None:
                  public_key=value
              if value and (name=='service_role' or (typ=='secret' and role in ('','service_role'))) and server_key is None:
                  server_key=value
          assert public_key and server_key, 'required project API keys unavailable'

          server_headers={'apikey':server_key,'Authorization':f'Bearer {server_key}','Content-Type':'application/json'}
          conv_q=urllib.parse.urlencode({'id':f'eq.{conversation_id}','select':'company_id'})
          st,conv=call(f'{supa_url}/rest/v1/conversations?{conv_q}',server_headers)
          assert st==200 and len(conv)==1, (st,conv)
          company_id=conv[0]['company_id']

          mem_q=urllib.parse.urlencode({'company_id':f'eq.{company_id}','is_active':'eq.true','role':'in.(admin,supervisor)','select':'user_id,role'})
          st,members=call(f'{supa_url}/rest/v1/company_membership?{mem_q}',server_headers)
          assert st==200 and members, (st,members)

          selected=None
          for member in members:
              uid=member['user_id']
              all_q=urllib.parse.urlencode({'user_id':f'eq.{uid}','is_active':'eq.true','select':'company_id,role'})
              st,allm=call(f'{supa_url}/rest/v1/company_membership?{all_q}',server_headers)
              if st!=200 or len({x['company_id'] for x in allm})!=1 or allm[0]['company_id']!=company_id:
                  continue
              ap_q=urllib.parse.urlencode({'user_id':f'eq.{uid}','status':'eq.active','select':'id,user_id,email,status'})
              st,aps=call(f'{supa_url}/rest/v1/agent_profile?{ap_q}',server_headers)
              if st==200 and len(aps)==1 and aps[0].get('email'):
                  selected=aps[0]; break
          assert selected, 'no single-tenant active elevated agent available'

          st,link=call(f'{supa_url}/auth/v1/admin/generate_link',server_headers,'POST',{'type':'magiclink','email':selected['email']})
          assert st in (200,201), (st,link)
          props=link.get('properties') if isinstance(link,dict) else None
          props=props if isinstance(props,dict) else {}
          token_hash=props.get('hashed_token') or props.get('token_hash') or link.get('hashed_token') or link.get('token_hash')
          if not token_hash:
              action=props.get('action_link') or link.get('action_link') or ''
              if action:
                  token_hash=urllib.parse.parse_qs(urllib.parse.urlparse(action).query).get('token',[''])[0]
          assert token_hash, 'generate_link did not return a one-time token hash'

          auth_headers={'apikey':public_key,'Content-Type':'application/json'}
          session=None
          errors=[]
          for typ in ('magiclink','email'):
              st,payload=call(f'{supa_url}/auth/v1/verify',auth_headers,'POST',{'type':typ,'token_hash':token_hash})
              if st==200 and payload.get('access_token'):
                  session=payload; break
              errors.append((typ,st,payload))
          assert session and session.get('access_token'), errors
          jwt=session['access_token']

          st,user=call(f'{supa_url}/auth/v1/user',{'apikey':public_key,'Authorization':f'Bearer {jwt}'})
          assert st==200 and user.get('id')==selected['user_id'], (st,user)

          print('AGENT_JWT='+shlex.quote(jwt))
          print('PUBLIC_KEY='+shlex.quote(public_key))
          print('AGENT_PROFILE_ID='+shlex.quote(selected['id']))
          print('AGENT_USER_ID='+shlex.quote(selected['user_id']))
          PY
          rm -f /tmp/project-api-keys.json
          chmod 600 /tmp/agent.env
          source /tmp/agent.env
          echo AUTHENTICATED_AGENT_SESSION=PASS

          TAKEOVER_BODY=$(python - <<'PY' "$CONVERSATION_ID"
          import json,sys; print(json.dumps({'conversation_id':sys.argv[1]}))
          PY
          )
          TAKEOVER=$(curl -fsS -X POST \
            -H "Origin: ${PROD_ORIGIN}" \
            -H "apikey: ${PUBLIC_KEY}" \
            -H "Authorization: Bearer ${AGENT_JWT}" \
            -H 'Content-Type: application/json' \
            --data "$TAKEOVER_BODY" \
            "${BASE}/take-over-conversation")
          python - <<'PY' "$TAKEOVER"
          import json,sys
          d=json.loads(sys.argv[1]); assert d.get('success') is True,d
          print('AUTHENTICATED_TAKEOVER=PASS')
          PY

          # T23 under assigned human control: AI must remain silent.
          before=$(poll_json | assistant_count)
          send_turn 23 "${TURNS[22]}"
          sleep 8
          P=$(poll_json)
          after=$(printf '%s' "$P" | assistant_count)
          status=$(printf '%s' "$P" | status_of)
          [ "$status" = "pending" ] || { echo "FAIL_T23_STATUS=${status}"; exit 1; }
          [ "$after" -eq "$before" ] || { echo "FAIL_AI_REPLIED_DURING_HUMAN_CONTROL before=${before} after=${after}"; exit 1; }
          echo T23_AI_SUPPRESSION=PASS

          RETURN_BODY=$(python - <<'PY' "$CONVERSATION_ID"
          import json,sys
          print(json.dumps({'conversation_id':sys.argv[1],'closure_checklist':{'issue_resolved':True,'low_risk_followup':True}}))
          PY
          )
          RETURN=$(curl -fsS -X POST \
            -H "Origin: ${PROD_ORIGIN}" \
            -H "apikey: ${PUBLIC_KEY}" \
            -H "Authorization: Bearer ${AGENT_JWT}" \
            -H 'Content-Type: application/json' \
            --data "$RETURN_BODY" \
            "${BASE}/return-to-ai")
          python - <<'PY' "$RETURN"
          import json,sys
          d=json.loads(sys.argv[1]); assert d.get('success') is True,d
          print('AUTHENTICATED_RETURN_TO_AI=PASS')
          PY

          returned=0
          for attempt in $(seq 1 30); do
            sleep 2
            P=$(poll_json)
            status=$(printf '%s' "$P" | status_of)
            if [ "$status" = "open" ]; then returned=1; break; fi
          done
          [ "$returned" -eq 1 ] || { echo FAIL_RETURN_TO_AI_TIMEOUT; exit 1; }
          echo RETURN_TO_AI_OBSERVED=PASS

          # T24 same visitor session after explicit authenticated Return-to-AI.
          before=$(poll_json | assistant_count)
          send_turn 24 "現在回到AI，請只用一句話說明我剛才主要問的是什麼。"
          resumed=0
          for attempt in $(seq 1 30); do
            sleep 2
            P=$(poll_json)
            after=$(printf '%s' "$P" | assistant_count)
            status=$(printf '%s' "$P" | status_of)
            if [ "$status" = "open" ] && [ "$after" -gt "$before" ]; then
              printf '%s' "$P" | python -c 'import json,sys; d=json.load(sys.stdin); m=[x for x in d["data"].get("messages",[]) if x.get("role")=="assistant"][-1]; meta=m.get("metadata") or {}; assert meta.get("response_route")=="conversation_memory",meta; print("TURN_OUTPUT="+json.dumps({"turn":24,"status":d["data"].get("conversation_status"),"route":meta.get("response_route"),"escalation":meta.get("escalation_rule"),"content":m.get("content")},ensure_ascii=False))'
              resumed=1; break
            fi
          done
          [ "$resumed" -eq 1 ] || { echo FAIL_AI_DID_NOT_RESUME; exit 1; }

          FINAL=$(poll_json)
          final_status=$(printf '%s' "$FINAL" | status_of)
          final_visitors=$(printf '%s' "$FINAL" | visitor_count)
          final_assistants=$(printf '%s' "$FINAL" | assistant_count)
          [ "$final_status" = "open" ] || { echo "FAIL_FINAL_STATUS=${final_status}"; exit 1; }
          [ "$final_visitors" -eq 24 ] || { echo "FAIL_VISITOR_COUNT=${final_visitors}"; exit 1; }
          [ "$final_assistants" -eq 23 ] || { echo "FAIL_ASSISTANT_COUNT=${final_assistants}"; exit 1; }
          echo EXACTLY_ONCE_COUNTS=PASS
          echo FINAL_24TURN_RUNTIME_FLOW=PASS
          echo "FINAL_SMOKE_CONVERSATION_ID=${CONVERSATION_ID}"
