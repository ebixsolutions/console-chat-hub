name: Round2 Task1 Conversation Semantic Contract

on:
  push:
    branches:
      - director/round2-task1-conversation-semantic-contract
    paths:
      - .github/workflows/round2-task1-conversation-semantic-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task1-final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/round2-task1-conversation-semantic-contract
          fetch-depth: 0

      - name: Apply canonical semantic adapters
        run: |
          set -euo pipefail
          python scripts/round2-task1-apply.py
          git diff --check

      - name: Compile affected runtime
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/_shared/conversation-semantic-contract.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/conversation-intelligence.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/conversation-runtime-state.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          echo TASK1_RUNTIME_COMPILE=PASS

      - name: Run Task 1 semantic regressions
        run: |
          set -euo pipefail
          deno test --allow-env --node-modules-dir=auto tests/edge/round2-task1-conversation-semantic-contract.test.ts
          echo TASK1_SEMANTIC_TESTS=PASS

      - name: Run frozen grounding regressions
        run: |
          set -euo pipefail
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-2-output-grounding-router.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-3-citation-lineage.test.ts
          echo TASK1_FROZEN_GROUNDING_REGRESSION=PASS

      - name: Machine assertions
        run: |
          set -euo pipefail
          grep -q 'PRIOR_GROUNDED_ANSWER' supabase/functions/_shared/conversation-semantic-contract.ts
          grep -q 'current_operation: ConversationOperation' supabase/functions/_shared/conversation-runtime-state.ts
          grep -q 'const semantic = classifyCanonicalConversationTurn' supabase/functions/_shared/conversation-runtime-state.ts
          grep -q 'classifyCanonicalConversationTurn(t, \[\]' supabase/functions/_shared/conversation-intelligence.ts
          echo TASK1_MACHINE_ASSERTIONS=PASS

      - name: Full authoritative build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo TASK1_FULL_BUILD=PASS

      - name: Commit validated Task 1 source
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add supabase/functions/_shared/conversation-intelligence.ts supabase/functions/_shared/conversation-runtime-state.ts
            git commit -m 'Complete Round 2 Task 1 canonical conversation semantic contract'
            git push origin HEAD:director/round2-task1-conversation-semantic-contract
          fi
          echo TASK1_FINAL_GATE=PASS
