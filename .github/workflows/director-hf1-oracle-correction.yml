name: Director HF-1 Oracle Correction
on:
  push:
    paths:
      - '.github/workflows/director-hf1-oracle-correction.yml'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Correct HF-1 calm-request oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/director-hf1-takeover.yml')
          s=p.read_text()
          old='let i=deriveHandoffDecisionInput(rows(["現在我要真人客服"]),"現在我要真人客服",["order_reference"],{explicit_human_request:true});'
          new='let i=deriveHandoffDecisionInput(rows(["可以幫我轉真人客服嗎？"]),"可以幫我轉真人客服嗎？",["order_reference"],{explicit_human_request:true});'
          assert s.count(old)==1, f'oracle_anchor={s.count(old)}'
          p.write_text(s.replace(old,new,1))
          print('HF1_ORACLE_CORRECTION=PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/director-hf1-takeover.yml
          git commit -m "Director HF-1: correct calm explicit-request oracle"
          git push origin HEAD:main
