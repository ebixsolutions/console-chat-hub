name: Workflow 4 Latest Condition Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow4-latest-condition-apply.yml'

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Apply deterministic Workflow 4 patch
        run: python scripts/workflow4_latest_condition_patch.py

      - name: Workflow 4 semantic regression
        run: |
          deno test tests/edge/workflow4-latest-condition-state.test.ts
          deno test tests/edge/task4-1-current-context-memory.test.ts

      - name: Edge compile
        run: deno check supabase/functions/generate-reply/index.ts

      - name: Commit exact functional source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/conversation-runtime-state.ts
          git diff --cached --exit-code && { echo 'NO_FUNCTIONAL_CHANGE'; exit 1; } || true
          git commit -m 'fix: preserve latest conversation requirements'
          git push origin HEAD:main
