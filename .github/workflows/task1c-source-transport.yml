name: Task1C exact-source transport (not acceptance)
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/task1c-source-transport.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.repository == 'ebixsolutions/console-chat-hub'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Recover hash-bound existing Task1C edits without changing any remote ref
        env:
          SOURCE_OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c3-result"
          python3 <<'PY'
          import os,json,base64,gzip,hashlib,pathlib,subprocess,urllib.request
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'c3-result'
          repo='ebixsolutions/console-chat-hub'; base='d29c68a7648d952bf429e73f27e886247db67ec0'
          workflow='.github/workflows/task1c-source-transport.yml'
          git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('merge-base',base,'HEAD')==base
          assert git('diff','--name-only',base,'HEAD').splitlines()==[workflow]
          chunks=['0be316afa612057fab6860491616489364a31280','51e817dc52a97fccb1f616389ae8dc793eafde1e','1156ddc718051c1a177e758f77ffef69994c61dc','a1eb52a5b37e59dc3d6e0b007c4bb3d70b5d2a4f','ca68e147d76716c5a7abdea44a285acf6132872c']
          parts=[]
          for sha in chunks:
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['SOURCE_OBJECT_TOKEN'],'Accept':'application/vnd.github+json'})
            obj=json.load(urllib.request.urlopen(req,timeout=30))
            raw=base64.b64decode(obj['content']); assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
            parts.append(raw.decode('ascii'))
          compressed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='1eb6ba8562ce1a7c240019ebffc31ac83f9dae2aa8e0453bcb0312418ce9c8b1'
          payload=json.loads(gzip.decompress(compressed)); assert payload['base']==base
          expected='899bb3fda67d26f2b0f7c4740c9408ffed77f0ca'; assert payload['tree']==expected
          paths=[x['path'] for x in payload['files']]; assert len(paths)==len(set(paths))==16
          for entry in payload['files']:
            p=pathlib.PurePosixPath(entry['path']); assert not p.is_absolute() and '..' not in p.parts
            f=root/p; assert not f.is_symlink()
            assert (hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None)==entry['before'],str(p)
          patch=out/'exact.patch'; patch.write_text(payload['patch'])
          subprocess.run(['git','apply','--check','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(patch)],check=True)
          (root/workflow).unlink()
          for entry in payload['files']:
            assert hashlib.sha256((root/entry['path']).read_bytes()).hexdigest()==entry['after'],entry['path']
          subprocess.run(['git','add','--',*paths,workflow],check=True)
          assert git('write-tree')==expected
          subprocess.run(['git','-c','user.name=Task1C local verification','-c','user.email=task1c@example.invalid','commit','-m','fix(task1c): complete source-bound price and session-scoped event delivery'],check=True)
          (out/'payload.json').write_text(json.dumps(payload,ensure_ascii=False))
          (out/'parent.txt').write_text(os.environ['GITHUB_SHA'])
          (out/'candidate-tree.txt').write_text(expected)
          print('EXACT_SOURCE_RESTORED',expected,'16/16 hashes match; no remote ref updated')
          PY
      - name: Install the existing pinned native and browser test dependencies
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/c3-console-react" --ignore-scripts --no-audit --no-fund react@19.2.0 react-test-renderer@19.2.0 react-dom@19.2.0 jsdom@26.1.0 @testing-library/user-event@14.6.1
      - name: Execute affected runtime, UI, typecheck, complete build and existing source controls
        shell: bash
        run: |
          set -uo pipefail
          export C3_REACT_TEST_ROOT="$RUNNER_TEMP/c3-console-react"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          result="$RUNNER_TEMP/c3-result"; failed=0
          run(){ local name="$1"; shift; printf '%s\n' "$*" > "$result/$name.command.txt"; "$@" > "$result/$name.log" 2>&1; local code=$?; printf '%s\t%s\n' "$name" "$code" >> "$result/exits.tsv"; tail -n 18 "$result/$name.log"; if test "$code" != 0; then failed=1; fi; }
          run source-chain node --disable-warning=ExperimentalWarning --experimental-strip-types --test tests/task1-director/source-chain.test.mjs
          run visitor-auth node --test tests/c3-widget-live-auth/original-preview-ingress.test.mjs
          run browser-ui node --test tests/console-navigation/widget-input-dom.test.mjs tests/console-navigation/widget-recovery.test.mjs tests/console-navigation/ordinary-preview-bridge.test.mjs tests/console-navigation/ordinary-widget-dom.test.mjs tests/console-navigation/inbox-history-search.test.mjs
          run deno-check deno check --no-lock --node-modules-dir=auto supabase/functions/generate-reply/index.ts supabase/functions/widget-poll-messages/index.ts
          run prices deno test --no-lock --allow-read --allow-env --node-modules-dir=auto supabase/functions/_shared/canonical-kb-direct-answer.test.ts supabase/functions/_shared/canonical-kb-b2-price.test.ts
          run typecheck npx tsc --noEmit
          run build npm run build
          run original-source-controls node .github/scripts/c3_unified_production_source_gate.test.mjs
          run original-source-gate node .github/scripts/c3_unified_production_source_gate.mjs
          run source-clean git diff --exit-code HEAD
          exit "$failed"
      - name: Create unreferenced verified source commit only (no branch update or deployment)
        env:
          SOURCE_OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os,json,pathlib,hashlib,subprocess,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'c3-result'; payload=json.loads((out/'payload.json').read_text())
          repo='ebixsolutions/console-chat-hub'; parent=(out/'parent.txt').read_text().strip()
          def api(path,data=None):
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['SOURCE_OBJECT_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            return json.load(urllib.request.urlopen(req,timeout=60))
          pr=api('pulls/12'); assert pr['state']=='open' and not pr['merged'] and pr['head']['sha']==parent,'remote source advanced'
          exits=[{'name':n,'exit_code':int(c)} for n,c in (line.split('\t') for line in (out/'exits.tsv').read_text().splitlines())]
          assert len(exits)==10 and all(r['exit_code']==0 for r in exits)
          entries=[]
          for f in payload['files']:
            data=pathlib.Path(f['path']).read_bytes(); assert hashlib.sha256(data).hexdigest()==f['after']
            entries.append({'path':f['path'],'mode':'100644','type':'blob','content':data.decode('utf-8')})
          entries.append({'path':'.github/workflows/task1c-source-transport.yml','mode':'100644','type':'blob','sha':None})
          base_tree=api('git/commits/'+parent)['tree']['sha']
          tree=api('git/trees',{'base_tree':base_tree,'tree':entries}); assert tree['sha']==payload['tree']
          commit=api('git/commits',{'message':'fix(task1c): complete source-bound price and session-scoped event delivery','tree':tree['sha'],'parents':[parent]})
          receipt={'parent':parent,'head':commit['sha'],'tree':tree['sha'],'source_base':payload['base'],'source_validation':'PASS_SCOPED','commands':exits,'remote_ref_updated':False,'production_deployment':False,'hosted':'NOT_RUN','task1c_accepted':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Retain exact execution evidence and missing local UI dependencies
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/c3-console-react/node_modules"; then tar -C "$RUNNER_TEMP/c3-console-react" -czf "$RUNNER_TEMP/c3-result/react-test-dependencies.tar.gz" node_modules package.json package-lock.json; fi
          if test -d "$RUNNER_TEMP/c3-result"; then (cd "$RUNNER_TEMP/c3-result" && sha256sum *.log *.json *.tsv 2>/dev/null > SHA256SUMS || true); fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-task1c-functional-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/c3-result
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
