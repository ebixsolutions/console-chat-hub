name: TASK A3 Cross-Industry Production Smoke

on:
  push:
    paths:
      - '.github/workflows/task-a3-cross-industry-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run production widget smoke
        shell: bash
        run: |
          node <<'NODE'
          const { randomUUID } = require('crypto');

          const BASE = 'https://nrfxhqabwblzxoushgnm.supabase.co/functions/v1';
          const ORIGIN = 'https://widget.ebixmall.com';
          const CHANNEL = 'b0000000-0000-0000-0000-000000000001';
          const headers = { 'content-type': 'application/json', 'origin': ORIGIN };

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          async function post(path, body) {
            const res = await fetch(`${BASE}/${path}`, { method: 'POST', headers, body: JSON.stringify(body) });
            const text = await res.text();
            let json;
            try { json = JSON.parse(text); } catch { json = { raw: text }; }
            if (!res.ok) throw new Error(`${path} HTTP ${res.status}: ${JSON.stringify(json)}`);
            return json;
          }

          async function createSession(label) {
            const j = await post('create-visitor-session', {
              channel_id: CHANNEL,
              visitor_fingerprint: `a3-cross-industry-${label}-${randomUUID()}`,
              visitor_metadata: {
                source: 'a3_cross_industry_smoke',
                exclude_training: true,
                smoke_label: label,
                run_id: process.env.GITHUB_RUN_ID || null
              }
            });
            if (!j?.success || !j?.data?.session_token || !j?.data?.conversation_id) {
              throw new Error(`create session invalid: ${JSON.stringify(j)}`);
            }
            return j.data;
          }

          async function pollFinal(session, sourceMessageId) {
            const deadline = Date.now() + 45000;
            while (Date.now() < deadline) {
              const j = await post('widget-poll-messages', {
                conversation_id: session.conversation_id,
                session_token: session.session_token
              });
              const messages = j?.data?.messages || [];
              const final = [...messages].reverse().find(m =>
                m.role === 'assistant' &&
                m.content !== '__THINKING__' &&
                m.metadata &&
                m.metadata.source_message_id === sourceMessageId
              );
              if (final) return { reply: String(final.content || ''), poll: j };
              await sleep(800);
            }
            throw new Error(`timeout waiting final assistant for source ${sourceMessageId}`);
          }

          async function send(session, content) {
            const client_message_id = randomUUID();
            const sent = await post('receive-widget-message', {
              conversation_id: session.conversation_id,
              session_token: session.session_token,
              content,
              client_message_id
            });
            const source = sent?.data?.message_id;
            if (!source) throw new Error(`send missing message id: ${JSON.stringify(sent)}`);
            const final = await pollFinal(session, source);
            return { input: content, source_message_id: source, reply: final.reply };
          }

          const scenarios = [
            { key: 'fashion', turns: ['我要2件黑色M碼T-shirt。','更正，唔係2件，係3件。','我想預訂，但未付款。'] },
            { key: 'beauty', turns: ['我要2支30ml精華液，敏感肌用。','呢個之前報價而家仲係咪有效？'] },
            { key: 'grocery', turns: ['我要3盒牛奶。','另外加2盒。','總共有幾多盒？'] },
            { key: 'digital', turns: ['我要2個software license。','我想預訂，但未付款。'] },
            { key: 'service', turns: ['我要預約2位星期五剪髮。','我想預訂，但未付款。'] },
            { key: 'b2b', turns: ['我要100箱紙杯，想先報價。','呢個之前報價而家仲係咪有效？'] },
            { key: 'appliance', turns: ['我睡房有2部冷氣。','窗口夠唔夠安全安裝冷氣？','另外加1部冷氣。'] }
          ];

          const out = [];
          for (const scenario of scenarios) {
            const session = await createSession(scenario.key);
            const rows = [];
            for (const turn of scenario.turns) rows.push(await send(session, turn));
            out.push({ scenario: scenario.key, conversation_id: session.conversation_id, turns: rows });
            console.log(`SCENARIO ${scenario.key} PASS transport conversation=${session.conversation_id}`);
          }

          console.log('===== A3 CROSS-INDUSTRY SMOKE RESULTS =====');
          console.log(JSON.stringify(out, null, 2));
          console.log('===== END A3 CROSS-INDUSTRY SMOKE RESULTS =====');
          NODE
