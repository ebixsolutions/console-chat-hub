name: Workflow 5 v70 Member Tier Runtime Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow5-v70-member-tier-runtime-final.yml'

permissions:
  contents: write

concurrency:
  group: workflow5-v70-member-tier-runtime-final
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_ORIGIN: https://console-chat-hub.lovable.app
      CHANNEL_ID: b0000000-0000-0000-0000-000000000001
      BASE: https://nrfxhqabwblzxoushgnm.supabase.co/functions/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply member-tier topical recovery fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/generate-reply/index.ts')
          s=p.read_text()

          old_import='  buildWorkflow5TopicalClarification,\n  resolveConversationMemoryResponse,'
          new_import='  buildWorkflow5TopicalClarification,\n  workflow5ShortTopicHint,\n  resolveConversationMemoryResponse,'
          if 'workflow5ShortTopicHint,' not in s:
              if s.count(old_import) != 1:
                  raise SystemExit(f'STOP import anchor count={s.count(old_import)}')
              s=s.replace(old_import,new_import,1)

          lang_anchor='  const _visitorLang = resolveWorkflow5ConversationLanguage(_h1LastMsg, _pr5HistoryRows ?? []);\n'
          marker='  const _w5ShortTopicHint = workflow5ShortTopicHint(_h1LastMsg);\n'
          if marker not in s:
              if s.count(lang_anchor) != 1:
                  raise SystemExit(f'STOP lang anchor count={s.count(lang_anchor)}')
              recovery=r'''  const _w5ShortTopicHint = workflow5ShortTopicHint(_h1LastMsg);
  // Workflow 5: a recognized short topic must never be treated as an unknown
  // conversational subject. Membership-tier data is currently not confirmed in
  // published product evidence, so recover deterministically and fail closed
  // instead of asking the customer to restate the topic or fabricating details.
  if (_w5ShortTopicHint === "membership tiers") {
    const topicalReply = _visitorLang === "en"
      ? "You’re asking about membership tiers. I don’t have enough confirmed published information to state the tier structure, inclusions, or limits, so I won’t guess."
      : _visitorLang === "zh-CN"
      ? "你问的是会员等级。目前没有足够已确认的已发布资料来确定会员等级的架构、包含内容或限制，所以我不会猜。"
      : "你問的是會員等級。目前未有足夠已確認的已發布資料去確定會員等級的架構、包含內容或限制，所以我唔會估。";
    const topicalCommit = await commitAiReplyWithControlGate(
      supabaseAdmin,
      conversation_id,
      source_message_id,
      topicalReply,
      {
        response_route: "workflow5_topical_recovery",
        escalation_action: "continue_ai",
        handoff_required: false,
        topic: _w5ShortTopicHint,
        factual_grounding_required: true,
        grounding_state: "published_evidence_unconfirmed",
      },
    );
    await cleanupThinking(supabaseAdmin, conversation_id, source_message_id);
    if (topicalCommit.ok) {
      return new Response(
        JSON.stringify({
          success: true,
          reply: topicalReply,
          response_route: "workflow5_topical_recovery",
          handoff_required: false,
        }),
        { headers: { ...corsHeaders, "Content-Type": "application/json" } },
      );
    }
    if (["human_control", "resolved", "superseded_source"].includes(topicalCommit.result)) {
      return new Response(
        JSON.stringify({ success: true, skipped: topicalCommit.result }),
        { headers: { ...corsHeaders, "Content-Type": "application/json" } },
      );
    }
    return new Response(
      JSON.stringify({ success: false, error: `workflow5_topical_recovery_${topicalCommit.result}` }),
      { status: 409, headers: { ...corsHeaders, "Content-Type": "application/json" } },
    );
  }
'''
              s=s.replace(lang_anchor,lang_anchor+recovery,1)

          s=s.replace('!buildWorkflow5TopicalClarification(_h1LastMsg, _visitorLang) &&','!_w5ShortTopicHint &&')
          p.write_text(s)

          out=p.read_text()
          required=[
            'workflow5ShortTopicHint,',
            'const _w5ShortTopicHint = workflow5ShortTopicHint(_h1LastMsg);',
            '_w5ShortTopicHint === "membership tiers"',
            'response_route: "workflow5_topical_recovery"',
            'published_evidence_unconfirmed',
            '!_w5ShortTopicHint &&',
          ]
          missing=[x for x in required if x not in out]
          if missing: raise SystemExit(f'STOP missing source markers: {missing}')
          print('WORKFLOW5_V70_MEMBER_TIER_PATCH=PASS')
          PY

      - name: Source regression compile and root-family assertions
        shell: bash
        run: |
          set -euo pipefail
          deno eval 'import { workflow5ShortTopicHint } from "./supabase/functions/_shared/conversation-runtime-state.ts";
            const cases = new Map([["會員等級呢？","membership tiers"],["会员等级呢？","membership tiers"],["membership tiers?","membership tiers"],["CRM呢？","CRM"],["Push呢？","Push notifications"],["App呢？","App support"]]);
            for (const [input,want] of cases) { const got=workflow5ShortTopicHint(input); if(got!==want) throw new Error(`${input}: ${got} != ${want}`); }
            console.log("WORKFLOW5_SHORT_TOPIC_ROOT_FAMILY=PASS");'
          deno test --allow-env tests/edge/workflow5-multilingual-privacy.test.ts
          deno test --allow-env tests/edge/workflow4-latest-condition-state.test.ts
          deno test --allow-env tests/edge/task4-1-current-context-memory.test.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          grep -A2 '^\[functions.generate-reply\]' supabase/config.toml | grep -Fq 'verify_jwt = true'
          echo WORKFLOW5_V70_SOURCE_GATE=PASS

      - name: Commit authoritative source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          git add supabase/functions/generate-reply/index.ts
          if git diff --cached --quiet; then
            echo 'No source diff to commit'
          else
            git commit -m 'fix: recover recognized member-tier topic without generic clarification'
            git push origin HEAD:main
          fi
          echo "WORKFLOW5_V70_SOURCE_COMMIT=$(git rev-parse HEAD)"

      - name: Deploy generate-reply v70
        shell: bash
        run: |
          set -euo pipefail
          npx supabase functions deploy generate-reply --project-ref "$PROJECT_REF"
          echo WORKFLOW5_V70_DEPLOY=PASS

      - name: Fresh Case09 only 24-turn final runtime gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/scripts/workflow5_prod_final_v3.py').read_text()
          lines=src.splitlines()
          removed=[l for l in lines if l.lstrip().startswith("'04':")]
          if len(removed)!=1:
              raise SystemExit(f'STOP expected one Case04 definition, got {len(removed)}')
          out=[l for l in lines if not l.lstrip().startswith("'04':")]
          Path('/tmp/workflow5_case09_v70.py').write_text('\n'.join(out)+'\n')
          PY
          python /tmp/workflow5_case09_v70.py
          echo WORKFLOW5_V70_FRESH_CASE09_FINAL_GATE=PASS
