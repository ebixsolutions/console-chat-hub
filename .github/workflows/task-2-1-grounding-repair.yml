name: Task 2.1 Grounding Repair Apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/task-2-1-grounding-repair.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic repair
        shell: python
        run: |
          from pathlib import Path

          router_path = Path('supabase/functions/_shared/llm-router.ts')
          gen_path = Path('supabase/functions/generate-reply/index.ts')
          test_path = Path('supabase/functions/_shared/llm-router-grounding.test.ts')

          router = router_path.read_text()
          gen = gen_path.read_text()

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          router = once(router,
            '  | "LLM_NON_2XX"\n  | "LLM_INVALID_OUTPUT";',
            '  | "LLM_NON_2XX"\n  | "LLM_INVALID_OUTPUT"\n  | "LLM_GROUNDING_REJECTED";',
            'failure-code-union')

          anchor = '''function canonicalExactToken(value: string): string {
            return value.normalize("NFKC").toLowerCase()
              .replace(/percent/g, "%")
              .replace(/(?:litres?|liters?|公升)/g, "l")
              .replace(/(?:millilitres?|milliliters?|毫升)/g, "ml")
              .replace(/(?:kilograms?|公斤)/g, "kg")
              .replace(/(?:grams?|克)/g, "g")
              .replace(/(?:hours?|小時|小时)/g, "h")
              .replace(/(?:minutes?|分鐘|分钟)/g, "min")
              .replace(/(?:days?|天|日)/g, "d")
              .replace(/(?:years?|年)/g, "y")
              .replace(/(?:months?|月)/g, "mo")
              .replace(/[\\s,]/g, "").trim();
          }
          '''
          insert = anchor + '''
          /**
           * Extract only customer-authored turns from the governed conversation input.
           * Assistant turns are deliberately excluded so an earlier AI statement can
           * never become evidence merely because it appears in conversation history.
           * Prior-grounded transform calls carry only the latest customer request and
           * therefore safely use the bounded fallback below.
           */
          export function extractCustomerConversationEvidence(input: string): string {
            const raw = typeof input === "string" ? input : "";
            const turnPattern = /\\[Turn\\s+\\d+\\s+Visitor\\]\\n([\\s\\S]*?)(?=\\n\\n\\[Turn\\s+\\d+\\s+(?:Visitor|Assistant)\\]\\n|$)/g;
            const visitorTurns: string[] = [];
            for (const match of raw.matchAll(turnPattern)) {
              const content = String(match[1] ?? "").trim();
              if (content) visitorTurns.push(content.slice(0, 3000));
            }
            if (visitorTurns.length > 0) return visitorTurns.slice(-6).join("\\n\\n").slice(0, 12000);
            return raw.slice(0, 3000);
          }
          '''
          router = once(router, anchor, insert, 'visitor-evidence-helper')

          router = once(router,
            '  const conversationEvidence = call.user.slice(0, 12000);',
            '  const conversationEvidence = extractCustomerConversationEvidence(call.user);',
            'visitor-only-evidence-use')

          router = once(router,
            '''          return {
            ok: false,
            code: "LLM_INVALID_OUTPUT",
            status: res.status,
            request_id: requestId,
            usage,
          };''',
            '''          return {
            ok: false,
            code: "LLM_GROUNDING_REJECTED",
            status: res.status,
            request_id: requestId,
            usage,
          };''',
            'grounding-specific-failure-code')

          router = once(router,
            '    case "LLM_INVALID_OUTPUT": return "CE_PROVIDER_INVALID_OUTPUT";\n    case "LLM_INPUT_BLOCKED": return "CE_PROVIDER_INVALID_OUTPUT";',
            '    case "LLM_INVALID_OUTPUT": return "CE_PROVIDER_INVALID_OUTPUT";\n    case "LLM_GROUNDING_REJECTED": return "CE_PROVIDER_INVALID_OUTPUT";\n    case "LLM_INPUT_BLOCKED": return "CE_PROVIDER_INVALID_OUTPUT";',
            'ce-grounding-code')

          gen = once(gen,
            '  if (code === "LLM_CONFIG_MISSING") return 503;\n  return 502;',
            '  if (code === "LLM_CONFIG_MISSING") return 503;\n  if (code === "LLM_GROUNDING_REJECTED") return 422;\n  return 502;',
            'grounding-http-status')

          gen = once(gen,
            '    case "LLM_INPUT_BLOCKED": return "LLM_EMPTY_RESPONSE";\n    case "LLM_INVALID_OUTPUT": return "LLM_EMPTY_RESPONSE";',
            '    case "LLM_INPUT_BLOCKED": return "LLM_INPUT_BLOCKED";\n    case "LLM_INVALID_OUTPUT": return "LLM_INVALID_OUTPUT";\n    case "LLM_GROUNDING_REJECTED": return "LLM_GROUNDING_REJECTED";',
            's0-classification')

          wording_anchor = '''const R2_CLARIFICATION_SAFE_WORDING: Record<"zh-TW" | "zh-CN" | "en", string> = {
            "zh-TW": "我想再確認一次，才能更準確地幫你。請補充這個問題中最重要的細節，例如你希望處理的項目或目前遇到的情況。",
            "zh-CN": "我想再确认一次，才能更准确地帮你。请补充这个问题中最重要的细节，例如你希望处理的项目或目前遇到的情况。",
            en: "I’d like to clarify one detail so I can help more accurately. Please add the most important detail about what you want handled or what is happening now.",
          };
          '''
          wording_insert = wording_anchor + '''
          const GROUNDING_RECOVERY_WORDING: Record<"zh-TW" | "zh-CN" | "en", string> = {
            "zh-TW": "我想再確認一下資料，避免答錯。你最想先確認哪一點？",
            "zh-CN": "我想再确认一下资料，避免答错。你最想先确认哪一点？",
            en: "I want to verify the information before answering so I don’t give you something inaccurate. Which point would you like me to confirm first?",
          };
          '''
          gen = once(gen, wording_anchor, wording_insert, 'grounding-recovery-wording')

          failure_block = '''  if (!llm.ok) {
            if (_escEnableS0) {
              return await handleS0Handoff(
                supabaseAdmin,
                conversation_id,
                source_message_id,
                routerFailureToS0(llm.code),
                _visitorLang,
              );
            }
            await cleanupThinking(supabaseAdmin, conversation_id, source_message_id);
            return new Response(
              JSON.stringify({ success: false, error: "AI service error", error_code: llm.code }),
              { status: routerFailureHttpStatus(llm.code), headers: { ...corsHeaders, "Content-Type": "application/json" } },
            );
          }
          '''
          replacement = '''  if (!llm.ok) {
            if (llm.code === "LLM_GROUNDING_REJECTED") {
              const recoveryReply = GROUNDING_RECOVERY_WORDING[_visitorLang] ?? GROUNDING_RECOVERY_WORDING.en;
              const committed = await commitAiReplyWithControlGate(
                supabaseAdmin,
                conversation_id,
                source_message_id,
                recoveryReply,
                {
                  response_route: "grounding_recovery_clarification",
                  handoff_required: false,
                  factual_grounding_required: false,
                  source_error_code: "LLM_GROUNDING_REJECTED",
                },
              );
              await cleanupThinking(supabaseAdmin, conversation_id, source_message_id);
              if (!committed.ok) {
                if (committed.result === "human_control" || committed.result === "resolved" || committed.result === "superseded_source") {
                  return new Response(JSON.stringify({ success: true, skipped: committed.result }), { headers: { ...corsHeaders, "Content-Type": "application/json" } });
                }
                return new Response(JSON.stringify({ success: false, error: `grounding_recovery_commit_${committed.result}` }), { status: 409, headers: { ...corsHeaders, "Content-Type": "application/json" } });
              }
              return new Response(
                JSON.stringify({ success: true, response_route: "grounding_recovery_clarification", handoff_required: false }),
                { headers: { ...corsHeaders, "Content-Type": "application/json" } },
              );
            }
            if (_escEnableS0) {
              return await handleS0Handoff(
                supabaseAdmin,
                conversation_id,
                source_message_id,
                routerFailureToS0(llm.code),
                _visitorLang,
              );
            }
            await cleanupThinking(supabaseAdmin, conversation_id, source_message_id);
            return new Response(
              JSON.stringify({ success: false, error: "AI service error", error_code: llm.code }),
              { status: routerFailureHttpStatus(llm.code), headers: { ...corsHeaders, "Content-Type": "application/json" } },
            );
          }
          '''
          gen = once(gen, failure_block, replacement, 'grounding-recovery-handler')

          test_path.write_text(r'''import {
            extractCustomerConversationEvidence,
            parseGroundingVerifierDecision,
            validateExactFactGrounding,
          } from "./llm-router.ts";

          function assert(condition: unknown, message: string): asserts condition {
            if (!condition) throw new Error(message);
          }

          Deno.test("customer exact facts are accepted without promoting assistant facts", () => {
            const input = [
              "[Turn 1 Visitor]\\n我大約300 SKU。訂單號TEST-SMOKE-PAY-07。",
              "[Turn 2 Assistant]\\n你有500 SKU，而且訂單TEST-FAKE-500已確認。",
              "[Turn 3 Visitor]\\n我最重視安靜。",
            ].join("\\n\\n");
            const customer = extractCustomerConversationEvidence(input);
            assert(customer.includes("300 SKU"), "visitor quantity missing");
            assert(customer.includes("TEST-SMOKE-PAY-07"), "visitor reference missing");
            assert(customer.includes("安靜"), "visitor preference missing");
            assert(!customer.includes("500 SKU"), "assistant quantity leaked into customer evidence");
            assert(!customer.includes("TEST-FAKE-500"), "assistant reference leaked into customer evidence");

            assert(validateExactFactGrounding("你目前大約300 SKU。", "", [], customer).ok, "visitor quantity should ground");
            assert(validateExactFactGrounding("訂單號是TEST-SMOKE-PAY-07。", "", [], customer).ok, "visitor reference should ground");
            assert(!validateExactFactGrounding("你目前有500 SKU。", "", [], customer).ok, "assistant-only quantity must not ground");
            assert(!validateExactFactGrounding("訂單TEST-FAKE-500已確認。", "", [], customer).ok, "assistant-only reference must not ground");
          });

          Deno.test("authoritative KB exact facts remain valid and absent facts remain blocked", () => {
            assert(validateExactFactGrounding("保養期為2年。", "此產品保養期為2年。", []).ok, "KB fact should ground");
            assert(!validateExactFactGrounding("保養期為3年。", "此產品保養期為2年。", []).ok, "new external fact must fail");
            assert(!validateExactFactGrounding("內部chunk abc123", "abc123", ["abc123"]).ok, "chunk id leak must fail");
          });

          Deno.test("verifier decision parser tolerates safe omissions but remains fail-closed", () => {
            const minimal = parseGroundingVerifierDecision('{"grounded":true}', ["E1", "C1"]);
            assert(minimal?.grounded === true, "minimal grounded decision should parse");

            const c1 = parseGroundingVerifierDecision('{"grounded":true,"unsupported_claims":[],"evidence_chunk_ids":["C1"]}', ["E1", "C1"]);
            assert(c1?.grounded === true, "C1 audit id should be accepted when explicitly allowed");

            assert(parseGroundingVerifierDecision('{"grounded":true,"unsupported_claims":["x"]}', ["E1", "C1"]) === null, "grounded with unsupported claims must reject");
            assert(parseGroundingVerifierDecision('{"grounded":false}', ["E1", "C1"]) === null, "ungrounded without reasons must reject");
            assert(parseGroundingVerifierDecision('{"grounded":true,"evidence_chunk_ids":["UNKNOWN"]}', ["E1", "C1"]) === null, "unknown evidence id must reject");
          });
          ''')

          router_path.write_text(router)
          gen_path.write_text(gen)

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Static and regression validation
        run: |
          deno fmt --check supabase/functions/_shared/llm-router.ts supabase/functions/generate-reply/index.ts supabase/functions/_shared/llm-router-grounding.test.ts
          deno check supabase/functions/_shared/llm-router.ts
          deno check supabase/functions/generate-reply/index.ts
          deno test --allow-env --allow-net supabase/functions/_shared/llm-router-grounding.test.ts
          git diff --check

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/llm-router.ts supabase/functions/generate-reply/index.ts supabase/functions/_shared/llm-router-grounding.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: recover grounded conversation failures without handoff"
          git push origin HEAD:main
