name: Director Task3C UI source transaction
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/director-task3c-ui-transaction-20261110.yml]
permissions:
  contents: write
concurrency:
  group: director-task3c-ui-transaction-20261110
  cancel-in-progress: false
jobs:
  source-transaction:
    if: github.actor == 'ebixsolutions'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Finish the same source-only transaction with actual failed assertions repaired
        shell: bash
        env:
          C3_REACT_TEST_ROOT: ${{ runner.temp }}/task3c-react
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,yaml
          ref='29c919e421076e0eb129f82bf081b4c0a0e46794'
          path='.github/workflows/director-task3c-ui-transaction-20261110.yml'
          previous=yaml.safe_load(subprocess.check_output(['git','show',ref+':'+path],text=True))
          step=next(s for s in previous['jobs']['source-transaction']['steps'] if s.get('name')=='Execute the same bounded Director source transaction')
          script=step['run']
          old="execute('install',scripts['Install unchanged application and isolated renderer dependencies'])"
          new="execute('install',scripts['Install unchanged application and isolated renderer dependencies'].replace('react-test-renderer@19.2.0','react-test-renderer@19.2.0 react-dom@19.2.0 jsdom@26.1.0'))"
          assert script.count(old)==1
          script=script.replace(old,new)
          old="detailNew=detailNew.replace('selectedIdRef.current !== ticketId || ','')"
          new="detailNew=detailNew.replace('selectedIdRef.current !== ticketId ||','')\nassert 'selectedIdRef' not in detailNew"
          assert script.count(old)==1
          script=script.replace(old,new)
          before="execute('full-repository-validation',scripts['Validate actual source in the complete authoritative repository'])"
          bundle="execute('save-source-before-validation',\"git bundle create \\\"$RUNNER_TEMP/task3c-ui-evidence/source-before-validation.bundle\\\" b948ec7d943d88e35687c84631214cc1429741ca..HEAD\")\n"
          assert script.count(before)==1
          script=script.replace(before,bundle+before)
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Preserve scoped source validation and previous failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task3c-director-ui-source-${{ github.sha }}
          path: ${{ runner.temp }}/task3c-ui-evidence
          if-no-files-found: error
          retention-days: 30
