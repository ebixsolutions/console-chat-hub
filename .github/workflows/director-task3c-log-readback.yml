name: Director Task3C bounded CI diagnostics
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/director-task3c-log-readback.yml]
permissions:
  actions: read
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read original failed job tail only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,os,pathlib
          url='https://api.github.com/repos/ebixsolutions/console-chat-hub/actions/jobs/131676337406/logs'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: text=r.read().decode('utf-8',errors='replace')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'original-job-tail.txt'
          out.write_text('\n'.join(text.splitlines()[-180:])+'\n')
          print('Original job tail saved; no source/runtime write or test dispatch')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task3c-original-ci-error-tail
          path: ${{ runner.temp }}/original-job-tail.txt
          retention-days: 3
