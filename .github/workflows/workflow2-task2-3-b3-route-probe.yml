name: Workflow2 Task2.3 B3 Route Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow2-task2-3-b3-route-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Singapore routes without credentials or writes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://py.ebixmall.com/py-knowledge-base'
          entity_status=$(curl --silent --show-error --output /tmp/entity.txt --write-out '%{http_code}' \
            --max-time 20 "$BASE/api/entities/KBDocument/__task2_3_probe_not_found__" || true)
          review_status=$(curl --silent --show-error --output /tmp/review.txt --write-out '%{http_code}' \
            --max-time 20 -X POST "$BASE/api/functions/kbReviewExecute" \
            -H 'content-type: application/json' -d '{}' || true)
          echo "B1_PUBLIC_ENTITY_ROUTE_HTTP=$entity_status"
          echo "B3_PUBLIC_REVIEW_ROUTE_HTTP=$review_status"
          python - "$entity_status" "$review_status" <<'PY'
          import sys
          entity=int(sys.argv[1] or 0); review=int(sys.argv[2] or 0)
          if entity == 0 or review == 0:
              raise SystemExit('STOP_SINGAPORE_BACKEND_NETWORK_UNREACHABLE')
          if entity == 404:
              raise SystemExit('FAIL_CANONICAL_ENTITY_ROUTE_MISSING')
          if review == 404:
              raise SystemExit('STOP_B3_REVIEW_EXECUTOR_NOT_DEPLOYED')
          # Protected endpoint usually rejects unauthenticated requests with 401/403.
          # 400/422 also proves route existence if validation happens before auth.
          if review in (401,403,400,422):
              print('B3_REVIEW_EXECUTOR_ROUTE=PASS')
          elif 200 <= review < 300:
              raise SystemExit('FAIL_B3_REVIEW_EXECUTOR_UNAUTHENTICATED_ACCESS')
          elif review >= 500:
              raise SystemExit('STOP_B3_REVIEW_EXECUTOR_RUNTIME_UNHEALTHY')
          else:
              print('B3_REVIEW_EXECUTOR_ROUTE=PASS_HTTP_'+str(review))
          PY
