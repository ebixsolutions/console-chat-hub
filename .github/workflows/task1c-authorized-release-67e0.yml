name: Task1C exact catalogue source - no deployment
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/task1c-authorized-release-67e0.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: c3-task1-source-transport
  cancel-in-progress: false
jobs:
  same-task1c-source:
    if: github.repository == 'ebixsolutions/console-chat-hub' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'a1f91b3a3c839e61927478307e94312ab9db8003'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.9.8}
      - name: Restore hash-bound source in complete authoritative repository
        env:
          SOURCE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os,json,base64,hashlib,pathlib,urllib.request
          oid='4c1188cdeb74c309f5b74dbaf3319e80cdade776'
          req=urllib.request.Request('https://api.github.com/repos/ebixsolutions/console-chat-hub/git/blobs/'+oid,headers={'Authorization':'Bearer '+os.environ['SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
          obj=json.load(urllib.request.urlopen(req,timeout=45));raw=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==oid
          assert hashlib.sha256(raw).hexdigest()=='4af40acb607be65dd4e518212944b280fe7af939db3a4db4572b955eb03d2ab7'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'task1c-source.py').write_bytes(raw)
          PY
          python3 "$RUNNER_TEMP/task1c-source.py"
      - name: Validate source, price-stock-memory regressions and complete handlers
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          result="$RUNNER_TEMP/task1c-catalogue-source"; failed=0
          run(){ local name="$1"; shift; printf '%s\n' "$*" > "$result/$name.command.txt"; "$@" > "$result/$name.log" 2>&1; local code=$?; printf '%s\t%s\n' "$name" "$code" >> "$result/exits.tsv"; tail -n 12 "$result/$name.log"; if test "$code" != 0; then failed=1; fi; }
          run install npm ci
          run source-chain node --disable-warning=ExperimentalWarning --experimental-strip-types --test tests/task1-director/source-chain.test.mjs
          run typecheck npx tsc --noEmit
          run build npm run build
          run source-controls node .github/scripts/c3_unified_production_source_gate.test.mjs
          run source-gate node .github/scripts/c3_unified_production_source_gate.mjs
          run catalogue-b2-memory deno test --no-config --no-lock --allow-read --allow-env --deny-net --node-modules-dir=manual supabase/functions/_shared/canonical-kb-direct-answer.test.ts supabase/functions/_shared/canonical-kb-b2-price.test.ts supabase/functions/_shared/product-factual-query.test.ts supabase/functions/_shared/conversation-long-memory.test.ts
          git worktree add --detach "$RUNNER_TEMP/task1c-handlers" "$GITHUB_SHA" || exit 1
          run handlers-check bash -c 'cd "$RUNNER_TEMP/task1c-handlers" && deno check --no-lock --node-modules-dir=auto supabase/functions/generate-reply/index.ts supabase/functions/agent-assist/index.ts supabase/functions/kb-search-proxy/index.ts'
          run source-clean git diff --exit-code HEAD
          exit "$failed"
      - name: Preserve exact source result without deploying or updating any ref
        shell: bash
        run: |
          python3 <<'PY'
          import os,json,pathlib,subprocess,hashlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'task1c-catalogue-source'
          receipt=json.loads((out/'candidate.json').read_text())
          exits=[{'name':n,'exit_code':int(c)} for n,c in (line.split('\t') for line in (out/'exits.tsv').read_text().splitlines())]
          assert len(exits)==9 and all(row['exit_code']==0 for row in exits)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==receipt['head']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==receipt['tree']
          for row in receipt['files']:
            raw=pathlib.Path(row['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==row['sha256']
            dst=out/'source'/row['path'];dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(raw)
          receipt.update(source_validation='PASS_SCOPED',commands=exits,uat_start_allowed=False,functional_uat_accepted=False)
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Keep actual commands, errors and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1c-catalogue-source-${{ github.run_id }}
          path: ${{ runner.temp }}/task1c-catalogue-source
          if-no-files-found: error
          retention-days: 14
