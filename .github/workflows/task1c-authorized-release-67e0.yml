name: Task1C authorized exact two-function release
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/task1c-authorized-release-67e0.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-task1-authorized-production-release
  cancel-in-progress: false
jobs:
  exact-release:
    if: github.repository == 'ebixsolutions/console-chat-hub' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '67e0b5086cdc01f4a0f8b64bed7c718ec85218a3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67e0b5086cdc01f4a0f8b64bed7c718ec85218a3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load immutable exact-scope release operation
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os,json,base64,hashlib,pathlib,urllib.request
          sha='9f46a874ecd9af427dbfba365f958709e840e125'
          req=urllib.request.Request('https://api.github.com/repos/ebixsolutions/console-chat-hub/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
          obj=json.load(urllib.request.urlopen(req,timeout=45));raw=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
          assert hashlib.sha256(raw).hexdigest()=='ed727d88ce336ec4264b58c38034f7134b4199adcf98e7b8f24d073f9f9c17f0'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'task1c-release.py';path.write_bytes(raw)
          print('EXACT_OPERATION_HASH_MATCH')
          PY
      - name: Capture and verify both complete production preimages before writing
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/task1c-release.py" prepare
      - name: Preserve verified rollback payloads before deployment
        uses: actions/upload-artifact@v4
        with:
          name: task1c-67e0-predeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/task1c-authorized-release
          if-no-files-found: error
          retention-days: 14
      - name: Deploy only approved existing Functions and compare all live bytes
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python3 "$RUNNER_TEMP/task1c-release.py" apply > "$RUNNER_TEMP/task1c-authorized-release/apply.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/task1c-authorized-release/apply.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/task1c-authorized-release/apply.exit.txt"
          exit "$code"
      - name: Preserve deployment readback or exact rollback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1c-67e0-release-${{ github.run_id }}
          path: ${{ runner.temp }}/task1c-authorized-release
          if-no-files-found: error
          retention-days: 14
