name: Task1C approved a0c625a6 two-function deployment
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/task1c-authorized-release-67e0.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: c3-task1-authorized-production-release
  cancel-in-progress: false
jobs:
  exact-approved-release:
    if: github.repository == 'ebixsolutions/console-chat-hub' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'a0c625a66dab67fbfd8cb5bd8b0b51cd14d0d727'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0c625a66dab67fbfd8cb5bd8b0b51cd14d0d727
          fetch-depth: 0
          persist-credentials: false
      - name: Load immutable approved release operation
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os,json,base64,hashlib,pathlib,urllib.request
          oid='7d4eeeec5ea778038725428b9d2c1daad7dd466a'
          req=urllib.request.Request('https://api.github.com/repos/ebixsolutions/console-chat-hub/git/blobs/'+oid,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=45) as response: obj=json.load(response)
          raw=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==oid
          assert hashlib.sha256(raw).hexdigest()=='7b0ddc8b25b034dc49f9c11c9f9f9ce33151108e99c374ae7e562ed867a5988a'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'task1c-a0c-release.py').write_bytes(raw)
          print('EXACT_APPROVED_OPERATION_HASH_MATCH')
          PY
      - name: Capture and verify both complete live preimages before any deployment
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task1c-a0c625a6-release"
          python3 "$RUNNER_TEMP/task1c-a0c-release.py" prepare | tee "$RUNNER_TEMP/task1c-a0c625a6-release/prepare.log"
      - name: Persist both complete rollback payloads before Production mutation
        uses: actions/upload-artifact@v4
        with:
          name: task1c-a0c625a6-predeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/task1c-a0c625a6-release
          if-no-files-found: error
          retention-days: 14
      - name: Deploy approved generate-reply and agent-assist with exact rollback and readback
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python3 "$RUNNER_TEMP/task1c-a0c-release.py" apply > "$RUNNER_TEMP/task1c-a0c625a6-release/apply.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/task1c-a0c625a6-release/apply.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/task1c-a0c625a6-release/apply.exit.txt"
          exit "$code"
      - name: Preserve exact deployment or rollback receipt without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task1c-a0c625a6-release-${{ github.run_id }}
          path: ${{ runner.temp }}/task1c-a0c625a6-release
          if-no-files-found: error
          retention-days: 14
