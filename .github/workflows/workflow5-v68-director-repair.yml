name: Workflow 5 v68 Director Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow5-v68-director-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply Workflow 5 v68 repair
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | python
      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          deno test --allow-env tests/edge/workflow5-multilingual-privacy.test.ts
          deno test --allow-env tests/edge/workflow4-latest-condition-state.test.ts
          deno test --allow-env tests/edge/task4-1-current-context-memory.test.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          grep -Fq 'resolveWorkflow5ConversationLanguage(_h1LastMsg' supabase/functions/generate-reply/index.ts
          grep -Fq 'buildWorkflow5TopicalClarification(params.latest_message_content' supabase/functions/generate-reply/index.ts
          echo WORKFLOW5_V68_SOURCE_GATE=PASS
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          git add supabase/functions/_shared/conversation-runtime-state.ts supabase/functions/generate-reply/index.ts tests/edge/workflow5-multilingual-privacy.test.ts
          git commit -m 'fix: preserve multilingual context through fallback recovery'
          git push origin HEAD:main
