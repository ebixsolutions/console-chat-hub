name: A3 Task1 Build Current Generate Reply Bundle

on:
  push:
    paths:
      - '.github/workflows/a3-task1-build-current-generate-reply-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify baseline
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "2.7.1"
          test -s supabase/functions/generate-reply/index.ts
          test -s supabase/functions/_shared/commerce-semantic-interpreter.ts
          grep -q 'buildPersistentCommerceStateSummary' supabase/functions/_shared/commerce-semantic-interpreter.ts
          grep -q 'interpretCommerceSemantics' supabase/functions/generate-reply/index.ts
      - name: Bundle complete dependency closure
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/generated/a3-task1-current
          npx --yes esbuild@0.25.9 supabase/functions/generate-reply/index.ts \
            --bundle \
            --format=esm \
            --platform=neutral \
            --target=es2022 \
            --external:'https:*' \
            --external:'http:*' \
            --external:'jsr:*' \
            --external:'npm:*' \
            --outfile=supabase/functions/generated/a3-task1-current/index.ts
          test -s supabase/functions/generated/a3-task1-current/index.ts
          grep -q 'buildPersistentCommerceStateSummary' supabase/functions/generated/a3-task1-current/index.ts
          grep -q 'preorder_intent_acknowledged_without_order_or_payment_promotion' supabase/functions/generated/a3-task1-current/index.ts
          sha256sum supabase/functions/generated/a3-task1-current/index.ts > supabase/functions/generated/a3-task1-current/index.ts.sha256
          printf '%s\n' "${GITHUB_SHA}" > supabase/functions/generated/a3-task1-current/source_commit.txt
      - name: Commit generated bundle
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/generated/a3-task1-current/
          if git diff --cached --quiet; then
            echo 'bundle unchanged'
            exit 0
          fi
          git commit -m 'build(a3): refresh authoritative generate-reply bundle'
          git push origin HEAD:main
