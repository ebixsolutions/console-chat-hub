name: A3 Hotfix 4 Director Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task-a3-hotfix4-director-apply.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply exact A3 root-cause patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('supabase/functions/_shared/commerce-state-runtime.ts')
          s = p.read_text()

          old_sig = '''function deriveA3RuntimeEvents(
            input: CommerceRuntimeInput,
            hints: CommerceTurnEntityHint[],
          ): CommerceStateEvent[] {'''
          new_sig = '''function deriveA3RuntimeEvents(
            input: CommerceRuntimeInput,
            hints: CommerceTurnEntityHint[],
            previous: ConversationCommerceState,
          ): CommerceStateEvent[] {'''
          assert old_sig in s, 'deriveA3RuntimeEvents signature baseline mismatch'
          s = s.replace(old_sig, new_sig, 1)

          old_vars = '''  const mentioned = hintsMentionedInTurn(text, hints);
            const quantity = parseCount(text);
            const cancelled = detectCancellation(text);
            const deferred = detectDeferral(text);'''
          new_vars = '''  const mentioned = hintsMentionedInTurn(text, hints);
            const quantity = parseCount(text);
            const cancelled = detectCancellation(text);
            const deferred = detectDeferral(text);
            const additive = detectAdditiveEntityCreationSignal(text);
            const explicitCreation = detectExplicitEntityCreationSignal(text);'''
          assert old_vars in s, 'derive vars baseline mismatch'
          s = s.replace(old_vars, new_vars, 1)

          old_loop = '''    if (quantity !== null) {
              events.push({ type: "SET_ENTITY_QUANTITY", entity_id: hint.entity_id, quantity, provenance });
            }
            events.push({ type: "SET_ENTITY_STATUS", entity_id: hint.entity_id, status: "tentative", provenance });'''
          new_loop = '''    if (quantity !== null && (additive || mentioned.length === 1)) {
              const existing = previous.entities.find((entity) => entity.entity_id === hint.entity_id);
              const nextQuantity = additive && existing ? existing.quantity + quantity : quantity;
              events.push({ type: "SET_ENTITY_QUANTITY", entity_id: hint.entity_id, quantity: nextQuantity, provenance });
            }
            // A KB/safety/descriptive category mention must not rewrite transactional
            // entity status/provenance. Only explicit transactional evidence may do so.
            if (quantity !== null || explicitCreation) {
              events.push({ type: "SET_ENTITY_STATUS", entity_id: hint.entity_id, status: "tentative", provenance });
            }'''
          assert old_loop in s, 'derive quantity/status baseline mismatch'
          s = s.replace(old_loop, new_loop, 1)

          marker = '''export function filterGhostUnscopedHints(
          '''
          helper = '''export function detectAdditiveEntityCreationSignal(text: string): boolean {
            const t = clean(text);
            if (!t) return false;
            return /(?:另外|再加|再要|加多|多要|多買|多买|新增多|加裝多|加装多|another|extra|additional|add\\s+(?:another|one|two|three|\\d))/i.test(t);
          }

          export function filterGhostUnscopedHints(
          '''
          assert marker in s and 'detectAdditiveEntityCreationSignal' not in s, 'additive helper baseline mismatch'
          s = s.replace(marker, helper, 1)

          old_filter = '''  const explicitCreation = detectExplicitEntityCreationSignal(text);
            return hints.filter((hint) => {
              const roomKey = hint.entity_id.split(":")[1];
              if (roomKey !== "unscoped") return true;
              if (state.entities.some((e) => e.entity_id === hint.entity_id)) return true;
              // A bare category mention (question / KB / descriptive) never creates a
              // new unscoped entity without an explicit creation signal.
              return explicitCreation;
            });'''
          new_filter = '''  const explicitCreation = detectExplicitEntityCreationSignal(text);
            const additive = detectAdditiveEntityCreationSignal(text);
            const categories = new Set(detectCategories(text).map((category) => category.key));
            const rooms = detectRooms(text);
            return hints.filter((hint) => {
              if (!categories.has(hint.category)) return true;
              const roomKey = hint.entity_id.split(":")[1];

              if (rooms.length > 0 && roomKey === "unscoped") return false;
              if (additive && rooms.length === 0) return roomKey === "unscoped";
              if (roomKey !== "unscoped") return true;
              if (state.entities.some((e) => e.entity_id === hint.entity_id)) return true;
              if (!explicitCreation) return false;

              const hasConcreteSameCategory = state.entities.some(
                (entity) => entity.category === hint.category && !entity.entity_id.endsWith(":unscoped") &&
                  entity.status !== "cancelled" && entity.status !== "deferred",
              );
              if (rooms.length === 0 && hasConcreteSameCategory) return false;
              return true;
            });'''
          assert old_filter in s, 'ghost filter baseline mismatch'
          s = s.replace(old_filter, new_filter, 1)

          old_call = '...deriveA3RuntimeEvents(input, hints)]);'
          new_call = '...deriveA3RuntimeEvents(input, hints, previous)]);'
          assert old_call in s, 'reduceTurn call baseline mismatch'
          s = s.replace(old_call, new_call, 1)

          old_tone = '''  if (language === "en") {
              return `${known ? `I still have your details on record: ${known}. ` : ""}Whether the site actually supports the installation has to be confirmed onsite by our technician — I won't guess that remotely.`;
            }
            if (language === "zh-CN") {
              return `${known ? `你的资料我仍然保留：${known}。` : ""}现场是否符合安装条件，需要师傅上门实地确认，我不会在线上猜。`;
            }
            return `${known ? `你嘅資料我仍然保留住：${known}。` : ""}現場實際做唔做得到，要師傅上門確認先作準，我唔會隔住screen估。`;'''
          new_tone = '''  if (language === "en") {
              return `${known ? `I still have your details on record: ${known}. ` : ""}For safety and accuracy, our technician needs to inspect the site in person before we can confirm whether the installation is suitable.`;
            }
            if (language === "zh-CN") {
              return `${known ? `我们已保留您之前提供的资料：${known}。` : ""}为确保安全和准确，需要师傅上门检查窗口尺寸、承托及安装环境后再确认是否适合安装。`;
            }
            return `${known ? `我哋已保留您之前提供嘅資料：${known}。` : ""}為確保安全同準確，需要師傅上門檢查窗口尺寸、承托同安裝環境後先可以確認是否適合安裝。`;'''
          assert old_tone in s, 'professional tone baseline mismatch'
          s = s.replace(old_tone, new_tone, 1)

          p.write_text(s)

          test = r'''import { createEmptyConversationCommerceState, type ConversationCommerceState } from "../../supabase/functions/_shared/commerce-state-contract.ts";
          import { buildCommerceEntityHints, reduceTurn } from "../../supabase/functions/_shared/commerce-state-runtime.ts";

          const company = "3d6e17b5-ec79-4f75-aa7f-eaa824ff8493";
          const conversation = "11111111-1111-4111-8111-111111111111";
          function assert(ok: unknown, message: string): asserts ok { if (!ok) throw new Error(message); }
          function apply(state: ConversationCommerceState, text: string, id: string, history: string[] = []): ConversationCommerceState {
            const hints = buildCommerceEntityHints([text, ...history]);
            return reduceTurn(state, { conversation_id: conversation, company_id: company, source_message_id: id, text, language: "zh-TW", history: history.map((content) => ({ role: "visitor", content })) }, hints);
          }
          function entity(state: ConversationCommerceState, id: string) { return state.entities.find((item) => item.entity_id === id); }
          const t1 = "我睡房有2部冷氣。";
          const t2 = "窗口夠唔夠安全安裝冷氣？";
          const t3 = "另外加1部冷氣。";
          const s0 = createEmptyConversationCommerceState();
          const s1 = apply(s0, t1, "11111111-1111-4111-8111-111111111101");
          assert(entity(s1, "air_conditioner:bedroom")?.quantity === 2, "turn1 bedroom must be x2");
          assert(!entity(s1, "air_conditioner:unscoped"), "turn1 must not create unscoped");
          const bedroomP1 = entity(s1, "air_conditioner:bedroom")?.provenance.source_message_id;
          const s2 = apply(s1, t2, "11111111-1111-4111-8111-111111111102", [t1]);
          assert(entity(s2, "air_conditioner:bedroom")?.quantity === 2, "safety turn must preserve bedroom x2");
          assert(!entity(s2, "air_conditioner:unscoped"), "safety turn must create zero ghost entities");
          assert(entity(s2, "air_conditioner:bedroom")?.provenance.source_message_id === bedroomP1, "safety turn must not rewrite entity provenance");
          assert(s2.installation.pending_checks.includes("window_opening_check"), "safety turn must retain professional window check");
          const s3 = apply(s2, t3, "11111111-1111-4111-8111-111111111103", [t2, t1]);
          assert(entity(s3, "air_conditioner:bedroom")?.quantity === 2, "additive category turn must preserve bedroom x2");
          assert(entity(s3, "air_conditioner:unscoped")?.quantity === 1, "additive category turn must add exactly one new unscoped item");
          assert(s3.entities.filter((item) => item.category === "air_conditioner").length === 2, "must have exactly two AC entities after additive turn");
          const scopedAdd = apply(s1, "睡房再加1部冷氣。", "11111111-1111-4111-8111-111111111104", [t1]);
          assert(entity(scopedAdd, "air_conditioner:bedroom")?.quantity === 3, "scoped additive turn must increment 2 to 3");
          assert(!entity(scopedAdd, "air_conditioner:unscoped"), "scoped additive turn must not create unscoped");
          const contextual = apply(s1, "我要2部冷氣。", "11111111-1111-4111-8111-111111111105", [t1]);
          assert(entity(contextual, "air_conditioner:bedroom")?.quantity === 2, "category-only non-additive reference must resolve existing concrete context");
          assert(!entity(contextual, "air_conditioner:unscoped"), "category-only contextual reference must not create ghost");
          const fresh = apply(s0, "我要2部冷氣。", "11111111-1111-4111-8111-111111111106");
          assert(entity(fresh, "air_conditioner:unscoped")?.quantity === 2, "explicit transactional evidence on empty state must create new entity");
          const source = await Deno.readTextFile("supabase/functions/_shared/commerce-state-runtime.ts");
          for (const rude of ["隔住screen估", "我不会在线上猜", "I won't guess that remotely"]) assert(!source.includes(rude), `rude phrase remains: ${rude}`);
          assert(source.includes("為確保安全同準確"), "polite zh-TW safety wording missing");
          console.log(JSON.stringify({ status: "PASS", cases: 7, gate: "TASK_A3_HOTFIX4_ENTITY_AND_TONE" }));
          '''
          Path('.github/scripts/task_a3_hotfix4_entity_and_tone_test.ts').write_text(test)
      - name: Install dependencies
        run: npm ci
      - name: Hotfix 4 entity + tone regression
        run: deno run --allow-read .github/scripts/task_a3_hotfix4_entity_and_tone_test.ts
      - name: Frozen A3 ghost regression
        run: deno run --allow-read .github/scripts/task_a3_ghost_entity_authority_test.ts
      - name: Frozen A3 negated transaction regression
        run: deno run --allow-read .github/scripts/task_a3_negated_transaction_authority_test.ts
      - name: Frozen A3 calculation regression
        run: deno run --allow-read .github/scripts/task_a3_calculation_authority_test.ts
      - name: Strict runtime compile
        run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --allowImportingTsExtensions supabase/functions/_shared/commerce-state-runtime.ts supabase/functions/_shared/commerce-state-contract.ts supabase/functions/_shared/commerce-state-reducer.ts supabase/functions/_shared/commerce-state-authority.ts
      - name: A3 final gate including production build
        run: node .github/scripts/task_a3_final_gate.mjs
      - name: Commit validated implementation and remove temporary workflow
        run: |
          rm .github/workflows/task-a3-hotfix4-director-apply.yml
          git config user.name "A3 Director"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/_shared/commerce-state-runtime.ts .github/scripts/task_a3_hotfix4_entity_and_tone_test.ts .github/workflows/task-a3-hotfix4-director-apply.yml
          git commit -m "fix(a3): preserve scoped quantities and polite safety routing"
          git push origin HEAD:main

# trigger-2
