name: Task 4.1 AI KB Production Final Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task4-1-final-gate.yml'
      - 'scripts/task4-1-source-runtime-regression.ts'
      - 'supabase/functions/generate-reply/index.ts'
      - 'supabase/functions/_shared/conversation-intelligence.ts'
      - 'supabase/functions/_shared/kb-client.ts'
      - 'supabase/functions/_shared/llm-router.ts'
      - 'supabase/functions/_shared/escalation-rules.ts'
      - 'supabase/functions/_shared/escalation-live.ts'
      - 'supabase/functions/_shared/escalation-signals.ts'
      - '.env'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install authoritative dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Credential-independent conversational / escalation / KB regression
        run: npx --yes tsx scripts/task4-1-source-runtime-regression.ts
      - name: Runtime authority and legacy-backend guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nrfxhqabwblzxoushgnm' .env
          grep -q 'ENABLE_KB_ADAPTER") !== "false"' supabase/functions/generate-reply/index.ts
          grep -q 'ESC_ENABLE_REQUIRED_RULES_LIVE") === "false"' supabase/functions/generate-reply/index.ts
          grep -q 'enabled.add("R2")' supabase/functions/generate-reply/index.ts
          grep -q 'getSupabaseAdminKey' supabase/functions/generate-reply/index.ts
          grep -q 'getSupabaseAdminKey' supabase/functions/_shared/kb-client.ts
          grep -q 'getSupabaseAdminKey' supabase/functions/_shared/llm-router.ts
          if grep -R -n --exclude-dir=node_modules --exclude='*.md' 'hvmtoqiwdqvgnjepxwrc' \
              src supabase/functions scripts/task4-1-*; then
            echo 'FAIL: legacy Supabase ref in active Task 4.1 runtime scope' >&2
            exit 1
          fi
          echo 'PASS: canonical runtime authority / legacy=0'
      - name: Production client SSR Nitro build
        run: npm run build
      - name: Confirm deployed Edge and legacy-disable override retirement
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@latest functions list --project-ref "$PROJECT_REF" --output json >/tmp/functions.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/functions.json'))
          matches=[r for r in rows if str(r.get('slug') or r.get('name') or '')=='generate-reply']
          assert matches, 'generate-reply deployment missing'
          row=matches[0]
          print('PASS: generate-reply deployed; version=' + str(row.get('version','unknown')) + '; status=' + str(row.get('status','unknown')))
          PY
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" --output json >/tmp/secrets.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/secrets.json'))
          names={str(r.get('name','')) for r in rows if isinstance(r,dict)}
          forbidden={'ENABLE_KB_ADAPTER','ESC_ENABLE_REQUIRED_RULES_LIVE','ESC_ENABLE_S0'}
          remain=sorted(forbidden & names)
          assert not remain, f'legacy disable overrides remain: {remain}'
          print('PASS: legacy explicit-disable overrides absent')
          PY
      - name: Production credential gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          rows=json.load(open('/tmp/secrets.json'))
          names={str(r.get('name','')) for r in rows if isinstance(r,dict)}
          required_vertex=['GOOGLE_SERVICE_ACCOUNT_JSON','GOOGLE_PROJECT_ID','GOOGLE_REGION']
          missing=[x for x in required_vertex if x not in names]
          kb_options=['KB_SINGAPORE_TENANT_API_KEYS_JSON','KB_SINGAPORE_JWT_SECRET','KB_RAG_TENANT_TOKENS_JSON','KB_RAG_TOKEN']
          if not any(x in names for x in kb_options):
              missing.append('KB_SINGAPORE_CREDENTIAL(one supported mechanism)')
          if 'KB_SINGAPORE_TENANT_MAP_JSON' not in names:
              missing.append('KB_SINGAPORE_TENANT_MAP_JSON')
          if missing:
              print('EXTERNAL_RUNTIME_BLOCKERS=' + ','.join(missing))
              print('TASK 4.1 FINAL GATE: STOP — required production credentials unavailable')
              sys.exit(78)
          print('PASS: required Vertex and Singapore KB credential names present')
          PY
      - name: Task 4.1 READY marker
        run: echo 'TASK 4.1 FINAL GATE: PASS — READY'
