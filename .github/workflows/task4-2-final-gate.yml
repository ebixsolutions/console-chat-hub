name: Task 4.2 Human Handoff Final Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task4-2-final-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install authoritative dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Live Console source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = {
              'route': Path('src/routes/_authenticated/console.conversations.index.tsx'),
              'panel': Path('src/components/console/AgentToolPanel.tsx'),
              'return': Path('supabase/functions/return-to-ai/index.ts'),
              'assist': Path('supabase/functions/agent-assist/index.ts'),
              'send': Path('supabase/functions/agent-send-reply/index.ts'),
              'poll': Path('supabase/functions/widget-poll-messages/index.ts'),
              'widget': Path('public/widget/chat.js'),
          }
          text = {k: p.read_text() for k, p in files.items()}

          def must(key, label, needle):
              assert needle in text[key], f'FAIL {label}: missing {needle!r} in {files[key]}'
              print(f'PASS {label}')

          def absent(key, label, needle):
              assert needle not in text[key], f'FAIL {label}: forbidden {needle!r} in {files[key]}'
              print(f'PASS {label}')

          must('route', 'waiting-human filter label', 'Waiting for Human')
          must('route', 'waiting-human filter logic', 'filter === "waiting_human"')
          must('route', 'human-control filter logic', 'c.status === "pending" && Boolean(c.assigned_agent_id)')
          must('route', 'return-to-ai checklist payload', 'closure_checklist')
          must('route', 'return-to-ai issue-resolved assertion', 'issue_resolved: true')
          must('route', 'return-to-ai low-risk assertion', 'low_risk_followup: true')

          must('return', 'server checklist enforcement', 'closure_checklist_required')
          must('return', 'server human-control enforcement', 'human_control_required')
          must('return', 'return-to-ai tenant scope', 'resolveAgentCompanyScope')
          must('return', 'atomic return RPC', 'return_to_ai_tx')

          must('panel', 'Knowledge Helper exposed', 'Knowledge Helper')
          must('panel', 'Policy Check exposed', 'Policy Check')
          must('panel', 'Knowledge Helper action', 'runTool("knowledge_helper")')
          must('panel', 'Policy Check action', 'runTool("check_policy")')
          absent('panel', 'no Live Console Suggest Reply action', 'runTool("suggest_reply")')

          must('assist', 'knowledge-helper backend branch', 'toolType==="knowledge_helper"')
          must('assist', 'knowledge-helper evidence contract', 'full_content_evidence')

          must('send', 'atomic human send RPC', 'agent_send_reply_tx')
          must('send', 'takeover-required guard', 'takeover_required')
          must('send', 'other-owner guard', 'owned_by_another_agent')
          must('send', 'human-control send guard', 'human_control_required')

          must('poll', 'human-support computed state', 'const humanSupportState')
          must('poll', 'waiting-vs-assigned state derivation', 'conv.assigned_agent_id ? "assigned" : "waiting"')
          must('poll', 'human-support response state', 'human_support: { state: humanSupportState')
          must('poll', 'agent-assigned response flag', 'agent_assigned: Boolean(conv.assigned_agent_id)')

          must('widget', 'assigned-agent AI pause UX', 'AI replies are paused while the agent handles this conversation')
          must('widget', 'waiting-human UX', 'You are waiting for a team member')

          legacy = 'hvmtoqiwdqvgnjepxwrc'
          for key, body in text.items():
              assert legacy not in body, f'FAIL legacy target ref in {files[key]}'
          print('PASS Task 4.2 active runtime legacy target ref = 0')
          print('TASK4_2_ACTIVE_SOURCE_CONTRACT=PASS')
          PY
      - name: Production client SSR Nitro build
        run: npm run build
      - name: Deployed Edge contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@latest functions list --project-ref "$PROJECT_REF" --output json >/tmp/functions.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/functions.json'))
          by={str(r.get('slug') or r.get('name')):r for r in rows}
          for name in ['agent-assist','return-to-ai','take-over-conversation','agent-send-reply','widget-poll-messages']:
              r=by.get(name)
              assert r, f'{name} missing'
              assert str(r.get('status','')).upper()=='ACTIVE', r
              print(f'PASS {name} ACTIVE version={r.get("version")}')
          PY
      - name: Human support tool credential gate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" --output json >/tmp/secrets.json
          python - <<'PY'
          import json,sys
          rows=json.load(open('/tmp/secrets.json'))
          names={str(r.get('name','')) for r in rows if isinstance(r,dict)}
          missing=[]
          if 'ANTHROPIC_API_KEY' not in names:
              missing.append('ANTHROPIC_API_KEY')
          kb=['KB_SINGAPORE_TENANT_API_KEYS_JSON','KB_SINGAPORE_JWT_SECRET','KB_RAG_TENANT_TOKENS_JSON','KB_RAG_TOKEN']
          if not any(x in names for x in kb):
              missing.append('KB_SINGAPORE_CREDENTIAL(one supported mechanism)')
          if 'KB_SINGAPORE_TENANT_MAP_JSON' not in names:
              missing.append('KB_SINGAPORE_TENANT_MAP_JSON')
          if missing:
              print('EXTERNAL_RUNTIME_BLOCKERS=' + ','.join(missing))
              print('TASK 4.2 FINAL GATE: STOP — human-support tool credentials unavailable')
              sys.exit(78)
          print('PASS human-support tool credential names present')
          PY
      - name: READY marker
        run: echo 'TASK 4.2 FINAL GATE PASS READY'
