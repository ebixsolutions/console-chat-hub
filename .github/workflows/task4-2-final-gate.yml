name: Task 4.2 Human Handoff Final Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task4-2-final-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nrfxhqabwblzxoushgnm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install authoritative dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Live Console source contract
        shell: bash
        run: |
          set -euo pipefail
          ROUTE='src/routes/_authenticated/console.conversations.index.tsx'
          PANEL='src/components/console/AgentToolPanel.tsx'
          RETURN='supabase/functions/return-to-ai/index.ts'
          ASSIST='supabase/functions/agent-assist/index.ts'
          SEND='supabase/functions/agent-send-reply/index.ts'
          POLL='supabase/functions/widget-poll-messages/index.ts'
          WIDGET='public/widget/chat.js'

          grep -q 'Waiting for Human' "$ROUTE"
          grep -q 'filter === "waiting_human"' "$ROUTE"
          grep -q 'c.status === "pending" && Boolean(c.assigned_agent_id)' "$ROUTE"
          grep -q 'closure_checklist' "$ROUTE"
          grep -q 'issue_resolved: true' "$ROUTE"
          grep -q 'low_risk_followup: true' "$ROUTE"

          grep -q 'closure_checklist_required' "$RETURN"
          grep -q 'human_control_required' "$RETURN"
          grep -q 'resolveAgentCompanyScope' "$RETURN"
          grep -q 'return_to_ai_tx' "$RETURN"

          grep -q 'Knowledge Helper' "$PANEL"
          grep -q 'Policy Check' "$PANEL"
          grep -q 'runTool("knowledge_helper")' "$PANEL"
          grep -q 'runTool("check_policy")' "$PANEL"
          if grep -q 'runTool("suggest_reply")' "$PANEL"; then
            echo 'FAIL: customer-facing AI suggestion still exposed in Live Console' >&2
            exit 1
          fi
          grep -q 'toolType==="knowledge_helper"' "$ASSIST"
          grep -q 'full_content_evidence' "$ASSIST"

          grep -q 'agent_send_reply_tx' "$SEND"
          grep -q 'takeover_required' "$SEND"
          grep -q 'owned_by_another_agent' "$SEND"
          grep -q 'human_control_required' "$SEND"

          grep -q 'state: "waiting"' "$POLL"
          grep -q 'state: "assigned"' "$POLL"
          grep -q 'agent_assigned' "$POLL"
          grep -q 'AI replies are paused while the agent handles this conversation' "$WIDGET"
          grep -q 'You are waiting for a team member' "$WIDGET"

          if grep -R -n --exclude-dir=node_modules --exclude='*.md' 'hvmtoqiwdqvgnjepxwrc' \
            "$ROUTE" "$PANEL" "$RETURN" "$ASSIST" "$SEND" "$POLL" "$WIDGET"; then
            echo 'FAIL: legacy Supabase ref in Task 4.2 active runtime scope' >&2
            exit 1
          fi
          echo 'TASK4_2_ACTIVE_SOURCE_CONTRACT=PASS'
      - name: Production client SSR Nitro build
        run: npm run build
      - name: Deployed Edge contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          npx --yes supabase@latest functions list --project-ref "$PROJECT_REF" --output json >/tmp/functions.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/functions.json'))
          by={str(r.get('slug') or r.get('name')):r for r in rows}
          for name in ['agent-assist','return-to-ai','take-over-conversation','agent-send-reply','widget-poll-messages']:
              r=by.get(name)
              assert r, f'{name} missing'
              assert str(r.get('status','')).upper()=='ACTIVE', r
              print(f'PASS {name} ACTIVE version={r.get("version")}')
          PY
      - name: Human support tool credential gate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" --output json >/tmp/secrets.json
          python - <<'PY'
          import json,sys
          rows=json.load(open('/tmp/secrets.json'))
          names={str(r.get('name','')) for r in rows if isinstance(r,dict)}
          missing=[]
          if 'ANTHROPIC_API_KEY' not in names:
              missing.append('ANTHROPIC_API_KEY')
          kb=['KB_SINGAPORE_TENANT_API_KEYS_JSON','KB_SINGAPORE_JWT_SECRET','KB_RAG_TENANT_TOKENS_JSON','KB_RAG_TOKEN']
          if not any(x in names for x in kb):
              missing.append('KB_SINGAPORE_CREDENTIAL(one supported mechanism)')
          if 'KB_SINGAPORE_TENANT_MAP_JSON' not in names:
              missing.append('KB_SINGAPORE_TENANT_MAP_JSON')
          if missing:
              print('EXTERNAL_RUNTIME_BLOCKERS=' + ','.join(missing))
              print('TASK 4.2 FINAL GATE: STOP — human-support tool credentials unavailable')
              sys.exit(78)
          print('PASS human-support tool credential names present')
          PY
      - name: READY marker
        run: echo 'TASK 4.2 FINAL GATE PASS READY'
