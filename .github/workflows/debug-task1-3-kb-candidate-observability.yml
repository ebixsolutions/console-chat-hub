name: Debug Task 1.3 KB Candidate Observability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-task1-3-kb-candidate-observability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add candidate diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/kb-search-proxy/index.ts')
          s=p.read_text()
          anchor='''        selected_document_score: winner?.document.document_score ?? null,\n'''
          insert='''        selected_document_score: winner?.document.document_score ?? null,\n        candidate_diagnostics: ranked.evaluated.map((r) => ({\n          document_id: r.document.document_id,\n          title: r.document.title.slice(0, 160),\n          source_type: r.document.source_type.slice(0, 80),\n          method: r.method,\n          confidence: r.confidence,\n          retrieval_score: r.retrievalScore,\n          display_score: r.displayScore,\n          accepted: r.results.length > 0,\n        })),\n'''
          assert anchor in s, 'candidate diagnostics anchor missing'
          assert 'candidate_diagnostics:' not in s, 'candidate diagnostics already present'
          p.write_text(s.replace(anchor, insert, 1))
          PY
          git diff --check
          grep -q 'candidate_diagnostics:' supabase/functions/kb-search-proxy/index.ts
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          git add supabase/functions/kb-search-proxy/index.ts
          git commit -m 'Add KB candidate rerank diagnostics'
          git push origin HEAD:main
