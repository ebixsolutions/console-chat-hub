name: Debug Task 1.3 KB Retrieval Expansion Budget

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-task1-3-kb-candidate-observability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Raise expansion budget to validated floor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/kb-search-proxy/index.ts')
          s=p.read_text()
          old='const RETRIEVAL_EXPANSION_MAX_TOKENS = 384;'
          new='const RETRIEVAL_EXPANSION_MAX_TOKENS = 768;'
          assert old in s, '384-token expansion budget not found'
          assert new not in s, '768-token expansion budget already present'
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          grep -q 'RETRIEVAL_EXPANSION_MAX_TOKENS = 768' supabase/functions/kb-search-proxy/index.ts
      - name: Commit budget fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          git add supabase/functions/kb-search-proxy/index.ts
          git commit -m 'Raise KB query expansion budget to 768 tokens'
          git push origin HEAD:main
