name: Task 3 Security Build Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task3-security-build.yml'
      - 'scripts/task3-security-cutover-final-gate.sh'
      - 'src/integrations/supabase/client.server.ts'
      - 'supabase/migrations/20260829093000_task3_server_only_rls_policy_closure.sql'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible lockfile-only security fixes
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 1 ]]; then
            exit $rc
          fi

      - name: Reinstall from repaired lockfile
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Task 3 final gate
        env:
          TASK3_SKIP_LIVE_SQL: '1'
          TASK3_LIVE_SQL_ASSERTIONS: '15/15'
          TASK3_LEAKED_PASSWORD_PROTECTION: 'plan_limited_free'
        run: bash scripts/task3-security-cutover-final-gate.sh

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Task 3: lockfile security repair"
          git push origin HEAD:main
