name: Task 5.3 Credential Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task5-3-credential-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      KB_KEYS: ${{ secrets.KB_SINGAPORE_TENANT_API_KEYS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate current external credential source without disclosure
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          if [ -z "${KB_KEYS:-}" ]; then
            echo 'KB_GITHUB_SECRET_PRESENT=0'
            echo 'present=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KB_KEYS="$KB_KEYS" python - <<'PY'
          import json,os
          raw=os.environ['KB_KEYS']
          obj=json.loads(raw)
          assert isinstance(obj,dict)
          assert set(obj.keys()) >= {'34','5'}
          for k in ('34','5'):
              assert isinstance(obj[k],str) and len(obj[k].strip())>=16
          print('KB_GITHUB_SECRET_PRESENT=1')
          print('KB_GITHUB_SECRET_SCHEMA=PASS')
          PY
          echo 'present=1' >> "$GITHUB_OUTPUT"

      - name: Install current Supabase CLI
        if: steps.source.outputs.present == '1'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version
          npx --yes supabase@latest secrets set --help >/tmp/secrets-set-help.txt
          grep -q -- '--project-ref' /tmp/secrets-set-help.txt

      - name: Install tenant API keys into target Edge runtime
        if: steps.source.outputs.present == '1'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets set --project-ref "$PROJECT_REF" \
            KB_SINGAPORE_TENANT_API_KEYS_JSON="$KB_KEYS" \
            KB_SINGAPORE_API_KEY_HEADER=x-api-key
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" --output json >/tmp/secrets.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/secrets.json')); names={str(x.get('name') or '') for x in rows}
          for k in ('KB_SINGAPORE_TENANT_API_KEYS_JSON','KB_SINGAPORE_API_KEY_HEADER'):
              assert k in names,k
          print('PASS target Singapore KB secret names installed')
          PY

      - name: Verify governed Vertex assist runtime config names
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets list --project-ref "$PROJECT_REF" --output json >/tmp/secrets-all.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/secrets-all.json')); names={str(x.get('name') or '') for x in rows}
          required=['LLM_PROVIDER','LLM_MODEL_ASSIST','GOOGLE_SERVICE_ACCOUNT_JSON','GOOGLE_PROJECT_ID','GOOGLE_REGION']
          missing=[x for x in required if x not in names]
          print('VERTEX_ASSIST_CONFIG_NAMES=' + ('PASS' if not missing else 'MISSING:'+','.join(missing)))
          if missing: raise SystemExit(2)
          print('PASS governed Vertex assist config names present')
          PY

      - name: Credential closure status
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.source.outputs.present }}" != '1' ]; then
            echo 'STOP: KB_SINGAPORE_TENANT_API_KEYS_JSON absent from GitHub Actions secret store and target Supabase runtime'
            exit 3
          fi
          echo 'PASS Task 5.3 credential wiring closure'
