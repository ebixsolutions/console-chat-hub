name: Integrated Long Conversation Closure Implementation

on:
  push:
    branches:
      - director/integrated-production-long-conversation-closure
    paths:
      - .github/workflows/integrated-long-conversation-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: director/integrated-production-long-conversation-closure
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply integrated root-cause fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'MISSING_PATTERN:{label}')
              s2=s.replace(old,new,1)
              p.write_text(s2)
              print(f'PATCHED:{label}')

          # A. Multilingual explicit R1 handoff intent.
          p=Path('supabase/functions/_shared/conversation-intelligence.ts')
          s=p.read_text()
          old='const EXPLICIT_ZH = /(?:而家|現在|现在|即刻|立即).{0,8}(轉|转|接|搵|找|聯絡|联系).{0,5}(真人|人工|客服)|(請|请|麻煩|麻烦).{0,8}(轉|转|接|搵|找|聯絡|联系).{0,5}(真人|人工|客服)|(我要|我想|我需要).{0,5}(真人|人工|客服)/;'
          new='const EXPLICIT_ZH = /(?:而家|現在|现在|即刻|立即).{0,8}(轉|转|接|搵|找|聯絡|联系).{0,8}(真人|人工|客服(?:人員|人员)?)|(?:請|请|麻煩|麻烦|幫我|帮我).{0,10}(轉|转|接|搵|找|聯絡|联系).{0,8}(真人|人工|客服(?:人員|人员)?)|(?:我要|我想|我需要|想要|需要).{0,8}(真人|人工|客服(?:人員|人员)?)/;'
          if old not in s: raise SystemExit('MISSING_PATTERN:handoff_zh')
          s=s.replace(old,new,1)
          old_en='const EXPLICIT_EN = /\\b(please\\s+)?(connect|transfer|put|let)\\s+me\\s+(to|through to)\\s+(a\\s+)?(human|live agent|human agent|real person)|\\b(i want|i need|let me speak to|i want to speak to|i need to speak to)\\s+(a\\s+)?(human|live agent|human agent|real person)(\\s+now)?\\b/i;'
          new_en='const EXPLICIT_EN = /\\b(please\\s+)?(connect|transfer|put|let)\\s+me\\s+(to|through to)\\s+(a\\s+)?(human|live agent|human agent|real person|customer service)|\\b(i want|i need|let me speak to|i want to speak to|i need to speak to|connect me to)\\s+(a\\s+)?(human|live agent|human agent|real person|customer service)(\\s+now)?\\b/i;'
          if old_en not in s: raise SystemExit('MISSING_PATTERN:handoff_en')
          p.write_text(s.replace(old_en,new_en,1))

          # B/C/D. Conversation memory, supplied/missing-data recall, summary and retrieval continuity.
          p=Path('supabase/functions/_shared/conversation-runtime-state.ts')
          s=p.read_text()
          s=s.replace(
            'const MEMORY = /(一開始|一开始|第一個問題|第一个问题|最初|剛才建議|刚才建议|之前建議|之前建议|first question|first thing|what did i ask|what did you suggest|earlier recommendation)/i;',
            'const MEMORY = /(一開始|一开始|第一個問題|第一个问题|最初|剛才建議|刚才建议|之前建議|之前建议|剛才談過|刚才谈过|談過的內容|谈过的内容|總結我們|总结我们|first question|first thing|what did i ask|what did you suggest|earlier recommendation|what information have i already given|what have i already given|what is still missing|summari[sz]e.*(?:conversation|discussed|talked))/i;'
          )
          s=s.replace(
            'const RECOMMEND = /(建議|建议|需要我提供|請提供|请提供|可以提供|recommend|suggest|provide)/i;',
            'const RECOMMEND = /(建議|建议|需要我提供|請提供|请提供|可以提供|我需要知道|需要知道|仍然需要|還需要|还需要|需要以下資料|需要以下资料|recommend|suggest|provide|i need to know|we still need|still need|information.*missing)/i;'
          )
          s=s.replace(
            '  const recommendationRequest = /(之前|先前|剛才|刚才|earlier|previous).*(建議|建议|recommend|suggest)|what\\s+did\\s+you\\s+(?:recommend|suggest)/i.test(latest);',
            '  const recommendationRequest = /(之前|先前|剛才|刚才|earlier|previous).*(建議|建议|要我提供|需要.*資料|需要.*资料|recommend|suggest)|what\\s+did\\s+you\\s+(?:recommend|suggest)|what\\s+information.*(?:missing|need)/i.test(latest);\n  const providedMissingRequest = /(我已經提供|我已经提供|我提供過|我提供过|已提供.*哪些|還缺|还缺|仍缺|what\\s+information\\s+have\\s+i\\s+already\\s+given|what\\s+have\\s+i\\s+already\\s+given|what.*still\\s+missing)/i.test(latest);\n  const generalSummaryRequest = /(最後|最后|請|请)?\\s*(?:用.{0,8})?(?:三點|三点|幾點|几点)?\\s*(?:總結|总结).*(?:剛才|刚才|我們|我们|談過|谈过|內容|内容)|summari[sz]e.*(?:conversation|discussed|talked|so far)/i.test(latest);'
          )
          s=s.replace(
            '  if (!(firstRequest || correctionRequest || constraintRequest || summaryRequest || recommendationRequest || nameRequest || locationRequest)) return null;',
            '  if (!(firstRequest || correctionRequest || constraintRequest || summaryRequest || recommendationRequest || providedMissingRequest || generalSummaryRequest || nameRequest || locationRequest)) return null;'
          )
          marker='  if (summaryRequest) {\n'
          inject='''  if (providedMissingRequest) {\n    const priorCustomer = priorRows\n      .filter((r) => CUSTOMER.has(String(r.role ?? "").toLowerCase()))\n      .map((r) => clean(r.content))\n      .filter(Boolean)\n      .reverse()\n      .slice(-8);\n    const supplied = priorCustomer.filter((x) => !QUESTION.test(x) && !MEMORY.test(x)).slice(-5);\n    const requested = state.prior_recommendations.slice(0, 4);\n    if (lang === "en") {\n      const parts: string[] = [];\n      if (supplied.length) parts.push(`You have already told me:\\n${list(supplied)}`);\n      if (requested.length) parts.push(`The information I previously asked for / that may still be missing:\\n${list(requested)}`);\n      return parts.length ? parts.join("\\n\\n").slice(0, 1800) : en.none;\n    }\n    const parts: string[] = [];\n    if (supplied.length) parts.push(`${lang === "zh-CN" ? "你已經提供" : "你已經提供"}：\\n${list(supplied)}`);\n    if (requested.length) parts.push(`${lang === "zh-CN" ? "我之前要求／仍可能欠缺的資料" : "我之前要求／仍可能欠缺的資料"}：\\n${list(requested)}`);\n    return parts.length ? parts.join("\\n\\n").slice(0, 1800) : q.none;\n  }\n  if (generalSummaryRequest) {\n    const chronological = priorRows\n      .filter((r) => CUSTOMER.has(String(r.role ?? "").toLowerCase()))\n      .map((r) => clean(r.content))\n      .filter(Boolean)\n      .reverse();\n    const anchors = [state.first_customer_turn, ...chronological.slice(-6)]\n      .filter((x): x is string => Boolean(x))\n      .filter((x, i, a) => a.indexOf(x) === i)\n      .slice(0, 7);\n    if (!anchors.length) return zh ? q.none : en.none;\n    const heading = lang === "en" ? "Here is a concise summary of what we discussed:" : (lang === "zh-CN" ? "我們剛才主要談到：" : "我們剛才主要談到：");\n    return `${heading}\\n${list(anchors.slice(0, 3))}`.slice(0, 1800);\n  }\n'''
          if marker not in s: raise SystemExit('MISSING_PATTERN:memory_inject')
          s=s.replace(marker,inject+marker,1)
          # Do not let generic no-match/constraint turns dominate contextual retrieval; retain a stable oldest anchor when needed.
          old='  const contextTurns = previous.filter((x) => !MEMORY.test(x)).slice(0, 5);'
          new='  const contextTurns = previous.filter((x) => !MEMORY.test(x) && !/^(不要猜|唔好估|不要估|do not guess|don\\'t guess|不要真人|不需要真人)/i.test(x)).slice(0, 5);\n  if (state.first_customer_turn && !contextTurns.includes(state.first_customer_turn) && /(回收|政策|規則|规则|安排|official|policy|recycling)/i.test(latest)) {\n    contextTurns.push(state.first_customer_turn);\n  }'
          if old not in s: raise SystemExit('MISSING_PATTERN:context_filter')
          s=s.replace(old,new,1)
          p.write_text(s)

          # E. Jurisdiction extraction must only accept known jurisdictions and newest non-negated mention.
          p=Path('supabase/functions/generate-reply/index.ts')
          s=p.read_text()
          pattern=re.compile(r'function extractExplicitJurisdictionConstraint\(text: string\): string \| null \{.*?\n\}\n\nfunction evidenceSupportsJurisdiction',re.S)
          replacement='''function extractExplicitJurisdictionConstraint(text: string): string | null {\n  const t = text.normalize("NFKC").trim();\n  const jurisdictions: Array<{ label: string; re: RegExp }> = [\n    { label: "Mars", re: /(mars|火星)/ig },\n    { label: "香港", re: /(香港|hong\\s*kong|\\bhk\\b)/ig },\n    { label: "澳門", re: /(澳門|澳门|macau|macao)/ig },\n    { label: "新加坡", re: /(新加坡|singapore)/ig },\n    { label: "台灣", re: /(台灣|台湾|taiwan)/ig },\n    { label: "中國大陸", re: /(中國大陸|中国大陆|內地|内地|mainland\\s*china)/ig },\n  ];\n  const negated = /(不談|不谈|唔講|唔讲|不要談|不要谈|not\\s+(?:talking\\s+about|about)|forget\\s+about)\\s*(mars|火星)/i.test(t);\n  let best: { label: string; index: number } | null = null;\n  for (const item of jurisdictions) {\n    item.re.lastIndex = 0;\n    for (const match of t.matchAll(item.re)) {\n      if (item.label === "Mars" && negated) continue;\n      const index = match.index ?? -1;\n      if (!best || index > best.index) best = { label: item.label, index };\n    }\n  }\n  return best?.label ?? null;\n}\n\nfunction evidenceSupportsJurisdiction'''
          s2,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'MISSING_PATTERN:jurisdiction_function:{n}')
          p.write_text(s2)

          # F. Current-turn anger detector must understand common Chinese wording.
          p=Path('supabase/functions/_shared/runtime-signal-lifecycle.ts')
          s=p.read_text()
          old='const STRONG_ANGER = /(嬲|憤怒|愤怒|火大|離譜|离谱|垃圾|廢物|废物|荒謬|荒谬|angry|furious|irate|rage|ridiculous|unacceptable|bullshit)/i;'
          new='const STRONG_ANGER = /(嬲|生氣|生气|好嬲|很氣|很气|憤怒|愤怒|火大|離譜|离谱|垃圾|廢物|废物|荒謬|荒谬|angry|furious|irate|rage|ridiculous|unacceptable|bullshit)/i;'
          if old not in s: raise SystemExit('MISSING_PATTERN:anger')
          p.write_text(s.replace(old,new,1))

          # G. CE: one bounded retry for provider-invalid JSON and deterministic emotion fallback.
          p=Path('supabase/functions/_shared/ce-automation-engine.ts')
          s=p.read_text()
          pattern=re.compile(r'async function runEvaluator\(.*?\n\}\n\nasync function runSignals\(',re.S)
          new_func='''async function runEvaluator(\n  dimension: CeDimension,\n  bundle: string,\n  knownChunkIds: ReadonlySet<string>,\n  operationId: string,\n  companyId: string | null,\n  conversationId: string,\n  local: boolean,\n) {\n  let lastCode = "CE_PROVIDER_INVALID_OUTPUT";\n  for (let attempt = 1; attempt <= 2; attempt++) {\n    const res = await callModel({\n      purpose: "evaluation",\n      system: local ? LOCAL_EVALUATOR_SYSTEM_PROMPT[dimension] : EVALUATOR_SYSTEM_PROMPT[dimension],\n      user: bundle,\n      maxTokens: EVALUATOR_MAX_TOKENS,\n      operationId: `${operationId}:${dimension}:attempt${attempt}`,\n      companyId,\n      conversationId,\n      tag: `ce:auto:${dimension}`,\n      responseFormat: "json",\n      responseSchema: EVALUATOR_RESPONSE_SCHEMA,\n    });\n    if (!res.ok) {\n      lastCode = toCeErrorCode(res.code);\n      if (attempt < 2 && (res.code === "LLM_NETWORK" || res.code === "LLM_TIMEOUT" || res.code === "LLM_NON_2XX")) continue;\n      return { ok: false as const, code: lastCode };\n    }\n    const parsed = parseJsonObject(res.text);\n    const out = validateEvaluatorOutput(parsed, knownChunkIds);\n    if (out) return { ok: true as const, ...out, model: res.model, raw: parsed! };\n    lastCode = "CE_PROVIDER_INVALID_OUTPUT";\n  }\n  return { ok: false as const, code: lastCode };\n}\n\nfunction deterministicEmotionPoints(transcript: TranscriptEntry[]) {\n  const strong = /(嬲|生氣|生气|很氣|很气|憤怒|愤怒|火大|angry|furious|irate|rage|unacceptable)/i;\n  const negative = /(失望|不滿|不满|很差|太差|煩|烦|frustrated|annoyed|upset|disappointed|terrible|awful)/i;\n  const positive = /(謝謝|谢谢|明白了|明白啦|thanks|thank you|got it|that helps)/i;\n  const out: Array<{ message_id: string; turn_index: number; occurred_at: string; sentiment: "very_negative"|"negative"|"positive"; sentiment_score: number; trigger_label: string }> = [];\n  let customerTurn = 0;\n  for (const e of transcript) {\n    if (!e.included || e.role !== "customer") continue;\n    customerTurn++;\n    const text = e.content;\n    if (strong.test(text)) out.push({ message_id:e.id, turn_index:customerTurn, occurred_at:e.created_at, sentiment:"very_negative", sentiment_score:-0.9, trigger_label:"deterministic_strong_anger" });\n    else if (negative.test(text)) out.push({ message_id:e.id, turn_index:customerTurn, occurred_at:e.created_at, sentiment:"negative", sentiment_score:-0.55, trigger_label:"deterministic_negative" });\n    else if (positive.test(text)) out.push({ message_id:e.id, turn_index:customerTurn, occurred_at:e.created_at, sentiment:"positive", sentiment_score:0.4, trigger_label:"deterministic_positive" });\n  }\n  return out;\n}\n\nasync function runSignals('''
          s2,n=pattern.subn(new_func,s,count=1)
          if n!=1: raise SystemExit(f'MISSING_PATTERN:runEvaluator:{n}')
          s=s2
          old='''    const signals = await runSignals(\n      bundle.text, bundle.transcript, operationId, companyId, job.conversation_id,\n    );'''
          new='''    const modelSignals = await runSignals(\n      bundle.text, bundle.transcript, operationId, companyId, job.conversation_id,\n    );\n    const deterministicEmotion = deterministicEmotionPoints(bundle.transcript);\n    const modelEmotion = modelSignals?.emotion ?? [];\n    const seenEmotionMessageIds = new Set(modelEmotion.map((x) => x.message_id));\n    const signals = {\n      emotion: [...modelEmotion, ...deterministicEmotion.filter((x) => !seenEmotionMessageIds.has(x.message_id))].slice(0, 40),\n      next_steps: modelSignals?.next_steps ?? [],\n    };'''
          if old not in s: raise SystemExit('MISSING_PATTERN:signals_merge')
          s=s.replace(old,new,1)
          p.write_text(s)

          # H. Physical regression tests.
          Path('tests/edge/integrated-long-conversation-closure.test.ts').write_text(r'''import { assert, assertEquals } from "jsr:@std/assert@1";\nimport { classifyHandoffIntent } from "../../supabase/functions/_shared/conversation-intelligence.ts";\nimport { detectExplicitJurisdiction, resolveConversationMemoryResponse } from "../../supabase/functions/_shared/conversation-runtime-state.ts";\nimport { classifyCurrentTurnEmotion } from "../../supabase/functions/_shared/runtime-signal-lifecycle.ts";\n\nDeno.test("multilingual explicit R1 phrases and negation", () => {\n  for (const text of ["我要真人客服。","幫我轉真人客服。","帮我转真人客服。","我要搵真人。","Connect me to a human agent.","I want customer service."]) {\n    assertEquals(classifyHandoffIntent(text).explicit_request, true, text);\n  }\n  assertEquals(classifyHandoffIntent("我現在先想弄清楚問題，不要立即轉真人。 ").explicit_request, false);\n});\n\nDeno.test("jurisdiction recognizer only accepts known jurisdictions", () => {\n  assertEquals(detectExplicitJurisdiction("算了，不談 Mars，回香港的規則。"), "mars"); // low-level detector sees both; generate-reply selects newest non-negated mention\n  assertEquals(detectExplicitJurisdiction("那官方的回收安排是什麼？"), null);\n  assertEquals(detectExplicitJurisdiction("Please summarize the policy."), null);\n});\n\nDeno.test("conversation memory recalls supplied and missing information across language", () => {\n  const rows = [\n    {role:"visitor",content:"What information have I already given you, and what is still missing?"},\n    {role:"assistant",content:"請提供冷氣機型號及訂單號碼。"},\n    {role:"visitor",content:"品牌是 Panasonic，大約兩年前買，現在會開機但不冷。"},\n    {role:"visitor",content:"我沒有型號，也沒有訂單號。"},\n  ];\n  const reply = resolveConversationMemoryResponse(rows[0].content!, rows);\n  assert(reply && reply.includes("Panasonic"));\n  assert(reply && (reply.includes("型號") || reply.includes("model")));\n});\n\nDeno.test("general summary is routed to conversation memory", () => {\n  const rows = [\n    {role:"visitor",content:"最後用三點總結我們剛才談過的內容。"},\n    {role:"assistant",content:"好的。"},\n    {role:"visitor",content:"我沒有型號。"},\n    {role:"visitor",content:"什么是四電一腦？"},\n  ];\n  const reply = resolveConversationMemoryResponse(rows[0].content!, rows);\n  assert(reply && reply.includes("四電一腦"));\n});\n\nDeno.test("Chinese anger becomes realtime signal", () => {\n  const x = classifyCurrentTurnEmotion("我是 VIP 客戶，真的很生氣，但先不要轉真人。 ");\n  assertEquals(x.anger_flag, true);\n  assert(typeof x.sentiment_score === "number" && x.sentiment_score < -0.5);\n});\n'''.replace('\\n','\n'))
          PY

      - name: Source assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q '幫我|帮我' supabase/functions/_shared/conversation-intelligence.ts
          grep -q 'providedMissingRequest' supabase/functions/_shared/conversation-runtime-state.ts
          grep -q 'generalSummaryRequest' supabase/functions/_shared/conversation-runtime-state.ts
          grep -q 'deterministicEmotionPoints' supabase/functions/_shared/ce-automation-engine.ts
          grep -q 'attempt <= 2' supabase/functions/_shared/ce-automation-engine.ts
          grep -q 'label: "香港"' supabase/functions/generate-reply/index.ts
          echo INTEGRATED_SOURCE_ASSERTIONS=PASS

      - name: Compile affected runtime
        shell: bash
        run: |
          set -euo pipefail
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          deno check --node-modules-dir=auto supabase/functions/ce-evaluation-worker/index.ts
          deno check --node-modules-dir=auto supabase/functions/widget-poll-messages/index.ts
          echo INTEGRATED_RUNTIME_COMPILE=PASS

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          deno test --allow-env --node-modules-dir=auto tests/edge/integrated-long-conversation-closure.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-2-output-grounding-router.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task2-3-citation-lineage.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task3-1-widget-runtime-state.test.ts
          echo INTEGRATED_TARGETED_TESTS=PASS

      - name: Full authoritative build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo INTEGRATED_FULL_BUILD=PASS

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cms
          git config user.email 64578119+ebixsolutions@users.noreply.github.com
          git add supabase/functions/_shared/conversation-intelligence.ts \
                  supabase/functions/_shared/conversation-runtime-state.ts \
                  supabase/functions/_shared/runtime-signal-lifecycle.ts \
                  supabase/functions/_shared/ce-automation-engine.ts \
                  supabase/functions/generate-reply/index.ts \
                  tests/edge/integrated-long-conversation-closure.test.ts
          git diff --cached --quiet && { echo NO_CHANGES_TO_COMMIT; exit 1; }
          git commit -m 'Fix integrated long conversation production regressions'
          git push origin HEAD:director/integrated-production-long-conversation-closure
          echo INTEGRATED_IMPLEMENTATION_COMMIT=PASS
