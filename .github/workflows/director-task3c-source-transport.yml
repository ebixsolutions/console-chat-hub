name: Director Task3C exact source transport
on:
  push:
    branches: [director/ai-abc-c3-long-memory-final-cutover]
    paths: [.github/workflows/director-task3c-source-transport.yml]
permissions:
  contents: read
jobs:
  source-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch original test SDK only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-sdk"
          npm install --prefix "$RUNNER_TEMP/edge-sdk" --no-audit --no-fund @supabase/supabase-js@2.45.0
          cd "$RUNNER_TEMP"
          tar -czf edge-sdk.tar.gz edge-sdk
          sha256sum edge-sdk.tar.gz > edge-sdk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: director-task3c-exact-edge-sdk
          path: |
            ${{ runner.temp }}/edge-sdk.tar.gz
            ${{ runner.temp }}/edge-sdk.sha256
          retention-days: 3
