name: Director Task 2 Semantic Regression Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/director-task2-semantic-regression-deploy.yml'
      - 'supabase/functions/_shared/conversation-semantic-contract.ts'
      - 'tests/edge/task2-standalone-simplify-regression.test.ts'

permissions:
  contents: read

env:
  PROJECT_REF: nrfxhqabwblzxoushgnm
  PROD_ORIGIN: https://console-chat-hub.lovable.app
  CHANNEL_ID: b0000000-0000-0000-0000-000000000001
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  task2-final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Regression classification and affected runtime tests
        shell: bash
        run: |
          set -euo pipefail
          deno test --allow-read --node-modules-dir=auto tests/edge/task2-standalone-simplify-regression.test.ts
          deno test --allow-env --allow-read --node-modules-dir=auto tests/edge/round2-task1-conversation-semantic-contract.test.ts
          deno test --allow-env --node-modules-dir=auto tests/edge/task4-1-director-transform-isolation.test.ts
          deno test --allow-read --node-modules-dir=auto tests/edge/task4-1-current-context-memory.test.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/conversation-semantic-contract.ts
          deno check --node-modules-dir=auto supabase/functions/_shared/prior-grounded-transform.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          echo DIRECTOR_TASK2_SEMANTIC_REGRESSION=PASS

      - name: Full authoritative build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          echo DIRECTOR_TASK2_BUILD=PASS

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Capture exact production rollback bundle
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          SNAP=/tmp/task2-rollback
          rm -rf "$SNAP"
          mkdir -p "$SNAP/supabase"
          cp supabase/config.toml "$SNAP/supabase/config.toml"
          supabase functions list --project-ref "$PROJECT_REF" | tee "$SNAP/PREDEPLOY_FUNCTION_LIST.txt"
          grep -q 'generate-reply' "$SNAP/PREDEPLOY_FUNCTION_LIST.txt"
          cd "$SNAP"
          supabase functions download generate-reply --project-ref "$PROJECT_REF" --use-api
          ENTRY="$(find "$SNAP" -type f -path '*/generate-reply/index.ts' -print -quit)"
          test -n "$ENTRY"
          test -s "$ENTRY"
          FUNCTION_DIR="$(dirname "$ENTRY")"
          FUNCTIONS_ROOT="$(dirname "$FUNCTION_DIR")"
          test -d "$FUNCTIONS_ROOT/_shared"
          cd "$SNAP"
          find . -type f -not -name 'ROLLBACK_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > ROLLBACK_SHA256SUMS.txt
          sha256sum -c ROLLBACK_SHA256SUMS.txt
          deno check --node-modules-dir=auto "$ENTRY"
          test "$(find "$FUNCTIONS_ROOT" -type f -empty | wc -l | tr -d ' ')" -eq 0
          echo DIRECTOR_TASK2_ROLLBACK_SNAPSHOT=PASS

      - name: Archive rollback bundle
        uses: actions/upload-artifact@v4
        with:
          name: task2-generate-reply-predeploy-rollback
          path: /tmp/task2-rollback
          if-no-files-found: error
          retention-days: 30

      - name: Deploy generate-reply semantic fix
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/task2-postdeploy-functions.txt
          grep -q 'generate-reply' /tmp/task2-postdeploy-functions.txt
          echo DIRECTOR_TASK2_DEPLOY=PASS

      - name: Targeted T01-T02 production regression
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          python scripts/director_task4_1_t01_t02_smoke.py
          echo DIRECTOR_TASK2_T01_T02=PASS

      - name: Roll back on deploy or smoke failure
        if: ${{ failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          SNAP=/tmp/task2-rollback
          cd "$SNAP"
          sha256sum -c ROLLBACK_SHA256SUMS.txt
          supabase functions deploy generate-reply --project-ref "$PROJECT_REF" --use-api
          supabase functions list --project-ref "$PROJECT_REF" | grep -q 'generate-reply'
          echo DIRECTOR_TASK2_ROLLBACK=PASS

      - name: Final Task 2 deploy gate
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/task2-rollback/ROLLBACK_SHA256SUMS.txt
          test -s /tmp/task2-postdeploy-functions.txt
          echo DIRECTOR_TASK2_DEPLOY_GATE=PASS
