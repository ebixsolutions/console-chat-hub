name: Director Warm Handoff R2 Call-chain Fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/director-warm-handoff-r2-callchain-fix.py'
permissions:
  contents: write
jobs:
  fix-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: nrfxhqabwblzxoushgnm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Apply root-cause fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ebixsolutions'
          git config user.email '64578119+ebixsolutions@users.noreply.github.com'
          python scripts/director-warm-handoff-r2-callchain-fix.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('supabase/functions/generate-reply/index.ts').read_text()
          calls=s.split('evaluateAndPersistRequiredRulesLive(supabaseAdmin, {')[1:]
          r2cap=0; wired=0
          for part in calls:
              head=part.split('\n    });',1)[0]
              if 'rag_match_state: _pr5RagMatchState,' in head:
                  r2cap += 1
                  if 'warm_handoff_question:' in head: wired += 1
          assert r2cap >= 3,(r2cap,wired)
          assert wired == r2cap,(r2cap,wired)
          assert 'warm_handoff_question: _warmHandoffQuestion ?? undefined' in s
          print(f'ALL_EARLY_R2_CAPABLE_REQUIRED_RULE_CALLS_WIRED={wired}/{r2cap}=PASS')
          print('FINAL_R2_REQUIRED_RULE_CALL_WIRED=PASS')
          PY
      - name: Regression and compile
        shell: bash
        run: |
          set -euo pipefail
          deno test --allow-read tests/edge/warm-handoff-package.test.ts
          deno test --allow-read --allow-env --node-modules-dir=auto tests/edge/task2-human-language-transform-regression.test.ts
          deno check --node-modules-dir=auto supabase/functions/generate-reply/index.ts
          npm ci
          npm run build
          git diff --check
          echo R2_CALLCHAIN_SOURCE_FINAL_GATE=PASS
      - name: Commit exact functional file
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/generate-reply/index.ts
          test "$(git diff --cached --name-only)" = 'supabase/functions/generate-reply/index.ts'
          git diff --cached --check
          git commit -m '[director] wire warm handoff collection into all R2 runtime branches'
          git push origin HEAD:main
          echo R2_CALLCHAIN_EXACT_SOURCE_COMMIT=PASS
      - name: Redeploy generate-reply only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 functions deploy generate-reply --project-ref "$PROJECT_REF"
          echo GENERATE_REPLY_R2_CALLCHAIN_DEPLOY=PASS
